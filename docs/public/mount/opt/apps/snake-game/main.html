<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; background: #1a1a1a; color: #eee; font-family: -apple-system, sans-serif; font-size: 13px; }
  .bar { display: flex; gap: 16px; align-items: center; padding: 10px; }
  .bar span { font-variant-numeric: tabular-nums; }
  #board { background: #111; border-radius: 6px; box-shadow: 0 0 0 1px #333; }
  .wrap { position: relative; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(0,0,0,0.7); border-radius: 6px; }
  .overlay button { border: none; background: #2ecc71; color: #fff; border-radius: 6px; padding: 8px 18px; cursor: pointer; font-size: 13px; }
  .hint { padding: 6px; color: #999; font-size: 11px; }
</style>
</head>
<body>
  <div class="bar">
    <span id="score">Score: 0</span>
    <span id="best">Best: 0</span>
  </div>
  <div class="wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <div id="overlayMsg"></div>
      <button id="playAgain">Play Again</button>
    </div>
  </div>
  <div class="hint">Arrow keys to steer</div>

<script>
const GRID = 20;
const CELL = 18;
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
canvas.width = GRID * CELL;
canvas.height = GRID * CELL;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayMsg = document.getElementById('overlayMsg');
const playAgainBtn = document.getElementById('playAgain');

const HIGHSCORE_PATH = '/home/user1/.local/share/snake-game/highscore.txt';

let snake, dir, nextDir, food, score, best = 0, alive, timer;

function randCell() {
  return { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
}

function spawnFood() {
  let p;
  do { p = randCell(); } while (snake.some(s => s.x === p.x && s.y === p.y));
  food = p;
}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  alive = true;
  spawnFood();
  scoreEl.textContent = 'Score: 0';
  overlay.style.display = 'none';
  draw();
}

function tick() {
  if (!alive) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Score: ' + score;
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  alive = false;
  overlayMsg.textContent = 'Game Over — Score: ' + score;
  overlay.style.display = 'flex';
  if (score > best) {
    best = score;
    bestEl.textContent = 'Best: ' + best;
    AppSDK.writeText(HIGHSCORE_PATH, String(best)).catch(() => {});
  }
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x * CELL, food.y * CELL, CELL - 1, CELL - 1);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 1, CELL - 1);
  });
}

document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (key === 'ArrowUp' && dir.y === 0) nextDir = { x: 0, y: -1 };
  else if (key === 'ArrowDown' && dir.y === 0) nextDir = { x: 0, y: 1 };
  else if (key === 'ArrowLeft' && dir.x === 0) nextDir = { x: -1, y: 0 };
  else if (key === 'ArrowRight' && dir.x === 0) nextDir = { x: 1, y: 0 };
  else return;
  e.preventDefault();
});

playAgainBtn.onclick = reset;

(async () => {
  try {
    if (await AppSDK.exists(HIGHSCORE_PATH)) {
      const text = await AppSDK.readText(HIGHSCORE_PATH);
      const n = parseInt(text, 10);
      if (!isNaN(n)) best = n;
    }
  } catch (err) {}
  bestEl.textContent = 'Best: ' + best;
  reset();
  timer = setInterval(tick, 120);
})();
</script>
</body>
</html>
