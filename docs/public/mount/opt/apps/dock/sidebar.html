<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- dock:height=480 -->
<!--
  Sidebar (vertical/left-edge) dock variant.

  Constraint note: the host (src/core/layout/index.tsx openVfsDock) always
  positions our iframe as `position:fixed;bottom:0;left:0;width:100%;
  height:<dock:height>px` and slides it via `transform:translateY(...)` on
  proximity to the BOTTOM of the viewport - there is no equivalent "left edge"
  hot-corner or width-based sizing hook, and (verified empirically) content
  inside a sandboxed iframe cannot visually paint outside that host-assigned
  box no matter what internal CSS is used (position:fixed/height:100vh inside
  an iframe resolve against the IFRAME's own viewport, which the browser
  clips to the iframe's rendered box on the parent page - there is no "escape
  hatch"). So instead of trying to cover the full screen height, this variant:
    1. Declares a generous-but-bounded height (480px, enough for ~7-8 stacked
       icons plus breathing room) instead of the ~72-80px other docks use -
       tall enough to read as a real vertical dock, not so tall that the
       (necessarily full-width) invisible hit-box of the iframe swallows
       clicks across most of the screen while shown.
    2. Renders its own visible content as a narrow pill hugging the LEFT edge
       only (`justify-content:flex-start`), leaving the rest of the box fully
       transparent - so even though the underlying iframe rectangle is
       full-width, the dock *reads* purely as a left-edge vertical strip.
    3. Vertically centers the icon column within that 480px band
       (`align-items:center`), so it hangs up from the bottom-left corner
       looking like a compact, edge-attached dock (matching real-world
       elementary OS "Plank" left-edge docks, which are also compact/
       edge-centered rather than literally 100vh tall).
  This is a genuine engineering trade-off (documented instead of hidden): the
  auto-hide reveal trigger is still bottom-edge-proximity (inherited from the
  shared host logic), not left-edge-proximity, since that logic lives in
  layout/index.tsx which this task must not touch.
-->
<title>Dock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: transparent;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  font-family: system-ui, sans-serif;
}
#dock {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 14px 8px;
  background: rgba(18, 18, 20, 0.80);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.10);
  border-left: none;
  border-radius: 0 20px 20px 0;
  max-height: 100%;
  overflow-y: auto;
  scrollbar-width: none;
}
#dock::-webkit-scrollbar { display: none; }
.sep {
  width: 28px;
  height: 1px;
  background: rgba(255,255,255,0.14);
  margin: 2px 0;
  flex-shrink: 0;
}
.item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border-radius: 12px;
  width: 44px;
  height: 44px;
  transition: background 0.12s;
  user-select: none;
  flex-shrink: 0;
}
.item:hover { background: rgba(255,255,255,0.12); }
.item.active { background: rgba(255,255,255,0.16); }
.item.minimized { opacity: 0.5; }
.item .icon {
  font-family: 'Material Symbols Outlined', sans-serif;
  font-size: 24px;
  line-height: 1;
  color: rgba(255,255,255,0.90);
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
}
.item.active .icon { color: #fff; font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
/* Left-edge running indicator bar (Ubuntu/GNOME-dock style), not a bottom dot */
.bar {
  position: absolute;
  left: -8px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 6px;
  border-radius: 2px;
  background: rgba(255,255,255,0.75);
  transition: height 0.15s;
}
.item.active .bar { height: 18px; background: #fff; }
.item:not(.running) .bar { display: none; }
/* Tooltip label revealed to the right of the icon on hover instead of a
   permanent label under the icon (structurally different from macos.html) */
.tip {
  position: absolute;
  left: calc(100% + 10px);
  top: 50%;
  transform: translateY(-50%);
  background: rgba(20,20,22,0.92);
  color: #fff;
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
}
.item:hover .tip { opacity: 1; }
</style>
</head>
<body>
<div id="dock"></div>
<script>
(function () {
  var pending = new Map(), counter = 0, listeners = new Map();
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'wos-ipc-response') {
      var cb = pending.get(e.data.id);
      if (!cb) return;
      pending.delete(e.data.id);
      e.data.error ? cb.reject(new Error(e.data.error)) : cb.resolve(e.data.result);
    } else if (e.data.type === 'wos-ipc-event') {
      (listeners.get(e.data.event) || []).forEach(function(h) { h(e.data.data); });
    }
  });
  var ipc = {
    call: function(ev, data) {
      return new Promise(function(resolve, reject) {
        var id = 'wos-' + (++counter);
        pending.set(id, { resolve: resolve, reject: reject });
        var target = window !== window.parent ? window.parent : window.top;
        target.postMessage({ type: 'wos-ipc', id: id, event: ev, data: data }, '*');
      });
    },
    on: function(ev, handler) {
      if (!listeners.has(ev)) listeners.set(ev, []);
      listeners.get(ev).push(handler);
    }
  };

  var DOCK_ID = 'sidebar';
  var SCHEMA = [
    { key: 'bg-color', label: 'Background color', type: 'color', value: 'rgba(18,18,20,0.80)' },
    { key: 'icon-size', label: 'Icon size', type: 'range', value: 44, min: 32, max: 60, step: 2 },
    { key: 'opacity', label: 'Opacity', type: 'range', value: 1, min: 0.2, max: 1, step: 0.05 },
  ];

  var dock = document.getElementById('dock');
  var launchItems = [];   // [{name, label, icon, cmd}]
  var openWindows  = [];  // [{pid, name, title, icon, minimized, active}]
  var launching = {};     // cooldown map to prevent double-open on rapid clicks

  function applySettings() {
    var bg = SCHEMA.find(function(e){return e.key==='bg-color';}).value;
    var sz = SCHEMA.find(function(e){return e.key==='icon-size';}).value;
    var op = SCHEMA.find(function(e){return e.key==='opacity';}).value;
    dock.style.background = bg;
    document.documentElement.style.setProperty('--item-size', sz + 'px');
    dock.style.opacity = op;
    document.querySelectorAll('.item').forEach(function(el) {
      el.style.width = sz + 'px';
      el.style.height = sz + 'px';
    });
  }

  ipc.on('dock.settingChanged', function(d) {
    var entry = SCHEMA.find(function(e){return e.key===d.key;});
    if (entry) entry.value = d.value;
    applySettings();
    render();
  });

  ipc.call('fs.readText', { path: '/etc/dock/' + DOCK_ID + '.json' })
    .then(function(txt) {
      var saved = JSON.parse(txt);
      SCHEMA.forEach(function(e) { if (saved[e.key] !== undefined) e.value = saved[e.key]; });
    })
    .catch(function() {})
    .then(function() {
      applySettings();
      ipc.call('dock.registerSettings', { dockId: DOCK_ID, schema: SCHEMA }).catch(function(){});
    });

  function makeItem(className, icon, label, running, onclick) {
    var sz = SCHEMA.find(function(e){return e.key==='icon-size';}).value;
    var el = document.createElement('div');
    el.className = className + (running ? ' running' : '');
    el.style.width = sz + 'px';
    el.style.height = sz + 'px';
    el.innerHTML =
      '<span class="bar"></span>' +
      '<span class="icon">' + icon + '</span>' +
      '<span class="tip">' + label + '</span>';
    el.onclick = onclick;
    return el;
  }

  function render() {
    dock.innerHTML = '';

    // Pinned launchers, stacked vertically
    launchItems.forEach(function(item) {
      var win = openWindows.find(function(w) { return w.name === item.name; });
      var cls = 'item' + (win ? ' running' : '') + (win && win.active ? ' active' : '') + (win && win.minimized ? ' minimized' : '');
      var el = makeItem(cls, item.icon, item.label, !!win, function() {
        if (win) { ipc.call('wm.toggleWindow', { pid: win.pid }); return; }
        var now = Date.now();
        if (launching[item.name] && now - launching[item.name] < 1200) return;
        launching[item.name] = now;
        ipc.call('wm.launch', { name: item.name });
      });
      dock.appendChild(el);
    });

    // Extra open windows not in the pinned list, below a horizontal separator
    var pinned = launchItems.map(function(i) { return i.name; });
    var extras = openWindows.filter(function(w) { return pinned.indexOf(w.name) === -1; });
    if (extras.length && launchItems.length) {
      var sep = document.createElement('div'); sep.className = 'sep'; dock.appendChild(sep);
    }
    extras.forEach(function(w) {
      var cls = 'item running' + (w.active ? ' active' : '') + (w.minimized ? ' minimized' : '');
      var el = makeItem(cls, w.icon || 'apps', w.title || w.name, true, function() {
        ipc.call('wm.toggleWindow', { pid: w.pid });
      });
      dock.appendChild(el);
    });
  }

  // Bootstrap
  Promise.all([
    ipc.call('wm.getLaunchItems').catch(function() { return []; }),
    ipc.call('wm.getWindows').catch(function() { return []; })
  ]).then(function(results) {
    launchItems  = results[0] || [];
    openWindows  = results[1] || [];
    render();
  });

  ipc.on('wm.windowsChanged', function(wins) {
    openWindows = wins || [];
    render();
  });
})();
</script>
</body>
</html>
