<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- dock:height=80 -->
<title>Dock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  border-top: 1px solid rgba(255,255,255,0.30);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, sans-serif;
}
#dock {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 16px;
  height: 100%;
}
.sep {
  width: 1px;
  height: 40px;
  background: rgba(0,0,0,0.15);
  margin: 0 8px;
  flex-shrink: 0;
}
.item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  border-radius: 10px;
  padding: 5px 9px 7px;
  min-width: 52px;
  transition: background 0.12s, transform 0.15s cubic-bezier(.34,1.56,.64,1);
  user-select: none;
}
.item:hover { transform: scale(1.12) translateY(-4px); background: rgba(0,0,0,0.07); }
.item.active  { background: rgba(0,0,0,0.09); }
.item.minimized { opacity: 0.5; }
.item .icon {
  font-family: 'Material Symbols Outlined', sans-serif;
  font-size: 30px;
  line-height: 1;
  color: rgba(0,0,0,0.82);
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 30;
}
.item.active .icon { color: #000; font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 30; }
.label {
  font-size: 9px;
  color: rgba(0,0,0,0.6);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 60px;
  text-align: center;
  font-weight: 500;
  letter-spacing: 0.01em;
}
.item.active .label { color: rgba(0,0,0,0.85); }
.dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  position: absolute;
  bottom: 2px;
}
.item:not(.running) .dot { display: none; }
</style>
</head>
<body>
<div id="dock"></div>
<script>
(function () {
  var pending = new Map(), counter = 0, listeners = new Map();
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'wos-ipc-response') {
      var cb = pending.get(e.data.id);
      if (!cb) return;
      pending.delete(e.data.id);
      e.data.error ? cb.reject(new Error(e.data.error)) : cb.resolve(e.data.result);
    } else if (e.data.type === 'wos-ipc-event') {
      (listeners.get(e.data.event) || []).forEach(function(h) { h(e.data.data); });
    }
  });
  var ipc = {
    call: function(ev, data) {
      return new Promise(function(resolve, reject) {
        var id = 'wos-' + (++counter);
        pending.set(id, { resolve: resolve, reject: reject });
        var target = window !== window.parent ? window.parent : window.top;
        target.postMessage({ type: 'wos-ipc', id: id, event: ev, data: data }, '*');
      });
    },
    on: function(ev, handler) {
      if (!listeners.has(ev)) listeners.set(ev, []);
      listeners.get(ev).push(handler);
    }
  };

  var DOCK_ID = 'macos';
  var SCHEMA = [
    { key: 'bg-color', label: 'Background color', type: 'color', value: 'rgba(255,255,255,0.18)' },
    { key: 'opacity', label: 'Opacity', type: 'range', value: 1, min: 0.2, max: 1, step: 0.05 },
  ];

  var dock = document.getElementById('dock');
  var launchItems = [];
  var openWindows  = [];
  var launching = {};

  function applySettings() {
    var bg = SCHEMA.find(function(e){return e.key==='bg-color';}).value;
    var op = SCHEMA.find(function(e){return e.key==='opacity';}).value;
    document.body.style.background = bg;
    document.documentElement.style.opacity = op;
  }

  ipc.on('dock.settingChanged', function(d) {
    var entry = SCHEMA.find(function(e){return e.key===d.key;});
    if (entry) entry.value = d.value;
    applySettings();
  });

  ipc.call('fs.readText', { path: '/etc/dock/' + DOCK_ID + '.json' })
    .then(function(txt) {
      var saved = JSON.parse(txt);
      SCHEMA.forEach(function(e) { if (saved[e.key] !== undefined) e.value = saved[e.key]; });
    })
    .catch(function() {})
    .then(function() {
      applySettings();
      ipc.call('dock.registerSettings', { dockId: DOCK_ID, schema: SCHEMA }).catch(function(){});
    });

  function render() {
    dock.innerHTML = '';

    launchItems.forEach(function(item) {
      var win = openWindows.find(function(w) { return w.name === item.name; });
      var el = document.createElement('div');
      el.className = 'item' + (win ? ' running' : '') + (win && win.active ? ' active' : '') + (win && win.minimized ? ' minimized' : '');
      el.title = item.label;
      el.innerHTML =
        '<span class="icon">' + item.icon + '</span>' +
        '<span class="label">' + item.label + '</span>' +
        '<span class="dot"></span>';
      el.onclick = function() {
        if (win) { ipc.call('wm.toggleWindow', { pid: win.pid }); return; }
        var now = Date.now();
        if (launching[item.name] && now - launching[item.name] < 1200) return;
        launching[item.name] = now;
        ipc.call('wm.launch', { name: item.name });
      };
      dock.appendChild(el);
    });

    var pinned = launchItems.map(function(i) { return i.name; });
    var extras = openWindows.filter(function(w) { return pinned.indexOf(w.name) === -1; });
    if (extras.length && launchItems.length) {
      var sep = document.createElement('div'); sep.className = 'sep'; dock.appendChild(sep);
    }
    extras.forEach(function(w) {
      var el = document.createElement('div');
      el.className = 'item running' + (w.active ? ' active' : '') + (w.minimized ? ' minimized' : '');
      el.title = w.title || w.name;
      el.innerHTML =
        '<span class="icon">' + (w.icon || 'apps') + '</span>' +
        '<span class="label">' + (w.title || w.name) + '</span>' +
        '<span class="dot"></span>';
      el.onclick = function() { ipc.call('wm.toggleWindow', { pid: w.pid }); };
      dock.appendChild(el);
    });
  }

  Promise.all([
    ipc.call('wm.getLaunchItems').catch(function() { return []; }),
    ipc.call('wm.getWindows').catch(function() { return []; })
  ]).then(function(results) {
    launchItems  = results[0] || [];
    openWindows  = results[1] || [];
    render();
  });

  ipc.on('wm.windowsChanged', function(wins) {
    openWindows = wins || [];
    render();
  });
})();
</script>
</body>
</html>
