<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dock</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: transparent; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
#dock {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px 16px 6px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 20px 20px 0 0;
  border-bottom: none;
  box-shadow: 0 -4px 32px rgba(0,0,0,0.2);
}
.win-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
  position: relative;
}
.win-icon:hover { transform: scale(1.35) translateY(-8px); }
.win-icon .icon {
  font-family: 'Material Symbols Outlined', sans-serif;
  font-size: 32px;
  color: #fff;
  background: linear-gradient(160deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
  border-radius: 12px;
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  text-shadow: 0 1px 2px rgba(0,0,0,0.4);
}
.win-icon.active .icon { background: linear-gradient(160deg, rgba(10,132,255,0.4), rgba(10,132,255,0.1)); }
.win-icon.minimized { opacity: 0.5; }
.win-icon .dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(255,255,255,0.8);
}
.win-icon.minimized .dot { background: rgba(255,255,255,0.3); }
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined');
</style>
</head>
<body>
<div id="dock"></div>
<script>
(function () {
  var pending = new Map(), counter = 0, listeners = new Map();
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'wos-ipc-response') {
      var cb = pending.get(e.data.id);
      if (!cb) return;
      pending.delete(e.data.id);
      e.data.error ? cb.reject(new Error(e.data.error)) : cb.resolve(e.data.result);
    } else if (e.data.type === 'wos-ipc-event') {
      (listeners.get(e.data.event) || []).forEach(function(h) { h(e.data.data); });
    }
  });
  var ipc = {
    call: function(ev, data) {
      return new Promise(function(resolve, reject) {
        var id = 'wos-' + (++counter);
        pending.set(id, { resolve: resolve, reject: reject });
        var target = window !== window.parent ? window.parent : window.top;
        target.postMessage({ type: 'wos-ipc', id: id, event: ev, data: data }, '*');
      });
    },
    on: function(ev, handler) {
      if (!listeners.has(ev)) listeners.set(ev, []);
      listeners.get(ev).push(handler);
    }
  };

  var dock = document.getElementById('dock');

  function render(wins) {
    dock.innerHTML = '';
    wins.forEach(function(w) {
      var item = document.createElement('div');
      item.className = 'win-icon' + (w.active ? ' active' : '') + (w.minimized ? ' minimized' : '');
      item.title = w.title || w.name;
      item.innerHTML =
        '<span class="icon">' + (w.icon || 'apps') + '</span>' +
        '<span class="dot"></span>';
      item.onclick = function() { ipc.call('wm.toggleWindow', { pid: w.pid }); };
      dock.appendChild(item);
    });
  }

  ipc.call('wm.getWindows').then(render).catch(function() {});
  ipc.on('wm.windowsChanged', render);
})();
</script>
</body>
</html>
