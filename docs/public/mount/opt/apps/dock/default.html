<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- dock:height=72 -->
<title>Dock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: transparent;
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-family: system-ui, sans-serif;
}
#dock {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  background: rgba(20, 20, 22, 0.78);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 18px;
}
.sep {
  width: 1px;
  height: 32px;
  background: rgba(255,255,255,0.12);
  margin: 0 4px;
  flex-shrink: 0;
}
.item {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  border-radius: 10px;
  padding: 4px 6px;
  transition: background 0.12s, transform 0.15s cubic-bezier(.34,1.56,.64,1);
  user-select: none;
}
.item:hover { transform: scale(1.18) translateY(-3px); background: rgba(255,255,255,0.10); }
.item.active  { background: rgba(255,255,255,0.13); }
.item.minimized { opacity: 0.55; }
.item .icon {
  font-family: 'Material Symbols Outlined', sans-serif;
  font-size: 28px;
  line-height: 1;
  color: rgba(255,255,255,0.92);
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 28;
}
.item.active .icon { color: #fff; font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 28; }
.dot {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: rgba(255,255,255,0.7);
  position: absolute;
  bottom: 1px;
}
.item:not(.running) .dot { display: none; }
</style>
</head>
<body>
<div id="dock"></div>
<script>
(function () {
  var pending = new Map(), counter = 0, listeners = new Map();
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'wos-ipc-response') {
      var cb = pending.get(e.data.id);
      if (!cb) return;
      pending.delete(e.data.id);
      e.data.error ? cb.reject(new Error(e.data.error)) : cb.resolve(e.data.result);
    } else if (e.data.type === 'wos-ipc-event') {
      (listeners.get(e.data.event) || []).forEach(function(h) { h(e.data.data); });
    }
  });
  var ipc = {
    call: function(ev, data) {
      return new Promise(function(resolve, reject) {
        var id = 'wos-' + (++counter);
        pending.set(id, { resolve: resolve, reject: reject });
        var target = window !== window.parent ? window.parent : window.top;
        target.postMessage({ type: 'wos-ipc', id: id, event: ev, data: data }, '*');
      });
    },
    on: function(ev, handler) {
      if (!listeners.has(ev)) listeners.set(ev, []);
      listeners.get(ev).push(handler);
    }
  };

  var DOCK_ID = 'default';
  var SCHEMA = [
    { key: 'bg-color', label: 'Background color', type: 'color', value: 'rgba(20,20,22,0.78)' },
    { key: 'border-radius', label: 'Border radius', type: 'range', value: 18, min: 0, max: 30, step: 1 },
    { key: 'opacity', label: 'Opacity', type: 'range', value: 1, min: 0.2, max: 1, step: 0.05 },
  ];

  var dock = document.getElementById('dock');
  var launchItems = [];   // [{name, label, icon, cmd}]
  var openWindows  = [];  // [{pid, name, title, icon, minimized, active}]
  var launching = {};     // cooldown map to prevent double-open on rapid clicks

  function applySettings() {
    var bg = SCHEMA.find(function(e){return e.key==='bg-color';}).value;
    var r = SCHEMA.find(function(e){return e.key==='border-radius';}).value;
    var op = SCHEMA.find(function(e){return e.key==='opacity';}).value;
    dock.style.background = bg;
    dock.style.borderRadius = r + 'px';
    dock.style.opacity = op;
  }

  ipc.on('dock.settingChanged', function(d) {
    var entry = SCHEMA.find(function(e){return e.key===d.key;});
    if (entry) entry.value = d.value;
    applySettings();
  });

  ipc.call('fs.readText', { path: '/etc/dock/' + DOCK_ID + '.json' })
    .then(function(txt) {
      var saved = JSON.parse(txt);
      SCHEMA.forEach(function(e) { if (saved[e.key] !== undefined) e.value = saved[e.key]; });
    })
    .catch(function() {})
    .then(function() {
      applySettings();
      ipc.call('dock.registerSettings', { dockId: DOCK_ID, schema: SCHEMA }).catch(function(){});
    });

  function render() {
    dock.innerHTML = '';

    // Pinned launchers
    launchItems.forEach(function(item) {
      var win = openWindows.find(function(w) { return w.name === item.name; });
      var el = document.createElement('div');
      el.className = 'item' + (win ? ' running' : '') + (win && win.active ? ' active' : '') + (win && win.minimized ? ' minimized' : '');
      el.title = item.label;
      el.innerHTML = '<span class="icon">' + item.icon + '</span><span class="dot"></span>';
      el.onclick = function() {
        if (win) { ipc.call('wm.toggleWindow', { pid: win.pid }); return; }
        var now = Date.now();
        if (launching[item.name] && now - launching[item.name] < 1200) return;
        launching[item.name] = now;
        ipc.call('wm.launch', { name: item.name });
      };
      dock.appendChild(el);
    });

    // Extra open windows not in pinned list
    var pinned = launchItems.map(function(i) { return i.name; });
    var extras = openWindows.filter(function(w) { return pinned.indexOf(w.name) === -1; });
    if (extras.length && launchItems.length) {
      var sep = document.createElement('div'); sep.className = 'sep'; dock.appendChild(sep);
    }
    extras.forEach(function(w) {
      var el = document.createElement('div');
      el.className = 'item running' + (w.active ? ' active' : '') + (w.minimized ? ' minimized' : '');
      el.title = w.title || w.name;
      el.innerHTML = '<span class="icon">' + (w.icon || 'apps') + '</span><span class="dot"></span>';
      el.onclick = function() { ipc.call('wm.toggleWindow', { pid: w.pid }); };
      dock.appendChild(el);
    });
  }

  // Bootstrap
  Promise.all([
    ipc.call('wm.getLaunchItems').catch(function() { return []; }),
    ipc.call('wm.getWindows').catch(function() { return []; })
  ]).then(function(results) {
    launchItems  = results[0] || [];
    openWindows  = results[1] || [];
    render();
  });

  ipc.on('wm.windowsChanged', function(wins) {
    openWindows = wins || [];
    render();
  });
})();
</script>
</body>
</html>
