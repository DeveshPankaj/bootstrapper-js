<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { margin: 0; font-family: -apple-system, sans-serif; font-size: 13px; color: #1d1d1f; background: #fafafa; display: flex; flex-direction: column; height: 100vh; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #f5f5f7; border-bottom: 1px solid #d8d8dc; }
  .bar button { border: none; background: #e4e4e8; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  .bar button.primary { background: #0a84ff; color: #fff; }
  .main { flex: 1; display: flex; gap: 14px; padding: 14px; overflow: auto; }
  canvas { background: #111; border-radius: 8px; }
  .stats { font-size: 12px; color: #444; line-height: 1.8; }
  .stats b { color: #000; }
</style>
</head>
<body>
  <div class="bar">
    <button id="train100" class="primary">Train 100 episodes</button>
    <button id="train1000" class="primary">Train 1000 episodes</button>
    <button id="watch">Watch trained agent</button>
    <button id="reset">Reset Q-table</button>
  </div>
  <div class="main">
    <canvas id="canvas" width="360" height="360"></canvas>
    <div class="stats" id="stats"></div>
  </div>

<script>
const GRID = 18, CELL = 20;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statsEl = document.getElementById('stats');

const DIRS = [{ x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 0, y: -1 }]; // right,down,left,up

const Q = {};
const ALPHA = 0.15, GAMMA = 0.9;
let epsilon = 1.0;
let episode = 0;
let bestScore = 0;
let lastScores = [];

function qOf(state) { return (Q[state] ??= [0, 0, 0]); }

function newGame() {
  const start = { x: Math.floor(GRID / 2), y: Math.floor(GRID / 2) };
  return { snake: [start], dirIdx: 0, food: randomFood([start]), score: 0, steps: 0 };
}

function randomFood(snake) {
  while (true) {
    const f = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) return f;
  }
}

function willCollide(game, dirIdx) {
  const d = DIRS[dirIdx];
  const head = game.snake[0];
  const nx = head.x + d.x, ny = head.y + d.y;
  if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) return true;
  return game.snake.some((s, i) => i < game.snake.length - 1 && s.x === nx && s.y === ny);
}

function stateKey(game) {
  const straight = game.dirIdx;
  const left = (game.dirIdx + 3) % 4;
  const right = (game.dirIdx + 1) % 4;
  const dangerS = willCollide(game, straight) ? 1 : 0;
  const dangerL = willCollide(game, left) ? 1 : 0;
  const dangerR = willCollide(game, right) ? 1 : 0;
  const head = game.snake[0];
  const foodDx = Math.sign(game.food.x - head.x);
  const foodDy = Math.sign(game.food.y - head.y);
  return `${dangerS}${dangerL}${dangerR}|${game.dirIdx}|${foodDx}${foodDy}`;
}

// action: 0 = straight, 1 = turn left, 2 = turn right (relative to current heading)
function applyAction(game, action) {
  if (action === 1) game.dirIdx = (game.dirIdx + 3) % 4;
  if (action === 2) game.dirIdx = (game.dirIdx + 1) % 4;
  const d = DIRS[game.dirIdx];
  const head = game.snake[0];
  const next = { x: head.x + d.x, y: head.y + d.y };
  game.steps++;

  if (next.x < 0 || next.y < 0 || next.x >= GRID || next.y >= GRID || game.snake.some(s => s.x === next.x && s.y === next.y)) {
    return { reward: -1, done: true };
  }

  game.snake.unshift(next);
  if (next.x === game.food.x && next.y === game.food.y) {
    game.score++;
    game.food = randomFood(game.snake);
    return { reward: 1, done: false };
  }
  game.snake.pop();
  if (game.steps > GRID * GRID * 4) return { reward: -1, done: true };
  return { reward: -0.01, done: false };
}

function chooseAction(state, exploreEpsilon) {
  if (Math.random() < exploreEpsilon) return Math.floor(Math.random() * 3);
  const q = qOf(state);
  return q.indexOf(Math.max(...q));
}

function runEpisode(exploreEpsilon, render) {
  const game = newGame();
  let done = false;
  while (!done) {
    const state = stateKey(game);
    const action = chooseAction(state, exploreEpsilon);
    const { reward, done: over } = applyAction(game, action);
    const nextState = stateKey(game);
    const q = qOf(state);
    const nextMax = Math.max(...qOf(nextState));
    q[action] += ALPHA * (reward + GAMMA * nextMax - q[action]);
    done = over;
    if (render) drawGame(game);
  }
  return game.score;
}

function drawGame(game) {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff453a';
  ctx.fillRect(game.food.x * CELL, game.food.y * CELL, CELL - 1, CELL - 1);
  game.snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#30d158' : '#0a84ff';
    ctx.fillRect(s.x * CELL, s.y * CELL, CELL - 1, CELL - 1);
  });
}

function updateStats() {
  const avg = lastScores.length ? (lastScores.reduce((a, b) => a + b, 0) / lastScores.length).toFixed(2) : '0';
  statsEl.innerHTML = `
    Episodes trained: <b>${episode}</b><br/>
    Epsilon: <b>${epsilon.toFixed(3)}</b><br/>
    Best score: <b>${bestScore}</b><br/>
    Avg score (last ${lastScores.length}): <b>${avg}</b><br/>
    Q-table states: <b>${Object.keys(Q).length}</b>
  `;
}

async function logMetric(value) {
  const path = '/home/user1/.local/share/trainboard/log.jsonl';
  try {
    const existing = (await AppSDK.exists(path)) ? await AppSDK.readText(path) : '';
    const line = JSON.stringify({ run: window.__run, step: episode, metric: 'reward', value }) + '\n';
    await AppSDK.writeText(path, existing + line);
  } catch (_) { /* logging is best-effort */ }
}

async function train(count) {
  const chunk = 50;
  for (let i = 0; i < count; i += chunk) {
    for (let j = 0; j < Math.min(chunk, count - i); j++) {
      epsilon = Math.max(0.02, epsilon * 0.997);
      const score = runEpisode(epsilon, false);
      episode++;
      bestScore = Math.max(bestScore, score);
      lastScores.push(score);
      if (lastScores.length > 100) lastScores.shift();
      if (episode % 10 === 0) await logMetric(score);
    }
    updateStats();
    await new Promise(r => setTimeout(r, 0)); // yield to keep the UI responsive
  }
  runEpisode(0, true); // show one greedy episode's final frame
}

async function watch() {
  const game = newGame();
  let done = false;
  while (!done) {
    const state = stateKey(game);
    const action = chooseAction(state, 0);
    const { done: over } = applyAction(game, action);
    drawGame(game);
    done = over;
    await new Promise(r => setTimeout(r, 60));
  }
}

document.getElementById('train100').onclick = () => train(100);
document.getElementById('train1000').onclick = () => train(1000);
document.getElementById('watch').onclick = watch;
document.getElementById('reset').onclick = () => {
  Object.keys(Q).forEach(k => delete Q[k]);
  epsilon = 1.0; episode = 0; bestScore = 0; lastScores = [];
  updateStats();
};

window.__run = `snake-qlearning-${Date.now()}`;
drawGame(newGame());
updateStats();
AppSDK.setTitle('Snake AI (Q-Learning)');
</script>
</body>
</html>
