<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Python Demo</title>

  <!-- CodeMirror 5 — simple CDN, Python mode + one-dark theme + line numbers -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0f0f14; color: #e2e2e9;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* CodeMirror overrides — fill the container */
    .CodeMirror {
      height: 100% !important;
      font-family: 'JetBrains Mono', 'Fira Code', 'Menlo', monospace !important;
      font-size: 12.5px !important;
      line-height: 1.7 !important;
    }
    .CodeMirror-scroll { height: 100%; }

    /* ── Header ── */
    #header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #1a1a24;
      border-bottom: 1px solid #2a2a3a; flex-shrink: 0;
    }
    #header .logo { font-size: 18px; font-weight: 700; color: #a78bfa; letter-spacing: -0.5px; }
    #header .subtitle { font-size: 12px; color: #6b7280; }
    .status {
      margin-left: auto; font-size: 11px; padding: 3px 9px;
      border-radius: 20px; font-weight: 500;
    }
    .status.loading { background: #1e293b; color: #94a3b8; }
    .status.ready   { background: #14532d; color: #86efac; }
    .status.running { background: #1e1b4b; color: #c4b5fd; }
    .status.error   { background: #450a0a; color: #fca5a5; }

    /* ── Layout ── */
    #main { flex: 1; display: flex; min-height: 0; }

    #sidebar {
      width: 180px; background: #13131c; border-right: 1px solid #2a2a3a;
      display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
    }
    #sidebar h3 {
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #6b7280; padding: 12px 12px 6px;
    }
    .example-btn {
      display: flex; flex-direction: column; gap: 2px;
      padding: 9px 12px; cursor: pointer; border-left: 3px solid transparent;
      user-select: none; transition: background 0.1s;
    }
    .example-btn:hover  { background: #1e1e2e; }
    .example-btn.active { background: #1e1e2e; border-left-color: #a78bfa; }
    .example-btn .ex-title { font-size: 12.5px; font-weight: 500; color: #d1d5db; }
    .example-btn .ex-desc  { font-size: 10.5px; color: #6b7280; line-height: 1.3; }

    #workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

    /* ── Editor ── */
    #editor-wrap { flex: 1; display: flex; flex-direction: column; min-height: 40px; overflow: hidden; }
    #editor-toolbar {
      display: flex; align-items: center; gap: 8px; padding: 6px 10px;
      background: #1a1a24; border-bottom: 1px solid #2a2a3a; flex-shrink: 0;
    }
    #editor-toolbar span { font-size: 11px; color: #6b7280; }
    #run-btn {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      padding: 5px 14px; background: #6d28d9; color: #fff; border: none;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    #run-btn:hover:not(:disabled) { background: #7c3aed; }
    #run-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #clear-btn {
      padding: 5px 10px; background: transparent; color: #6b7280;
      border: 1px solid #2a2a3a; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    #clear-btn:hover { color: #d1d5db; border-color: #4b5563; }

    /* CM host div fills editor-wrap */
    #cm-host { flex: 1; overflow: hidden; position: relative; }
    #cm-host .CodeMirror { position: absolute; inset: 0; }

    /* ── Resize handle (VSCode-style) ── */
    #resize-handle {
      height: 5px; flex-shrink: 0; cursor: ns-resize;
      background: #1e1e2e; border-top: 1px solid #2a2a3a; border-bottom: 1px solid #2a2a3a;
      position: relative; transition: background 0.12s; user-select: none;
    }
    #resize-handle:hover, #resize-handle.dragging { background: #6d28d9; }
    #resize-handle::after {
      content: ''; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 3px; border-radius: 2px; background: #4b5563;
    }
    #resize-handle:hover::after, #resize-handle.dragging::after { background: #c4b5fd; }

    /* ── Output panel ── */
    #output-panel {
      flex-shrink: 0; height: 200px; min-height: 60px;
      display: flex; flex-direction: column;
    }
    #output-toolbar {
      display: flex; align-items: center; gap: 6px; padding: 5px 10px;
      background: #1a1a24; border-bottom: 1px solid #2a2a3a; flex-shrink: 0;
      font-size: 11px; color: #6b7280;
    }
    #output-tabs { display: flex; gap: 4px; margin-left: auto; }
    .out-tab {
      padding: 3px 10px; border-radius: 4px; font-size: 11px;
      cursor: pointer; color: #6b7280; border: 1px solid transparent;
    }
    .out-tab.active { background: #2a2a3a; color: #d1d5db; border-color: #3a3a4a; }
    #output-body { flex: 1; display: flex; min-height: 0; }
    #preview {
      flex: 1; padding: 16px; overflow: auto;
      display: flex; flex-direction: column; gap: 8px; background: #16161f;
    }
    #preview.hidden { display: none; }
    #console {
      flex: 1; padding: 10px 14px; overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11.5px; line-height: 1.7; background: #0d0d14;
    }
    #console.hidden { display: none; }
    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.stdout { color: #d1fae5; }
    .log-line.stderr { color: #fca5a5; }
    .log-line.info   { color: #6b7280; font-style: italic; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: fixed; inset: 0; background: rgba(10,10,20,0.88);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; z-index: 100; backdrop-filter: blur(4px);
    }
    #loading-overlay.hidden { display: none; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #2a2a3a;
      border-top-color: #a78bfa; border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-overlay p { font-size: 13px; color: #9ca3af; }
    #loading-overlay small { font-size: 11px; color: #4b5563; }
  </style>
</head>
<body>

  <div id="header">
    <span class="logo">py</span>
    <div>
      <div style="font-size:13px;font-weight:600;color:#e2e2e9;">Python Demo</div>
      <div class="subtitle">Pyodide · DOM manipulation from Python</div>
    </div>
    <span id="status" class="status loading">Loading Pyodide…</span>
  </div>

  <div id="main">
    <div id="sidebar"><h3>Examples</h3></div>

    <div id="workspace">
      <div id="editor-wrap">
        <div id="editor-toolbar">
          <span>editor.py &nbsp;·&nbsp; Ctrl+Enter to run</span>
          <button id="clear-btn">Clear output</button>
          <button id="run-btn" disabled>▶ Run</button>
        </div>
        <div id="cm-host"></div>
      </div>

      <div id="resize-handle" title="Drag to resize · Double-click to expand"></div>

      <div id="output-panel">
        <div id="output-toolbar">
          Output
          <div id="output-tabs">
            <div class="out-tab active" data-tab="preview">Preview</div>
            <div class="out-tab" data-tab="console">Console</div>
          </div>
        </div>
        <div id="output-body">
          <div id="preview"></div>
          <div id="console" class="hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Loading Pyodide runtime…</p>
    <small>First load may take ~5 seconds</small>
  </div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
    const EXAMPLES = [
      {
        id: 'button',
        title: '1. Create a button',
        desc: 'Render a DOM button from Python',
        code: `# Python can create HTML elements using the js module.
# Pyodide bridges Python ↔ JavaScript seamlessly.

from js import document

btn = document.createElement('button')
btn.textContent = 'Hello from Python! \U0001f44b'

output = document.getElementById('preview')
output.appendChild(btn)

print('Button created and added to the DOM.')`,
      },
      {
        id: 'css',
        title: '2. Attach CSS',
        desc: 'Style elements with Python',
        code: `# Apply styles via element.style (inline) or a <style> tag.

from js import document

# ── Inline styles ───────────────────────────────────────────────────────
btn = document.createElement('button')
btn.textContent = 'Styled with Python \U0001f3a8'
btn.style.backgroundColor = '#6d28d9'
btn.style.color           = '#ffffff'
btn.style.padding         = '10px 22px'
btn.style.border          = 'none'
btn.style.borderRadius    = '8px'
btn.style.fontSize        = '14px'
btn.style.cursor          = 'pointer'

# ── Inject a <style> tag (class-based CSS) ──────────────────
style = document.createElement('style')
style.textContent = """
  .py-card {
    background: #1e1b4b; border: 1px solid #4c1d95;
    border-radius: 10px; padding: 14px 18px; margin-top: 10px;
    font-size: 13px; color: #c4b5fd; max-width: 320px;
  }
"""
document.head.appendChild(style)

card = document.createElement('div')
card.className = 'py-card'
card.textContent = 'This card is styled via a <style> tag injected from Python.'

output = document.getElementById('preview')
output.appendChild(btn)
output.appendChild(card)

print('Done — inline + <style> tag both work!')`,
      },
      {
        id: 'click',
        title: '3. Click listener',
        desc: 'Handle button clicks in Python',
        code: `# create_proxy() wraps a Python function as a persistent JS callback.
# Without it, Pyodide creates a *borrowed* proxy that is destroyed
# after the call, causing a crash when the event fires later.

from js import document
from pyodide.ffi import create_proxy

output = document.getElementById('preview')
count = [0]

display = document.createElement('div')
display.textContent = 'Clicks: 0'
display.style.cssText = (
    'font-size:28px;font-weight:700;color:#a78bfa;'
    'margin-bottom:10px;font-variant-numeric:tabular-nums;'
)

btn = document.createElement('button')
btn.textContent = 'Click me!'
btn.style.cssText = (
    'background:#7c3aed;color:#fff;border:none;'
    'padding:10px 24px;border-radius:8px;'
    'font-size:14px;font-weight:600;cursor:pointer;'
)

def on_click(event):
    count[0] += 1
    display.textContent = f'Clicks: {count[0]}'
    btn.style.backgroundColor = f'hsl({(count[0] * 37) % 360}, 70%, 50%)'

btn.addEventListener('click', create_proxy(on_click))
output.appendChild(display)
output.appendChild(btn)

print('Click listener attached. Try clicking the button!')`,
      },
      {
        id: 'full',
        title: '4. Full example',
        desc: 'CSS + DOM + listeners combined',
        code: `# Mini Todo widget — DOM, CSS, and events all from Python.

from js import document
from pyodide.ffi import create_proxy

output = document.getElementById('preview')

style = document.createElement('style')
style.textContent = """
  .py-todo { max-width: 340px; font-family: system-ui, sans-serif; }
  .py-todo-title { font-size:15px;font-weight:700;color:#e2e8f0;margin-bottom:10px; }
  .py-todo-row   { display:flex;gap:6px;margin-bottom:10px; }
  .py-todo-inp   { flex:1;background:#1e1e2e;border:1px solid #3a3a4a;
                   border-radius:6px;padding:7px 10px;color:#e2e8f0;
                   font-size:12.5px;outline:none; }
  .py-todo-add   { background:#6d28d9;color:#fff;border:none;border-radius:6px;
                   padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer; }
  .py-todo-list  { list-style:none;display:flex;flex-direction:column;gap:5px; }
  .py-todo-item  { display:flex;align-items:center;gap:8px;background:#1a1a24;
                   border-radius:7px;padding:7px 10px;font-size:12.5px;
                   color:#d1d5db;cursor:pointer; }
  .py-todo-item.done { text-decoration:line-through;color:#4b5563; }
  .dot { width:10px;height:10px;border-radius:50%;
         border:2px solid #6d28d9;flex-shrink:0; }
  .done .dot { background:#6d28d9; }
"""
document.head.appendChild(style)

wrap    = document.createElement('div');  wrap.className = 'py-todo'
title   = document.createElement('div');  title.className = 'py-todo-title'; title.innerHTML = '✅ Python Todo'
row     = document.createElement('div');  row.className = 'py-todo-row'
inp     = document.createElement('input'); inp.className = 'py-todo-inp'; inp.placeholder = 'Add a task…'
add_btn = document.createElement('button'); add_btn.className = 'py-todo-add'; add_btn.textContent = 'Add'
ul      = document.createElement('ul');   ul.className = 'py-todo-list'
row.appendChild(inp); row.appendChild(add_btn)
wrap.appendChild(title); wrap.appendChild(row); wrap.appendChild(ul)
output.appendChild(wrap)

items = []

def render():
    ul.innerHTML = ''
    for i, (text, done) in enumerate(items):
        li  = document.createElement('li')
        li.className = 'py-todo-item' + (' done' if done else '')
        dot = document.createElement('span'); dot.className = 'dot'
        lbl = document.createElement('span'); lbl.textContent = text
        li.appendChild(dot); li.appendChild(lbl)
        def make_toggle(idx):
            def toggle(e): items[idx] = (items[idx][0], not items[idx][1]); render()
            return create_proxy(toggle)
        li.addEventListener('click', make_toggle(i))
        ul.appendChild(li)

def add_item(e=None):
    text = str(inp.value).strip()
    if text: items.append((text, False)); inp.value = ''; render()

add_btn.addEventListener('click', create_proxy(add_item))
inp.addEventListener('keydown', create_proxy(lambda e: add_item() if e.key == 'Enter' else None))
for t in ['Open a window','Render a button','Attach CSS','Add click listener']:
    items.append((t, False))
render()
print('Todo widget ready — click to toggle, add your own tasks.')`,
      },
      {
        id: 'window',
        title: '5. Open a window',
        desc: 'Spawn a detached OS window from Python',
        code: `# Opening a detached window from Python:
#
#   bridge = window.__pyBridge   (injected by main.js, which has platform access)
#
#   1. create_proxy(fn)  → persistent JS-callable Pyodide proxy
#   2. to_js(dict, ...)  → real JS object (raw Python dicts become *borrowed*
#      proxies, destroyed after the call, crashing command.meta reads later)
#   3. bridge.registerCommand(name, proxy, meta)
#      → stored in platform.host.commands
#   4. bridge.openWindow(name)
#      → window manager creates iframe; on load calls command.exec(body, props)
#      → proxy fires — Python receives body + props and builds the UI

from js import window, document, Object
from pyodide.ffi import create_proxy, to_js

bridge = window.__pyBridge
_N = [0]

def render_my_window(body, props, *_):
    # body / props are borrowed — use only within this synchronous call
    _N[0] += 1; n = _N[0]
    doc = body.ownerDocument

    props.setTitle(f'Python Window #{n}')
    props.setWindowView(True)   # required — window starts hidden

    style = doc.createElement('style')
    style.textContent = """
      * { box-sizing:border-box; margin:0; padding:0; }
      body { font-family:system-ui,sans-serif; background:#0f0f14;
             color:#e2e8f0; padding:24px; }
      h2   { font-size:16px; font-weight:700; color:#a78bfa; margin-bottom:16px; }
      p    { font-size:13px; color:#9ca3af; line-height:1.6; margin-bottom:16px; }
      .counter { font-size:48px; font-weight:800; color:#6d28d9;
                 text-align:center; padding:20px 0; }
      .btn-row { display:flex; gap:10px; }
      .btn { padding:9px 20px; border:none; border-radius:8px;
             font-size:13px; font-weight:600; cursor:pointer; color:#fff; }
      .inc { background:#6d28d9; } .inc:hover { background:#7c3aed; }
      .dec { background:#374151; } .dec:hover { background:#4b5563; }
    """
    doc.head.appendChild(style)

    h2 = doc.createElement('h2')
    h2.textContent = f'Python Window #{n}'
    body.appendChild(h2)

    p = doc.createElement('p')
    p.textContent = 'Built entirely from Python — CSS, DOM, and click listeners via Pyodide.'
    body.appendChild(p)

    count = [0]
    counter = doc.createElement('div')
    counter.className = 'counter'; counter.textContent = '0'
    body.appendChild(counter)

    row = doc.createElement('div'); row.className = 'btn-row'
    inc = doc.createElement('button'); inc.className = 'btn inc'; inc.textContent = '+ Increment'
    dec = doc.createElement('button'); dec.className = 'btn dec'; dec.textContent = '− Decrement'

    def on_inc(e): count[0] += 1; counter.textContent = str(count[0])
    def on_dec(e): count[0] -= 1; counter.textContent = str(count[0])

    inc.addEventListener('click', create_proxy(on_inc))
    dec.addEventListener('click', create_proxy(on_dec))
    row.appendChild(inc); row.appendChild(dec); body.appendChild(row)

# Register + open
_proxy = create_proxy(render_my_window)
_meta  = to_js({'title':'My Python Window','icon':'code','callable':True},
                dict_converter=Object.fromEntries)
bridge.registerCommand('ui.py-demo-window', _proxy, _meta)

output = document.getElementById('preview')
info = document.createElement('p')
info.style.cssText = 'font-size:12.5px;color:#6b7280;margin-bottom:12px;line-height:1.6;'
info.textContent = 'Command registered. Each click opens a new independent detached window.'
output.appendChild(info)

btn = document.createElement('button')
btn.textContent = '⊞  Open Python Window'
btn.style.cssText = ('background:#6d28d9;color:#fff;border:none;'
    'padding:10px 22px;border-radius:8px;font-size:14px;'
    'font-weight:600;cursor:pointer;display:block;margin-bottom:10px;')

def on_open(e): bridge.openWindow('ui.py-demo-window')
btn.addEventListener('click', create_proxy(on_open))
output.appendChild(btn)

print('Ready — each click opens a fresh detached window.')`,
      },
    ]

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const statusEl    = document.getElementById('status')
    const runBtn      = document.getElementById('run-btn')
    const clearBtn    = document.getElementById('clear-btn')
    const previewEl   = document.getElementById('preview')
    const consoleEl   = document.getElementById('console')
    const sidebar     = document.getElementById('sidebar')
    const overlay     = document.getElementById('loading-overlay')
    const tabs        = document.querySelectorAll('.out-tab')
    const outputPanel = document.getElementById('output-panel')
    const handle      = document.getElementById('resize-handle')
    const workspace   = document.getElementById('workspace')
    const cmHost      = document.getElementById('cm-host')

    // ── CodeMirror 5 editor ───────────────────────────────────────────────────
    const editor = CodeMirror(cmHost, {
      value: EXAMPLES[0].code,
      mode: 'python',
      theme: 'one-dark',
      lineNumbers: true,
      tabSize: 4,
      indentUnit: 4,
      indentWithTabs: false,
      lineWrapping: false,
      autofocus: false,
      extraKeys: {
        Tab: cm => cm.execCommand('indentMore'),
        'Shift-Tab': cm => cm.execCommand('indentLess'),
        'Ctrl-Enter': () => runCode(),
        'Cmd-Enter':  () => runCode(),
      },
    })
    editor.setSize('100%', '100%')

    // ── Tab switching ─────────────────────────────────────────────────────────
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'))
        tab.classList.add('active')
        const which = tab.dataset.tab
        previewEl.classList.toggle('hidden', which !== 'preview')
        consoleEl.classList.toggle('hidden', which !== 'console')
      })
    })

    // ── Console logging ───────────────────────────────────────────────────────
    const log = (text, cls = 'stdout') => {
      String(text).split('\n').forEach((line, i, arr) => {
        if (i === arr.length - 1 && line === '') return
        const d = document.createElement('div')
        d.className = 'log-line ' + cls
        d.textContent = line
        consoleEl.appendChild(d)
      })
      consoleEl.scrollTop = consoleEl.scrollHeight
    }

    // ── Sidebar ───────────────────────────────────────────────────────────────
    const loadExample = ex => {
      editor.setValue(ex.code)
      previewEl.innerHTML = ''
      consoleEl.innerHTML = ''
      document.querySelectorAll('.example-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.id === ex.id))
    }

    EXAMPLES.forEach(ex => {
      const btn = document.createElement('div')
      btn.className = 'example-btn'
      btn.dataset.id = ex.id
      btn.innerHTML = `<span class="ex-title">${ex.title}</span><span class="ex-desc">${ex.desc}</span>`
      btn.addEventListener('click', () => loadExample(ex))
      sidebar.appendChild(btn)
    })
    loadExample(EXAMPLES[0])

    // ── Draggable resize handle ───────────────────────────────────────────────
    let drag = null, prevH = 200

    handle.addEventListener('mousedown', e => {
      e.preventDefault()
      drag = { y: e.clientY, h: outputPanel.offsetHeight }
      handle.classList.add('dragging')
      document.body.style.cursor = 'ns-resize'
      document.body.style.userSelect = 'none'
    })

    document.addEventListener('mousemove', e => {
      if (!drag) return
      const dy = drag.y - e.clientY           // drag up → expand output
      const maxH = workspace.offsetHeight - 40
      outputPanel.style.height = Math.max(60, Math.min(maxH, drag.h + dy)) + 'px'
    })

    document.addEventListener('mouseup', () => {
      if (!drag) return
      drag = null
      handle.classList.remove('dragging')
      document.body.style.cursor = ''
      document.body.style.userSelect = ''
    })

    // Double-click: toggle full expand / restore
    handle.addEventListener('dblclick', () => {
      const maxH = workspace.offsetHeight - 40
      if (outputPanel.offsetHeight > maxH * 0.7) {
        outputPanel.style.height = prevH + 'px'
      } else {
        prevH = outputPanel.offsetHeight
        outputPanel.style.height = maxH + 'px'
      }
    })

    // ── Pyodide ───────────────────────────────────────────────────────────────
    let pyodide = null

    const setStatus = (text, cls) => {
      statusEl.textContent = text
      statusEl.className = 'status ' + cls
    }

    async function initPyodide() {
      try {
        pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' })
        pyodide.setStdout({ batched: t => log(t) })
        pyodide.setStderr({ batched: t => log(t, 'stderr') })
        overlay.classList.add('hidden')
        runBtn.disabled = false
        setStatus('Pyodide ready', 'ready')
        log('Pyodide loaded. Press ▶ Run or Ctrl+Enter.', 'info')
      } catch (e) {
        overlay.classList.add('hidden')
        setStatus('Load failed', 'error')
        log('Failed to load Pyodide: ' + (e.message || e), 'stderr')
      }
    }

    async function runCode() {
      if (!pyodide || runBtn.disabled) return
      runBtn.disabled = true
      setStatus('Running…', 'running')
      previewEl.innerHTML = ''
      consoleEl.innerHTML = ''
      // Switch to preview
      tabs.forEach(t => t.classList.remove('active'))
      document.querySelector('[data-tab="preview"]').classList.add('active')
      previewEl.classList.remove('hidden')
      consoleEl.classList.add('hidden')
      try {
        await pyodide.runPythonAsync(editor.getValue())
        setStatus('Done', 'ready')
      } catch (e) {
        log(e.message || String(e), 'stderr')
        setStatus('Error', 'error')
        tabs.forEach(t => t.classList.remove('active'))
        document.querySelector('[data-tab="console"]').classList.add('active')
        previewEl.classList.add('hidden')
        consoleEl.classList.remove('hidden')
      }
      runBtn.disabled = false
    }

    runBtn.addEventListener('click', runCode)
    clearBtn.addEventListener('click', () => { previewEl.innerHTML = ''; consoleEl.innerHTML = '' })

    initPyodide()
  </script>
</body>
</html>
