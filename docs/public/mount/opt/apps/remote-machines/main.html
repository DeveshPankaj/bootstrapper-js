<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Machines</title>
<link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
<style>
  :root {
    --bg: #12141a; --panel: #1a1d26; --panel2: #212533; --panel3: #2a2f40; --line: #2e3346;
    --text: #e6e9f2; --muted: #8d95ab; --accent: #5b8def; --accent-d: #3f74d9;
    --ok: #3ecf8e; --warn: #f5b84b; --danger: #ef5b6b; --radius: 10px; --term: #0c0e13;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; min-width: 0; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  input[type=checkbox] { width: 16px; height: 16px; padding: 0; flex-shrink: 0; accent-color: var(--accent); margin: 0; }
  textarea { resize: vertical; }
  .muted { color: var(--muted); } .small { font-size: 11.5px; }
  .ic { display: inline-flex; vertical-align: middle; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel3); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  .btn:hover { background: #343a50; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-d); }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--panel3); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex-shrink: 0; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }

  #app { display: flex; height: 100%; position: relative; }
  #side { width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #3ecf8e); display: grid; place-items: center; color: #fff; }
  .title { font-weight: 700; font-size: 14px; }
  .bridge { margin: 4px 10px 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel2); display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .bridge:hover { border-color: #3a4160; }
  .bridge .row1 { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12px; }
  .bridge .addr { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 4px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  #conns { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
  .conn { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .conn:hover { background: var(--panel2); }
  .conn.active { background: var(--panel3); }
  .conn .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .conn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .conn .addr { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11.5px; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .head .who { flex: 1; min-width: 160px; display: flex; flex-direction: column; }
  .head .who b { font-size: 14px; }
  .head .who span { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu-btn { display: none; }
  .tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: none; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:disabled { opacity: .45; cursor: not-allowed; }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .notice { margin: 12px 14px 0; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: var(--radius); background: var(--panel2); display: flex; flex-direction: column; gap: 8px; }
  .notice.bad { border-left-color: var(--danger); }
  .notice code, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .notice code { background: var(--panel3); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
  .empty { margin: auto; padding: 24px; max-width: 520px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .empty h3 { margin: 0; color: var(--text); font-size: 16px; }
  .empty code { background: var(--panel3); padding: 2px 6px; border-radius: 5px; color: var(--text); }

  .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar .grow { flex: 1; min-width: 120px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 1px; align-items: center; }
  .crumbs button { background: none; border: none; color: #8db4ff; padding: 2px 5px; border-radius: 5px; }
  .crumbs button:hover { background: var(--panel3); }
  .scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
  .scroll.drag { outline: 2px dashed var(--accent); outline-offset: -6px; background: rgba(91, 141, 239, .06); }
  table.grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.grid th { position: sticky; top: 0; z-index: 1; background: var(--panel); color: var(--muted); font-weight: 500; text-align: left; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--line); }
  table.grid td { padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.grid tr.item { cursor: default; }
  table.grid tr.item:hover td { background: var(--panel2); }
  table.grid tr.item.sel td { background: rgba(91, 141, 239, .16); }
  table.grid td.num { text-align: right; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.grid td.nm .cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  table.grid td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.grid td.nm .cell > span:not(.ic) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.grid td.act { text-align: right; }
  table.grid td.act .btn { opacity: .35; }
  table.grid tr.item:hover td.act .btn, table.grid tr.item.sel td.act .btn { opacity: 1; }
  .folder { color: #f5b84b; } .filei { color: var(--muted); }
  .status { display: flex; gap: 12px; align-items: center; padding: 5px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .status .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--panel3); font-size: 11px; color: var(--muted); }
  .st-Running { color: var(--ok); } .st-Stopped { color: var(--muted); } .st-Frozen, .st-Error { color: var(--warn); }

  .term-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .term-tabs { display: flex; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; }
  .term-tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); white-space: nowrap; cursor: pointer; font-size: 12px; }
  .term-tab.on { border-color: var(--accent); background: var(--panel3); }
  .term-tab .x { background: none; border: none; padding: 0 2px; color: var(--muted); display: inline-flex; }
  .term-tab .x:hover { color: var(--text); }
  .term-host { flex: 1; min-height: 0; position: relative; background: var(--term); }
  .term { position: absolute; inset: 6px 4px 4px 8px; }
  .term[hidden] { display: none; }
  .term-gone { position: absolute; right: 14px; bottom: 12px; z-index: 3; }

  .mon { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: 11.5px; }
  .tile .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 6px; border-radius: 3px; background: var(--panel3); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: #3987e5; }
  .meter.hi i { background: var(--warn); } .meter.full i { background: var(--danger); }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .chart { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px 22px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .chart-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .chart-head .now { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .legend { display: flex; gap: 12px; color: var(--muted); font-size: 11.5px; }
  .legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 1px; }
  .plot { position: relative; height: 118px; margin-left: 46px; cursor: crosshair; }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .plot .ylab { position: absolute; right: calc(100% + 6px); font-size: 10.5px; color: var(--muted); white-space: nowrap; transform: translateY(-50%); }
  .plot .xlab { position: absolute; top: calc(100% + 4px); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .plot .cross { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.35); pointer-events: none; }
  .plot .tip { position: absolute; top: 2px; z-index: 2; background: rgba(12,14,19,.95); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; pointer-events: none; white-space: nowrap; }
  .plot .tip .key { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; border-radius: 1px; }
  .cores { display: flex; gap: 3px; align-items: flex-end; height: 40px; }
  .cores span { flex: 1; min-width: 4px; background: #3987e5; border-radius: 3px 3px 0 0; min-height: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: none; padding: 4px 10px; color: var(--muted); font-size: 12px; }
  .seg button[aria-pressed="true"] { background: var(--panel3); color: var(--text); }

  .dl { border: 1px dashed #3a4160; border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--panel2); width: 100%; }
  .dl b { font-size: 13px; }
  .dl .row { justify-content: flex-start; }
  .dl a.btn { text-decoration: none; color: var(--text); }
  .dl a.btn.primary { color: #fff; }
  .dl .sha { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; cursor: copy; background: none; border: none; padding: 0; text-align: left; }
  .dl .sha:hover { color: var(--text); }
  .overlay { position: fixed; inset: 0; background: rgba(5,7,12,.62); display: grid; place-items: center; z-index: 50; padding: 14px; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  .modal-head .grow { flex: 1; }
  .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .field input, .field select, .field textarea { color: var(--text); font-size: 13px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }
  .hint { color: var(--muted); font-size: 12px; }
  .err { color: var(--danger); font-size: 12px; }
  .ok-text { color: var(--ok); font-size: 12px; }
  .fp { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
  .list { display: flex; flex-direction: column; }
  .list .li { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .list .li.click { cursor: pointer; } .list .li.click:hover { background: var(--panel2); }
  .list .li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editor { width: 100%; min-height: 360px; height: 58vh; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; tab-size: 4; background: var(--term); }
  #toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 90; pointer-events: none; }
  .toast { background: var(--panel3); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 12px; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .toast.ok { border-left-color: var(--ok); } .toast.bad { border-left-color: var(--danger); } .toast.warn { border-left-color: var(--warn); }

  /* Narrow windows: the machine list slides over the content. */
  body.narrow #side { position: absolute; inset: 0 auto 0 0; z-index: 20; width: min(280px, 86vw); box-shadow: 0 10px 40px rgba(0,0,0,.5); transform: translateX(-102%); transition: transform .15s; }
  body.narrow.side-open #side { transform: none; }
  body.narrow #menu-btn { display: inline-flex; }
  body.narrow .head .who { min-width: 100px; }
  body.narrow table.grid .wide { display: none; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head"><div class="logo" id="logo"></div><div><div class="title">Remote Machines</div><div class="small muted">SSH through a bridge</div></div></div>
    <div class="bridge" id="bridge" title="SSH bridge settings"></div>
    <div class="sec"><span>Machines</span><button class="btn ghost sm" id="add-btn" title="Add a machine"></button></div>
    <div id="conns"></div>
  </aside>
  <section id="main"></section>
</div>
<div id="modals"></div>
<div id="toasts"></div>
<script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════════
// Remote Machines: machines reached over SSH through the workspace-ssh bridge.
//
// The bridge (ts-playground's bridge/, `node bridge.mjs`) speaks JSON over one WebSocket per
// machine at <bridge>/rpc: the first message is the SSH login ({type:'ssh', host, port,
// username, password | privateKey | useAgent, hostKey, root}); the bridge answers 'ready' with
// the machine's info, 'prompt' for keyboard-interactive questions, or 'error' (host-key-unknown,
// host-key-changed, auth-failed, bridge-token, connect-failed). After that: {id, method, params}
// → {id, result | error}, plus pushed {event, data} messages (term.data, term.exit, exec.output,
// exec.exit). Methods used here: fs.list / fs.read / fs.readChunk / fs.write / fs.mkdir /
// fs.remove / fs.rename, term.open / term.write / term.resize / term.close, exec.run.
//
// Nothing is installed on the machines. Sign-ins are kept only in memory unless "remember" is on;
// then they are encrypted (AES-GCM) with a non-extractable key that lives in this browser's
// IndexedDB, and only the ciphertext is written to the VFS.
// ════════════════════════════════════════════════════════════════════════════

const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const fmtBytes = (n) => { if (!n && n !== 0) return ''; if (n < 1024) return n + ' B'; const u = ['KB', 'MB', 'GB', 'TB']; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < 3); return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i]; };
const fmtDate = (ms) => { if (!ms) return ''; const d = new Date(ms); return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }); };
/** Single-quoted for sh. */
const q = (s) => `'${String(s).replace(/'/g, `'\\''`)}'`;
const joinPath = (dir, name) => (dir === '/' ? '' : dir) + '/' + name;
const parentOf = (p) => { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); };
const baseName = (p) => p.split('/').filter(Boolean).pop() || '/';
const cleanName = (s) => String(s || '').replace(/[\u0000-\u001f\u007f/]/g, '').trim().slice(0, 255);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}

const ICONS = {

  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  server: '<rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',

  file: '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  up: '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',

// 3. One SSH session per machine, over its own WebSocket
// ════════════════════════════════════════════════════════════════════════════
class Session {
  constructor(conn) {
    this.conn = conn;

  set(status, error = '') { this.status = status; this.error = error; onSessionChange(this); }

    this.status = 'connecting';
    const c = this.conn;
    const secrets = c.auth === 'agent' ? { useAgent: true } : await secretOf(c.id);
    if (this.closed) return;

    if (this.closed) return;

    try { ws = new WebSocket(url); } catch (e) { return this.set('error', errText(e)); }

    const known = knownHosts[`${c.host}:${c.port}`];

const CHUNK = 6 * 1024 * 1024;
async function readRemote(s, path, opts = {}) {

  } catch (e) { if (!/larger than/i.test(errText(e))) throw e; }

}

  if (typeof content === 'string') {
    if (content.length <= CHUNK) return s.rpc('fs.write', { path, encoding: 'utf8', data: content }, 120000);
    content = new TextEncoder().encode(content);
  }
  for (let offset = 0; offset < content.length || offset === 0; offset += CHUNK) {
    await s.rpc('fs.write', { path, encoding: 'base64', data: toBase64(content.subarray(offset, offset + CHUNK)), append: offset > 0 }, 120000);

/** A command on the machine (not a terminal): its output and exit code. */

  return new Promise(async (resolve, reject) => {
    let id = null, stdout = '', stderr = '';

    const offExit = s.on('exec.exit', (d) => { if (id === null) return early.push(['x', d]); if (d.id === id) finish(d); });
    const offClosed = s.on('closed', () => { cleanup(); reject(new Error('The connection closed')); });
    const cleanup = () => { offOut(); offExit(); offClosed(); };
    const finish = (d) => { cleanup(); resolve({ code: d.code, stdout, stderr, sudoFailed: !!d.sudoFailed }); };
    try {
      const r = await s.rpc('exec.run', { script, sudo: !!opts.sudo, ...(opts.password ? { sudoPassword: opts.password } : {}) }, 30000);

      for (const [k, d] of early) { if (d.id !== id) continue; if (k === 'x') return finish(d); d.stream === 'stderr' ? (stderr += d.data) : (stdout += d.data); }

}

  if (!conns.length) {
    fill(list, h('div', { class: 'hint', style: { padding: '8px' } }, 'No machines yet.'));
    return;
  }
  fill(list, ...conns.map((c) => {
    const s = live.get(c.id)?.session;
    return h('div', { class: 'conn' + (c.id === selectedId ? ' active' : ''), title: s ? STATUS_TEXT[s.status] : STATUS_TEXT.offline, onclick: () => select(c.id) },
      ic('server', 16, 'muted'),
      h('div', { class: 'txt' }, h('span', { class: 'name' }, c.name), h('span', { class: 'addr' }, addressOf(c))),
      statusDot(s ? s.status : 'offline'));
  }));
}

function select(id) {
  selectedId = id;
  document.body.classList.remove('side-open');
  const c = current();
  if (c) {
    const st = stateOf(c);
    if (st.session.status === 'offline' && !st.session.everOnline) st.session.connect();
  }
  renderSide();
  renderMain();
}

function signInNotice(c, st) {
  const pass = h('input', { type: 'password', placeholder: c.auth === 'key' ? 'Key passphrase (if any)' : 'Password', autocomplete: 'current-password' });
  const key = c.auth === 'key' ? h('textarea', { rows: 4, placeholder: '-----BEGIN OPENSSH PRIVATE KEY-----', class: 'mono', spellcheck: 'false' }) : null;
  const remember = h('input', { type: 'checkbox', checked: c.remember !== false });
  const go = async () => {
    const secret = c.auth === 'key' ? { privateKey: key.value.trim() + '\n', passphrase: pass.value || undefined } : { password: pass.value };
    if (c.auth === 'key' ? !/-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(key.value) : !pass.value) return toast(c.auth === 'key' ? 'Paste the private key' : 'Enter the password', 'warn');
    if (c.remember !== remember.checked) { c.remember = remember.checked; saveConns(); }
    await keepSecret(c.id, secret, remember.checked);
    st.session.status = 'offline';
    st.session.connect();
  };
  pass.addEventListener('keydown', (e) => e.key === 'Enter' && go());
  setTimeout(() => (key || pass).focus(), 0);
  return h('div', { class: 'notice' }, h('div', {}, st.session.error || 'Sign in to connect.'), key, h('div', { class: 'row' }, pass, h('label', { class: 'check' }, remember, 'Remember (encrypted in this browser)'), h('button', { class: 'btn primary', onclick: go }, 'Sign in')));
}

async function loadDir(c, path) {
  const st = stateOf(c);
  const f = st.files;
  f.loading = true; f.error = '';
  if (selectedId === c.id && st.tab === 'files') renderMain();
  try {
    const list = await st.session.rpc('fs.list', { path });
    f.path = path;
    f.entries = list.sort((a, b) => (a.kind === b.kind ? a.name.localeCompare(b.name) : a.kind === 'dir' ? -1 : 1));
    f.sel = new Set();
  } catch (e) {
    f.error = errText(e);
    if (f.entries === null) f.entries = [];
  } finally { f.loading = false; }
  if (selectedId === c.id) renderMain();
}

const setTransfer = (c, t) => { const st = stateOf(c); st.files.transfer = t; if (selectedId === c.id && st.tab === 'files') renderMain(); };

async function newFolder(c) {
  const st = stateOf(c);
  const name = cleanName(prompt('Name of the new folder:', 'New folder') || '');
  if (!name) return;
  try { await st.session.rpc('fs.mkdir', { path: joinPath(st.files.path, name) }); loadDir(c, st.files.path); }
  catch (e) { toast(errText(e), 'bad'); }
}
async function renameNode(c, n) {
  const st = stateOf(c);
  const name = cleanName(prompt('New name:', n.name) || '');
  if (!name || name === n.name) return;
  try { await st.session.rpc('fs.rename', { from: n.path, to: joinPath(parentOf(n.path), name) }); loadDir(c, st.files.path); }
  catch (e) { toast(errText(e), 'bad'); }
}
async function deleteNodes(c, nodes) {
  const st = stateOf(c);
  const what = nodes.length === 1 ? `"${nodes[0].name}"${nodes[0].kind === 'dir' ? ' and everything in it' : ''}` : `${nodes.length} items`;
  if (!confirm(`Delete ${what} on ${c.name}? This can't be undone.`)) return;
  for (const n of nodes) { try { await st.session.rpc('fs.remove', { path: n.path }, 120000); } catch (e) { toast(`${n.name}: ${errText(e)}`, 'bad'); } }
  loadDir(c, st.files.path);
}

/** Text files open in an editor; saving writes them back to the machine. */
const openEditors = new Set();
async function openRemoteFile(c, n) {
  const key = `${c.id}:${n.path}`;
  if (openEditors.has(key)) return;
  openEditors.add(key);
  try { await editRemoteFile(c, n, () => openEditors.delete(key)); } catch (e) { openEditors.delete(key); toast(errText(e), 'bad'); }
}
async function editRemoteFile(c, n, closed) {
  const s = stateOf(c).session;
  if (n.size > 4 * 1024 * 1024) { closed(); return toast(`${n.name} is ${fmtBytes(n.size)}: too big to edit here. Save it to Files or download it.`, 'warn'); }
  const res = await s.rpc('fs.read', { path: n.path }, 60000);
  if (res.encoding !== 'utf8') { closed(); return toast(`${n.name} isn't a text file. Save it to Files or download it instead.`, 'warn'); }
  let dirty = false;
  const area = h('textarea', { class: 'editor', spellcheck: 'false' });
  area.value = res.data;
  const state = h('span', { class: 'hint' }, n.path);
  const save = async () => {
    try { await writeRemote(s, n.path, area.value); dirty = false; state.textContent = 'Saved ' + new Date().toLocaleTimeString(); state.className = 'ok-text'; }
    catch (e) { state.textContent = errText(e); state.className = 'err'; }
  };
  area.addEventListener('input', () => { if (!dirty) { dirty = true; state.textContent = 'Unsaved changes'; state.className = 'hint'; } });
  area.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (e.key === 'Tab') { e.preventDefault(); const a = area.selectionStart; area.setRangeText('\t', a, area.selectionEnd, 'end'); }
  });
  const m = openModal({ title: `${n.name} on ${c.name}`, width: 900, onClose: closed, confirmClose: () => !dirty || confirm('Discard unsaved changes?'), render: () => [area, h('div', { class: 'row', style: { justifyContent: 'space-between' } }, state, h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => m.close() }, 'Close'), h('button', { class: 'btn primary', onclick: save }, ic('save', 14), 'Save')))] });
  setTimeout(() => area.focus(), 0);
}

async function downloadToComputer(c, n) {
  const s = stateOf(c).session;
  setTransfer(c, { label: `Downloading ${n.name}`, done: 0, total: 1 });
  try {
    const data = await readRemote(s, n.path);
    const url = URL.createObjectURL(new Blob([data]));
    const a = h('a', { href: url, download: n.name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (e) { toast(errText(e), 'bad'); }
  setTransfer(c, null);
}

/** Remote → VFS: files, and folders with everything in them. */
async function saveToVfs(c, nodes) {
  if (!FS) return;
  const dir = await pickVfsFolder({ title: `Save ${nodes.length === 1 ? `"${nodes[0].name}"` : `${nodes.length} items`} to…`, buttonLabel: 'Save here' });
  if (!dir) return;
  const s = stateOf(c).session;
  const jobs = [];
  const collect = async (n, dest) => {
    if (n.kind === 'dir') {
      jobs.push({ kind: 'dir', dest });
      for (const child of await s.rpc('fs.list', { path: n.path })) await collect(child, joinPath(dest, child.name));
    } else jobs.push({ kind: 'file', src: n.path, dest, size: n.size });
    if (jobs.length > 5000) throw new Error('More than 5000 items: copy a smaller folder.');
  };
  try {
    setTransfer(c, { label: 'Listing', done: 0, total: 0 });
    for (const n of nodes) await collect(n, joinPath(dir, cleanName(n.name)));
    const files = jobs.filter((j) => j.kind === 'file');
    const clash = jobs.find((j) => FS.existsSync(j.dest) && j.kind === 'file');
    if (clash && !confirm(`${clash.dest} already exists${files.length > 1 ? ' (and maybe others)' : ''}. Overwrite?`)) return setTransfer(c, null);
    let done = 0;
    for (const j of jobs) {
      if (j.kind === 'dir') { mkdirp(j.dest); continue; }
      setTransfer(c, { label: 'Saving to Files', done, total: files.length });
      const data = await readRemote(s, j.src);
      mkdirp(parentOf(j.dest));
      FS.writeFileSync(j.dest, typeof data === 'string' ? data : (B ? B.from(data) : data));
      done++;
    }
    toast(`Saved ${files.length} file${files.length === 1 ? '' : 's'} to ${dir}`, 'ok');
  } catch (e) { toast(errText(e), 'bad'); }
  setTransfer(c, null);
}

/** VFS → remote: files and whole folders. */
async function uploadVfsPaths(c, paths, remoteDir) {
  const st = stateOf(c);
  const s = st.session;
  const jobs = [];
  const collect = (vfsPath, dest) => {
    const stat = FS.statSync(vfsPath);
    if (stat.isDirectory()) {
      jobs.push({ kind: 'dir', dest });
      for (const name of FS.readdirSync(vfsPath)) collect(joinPath(vfsPath, name), joinPath(dest, name));
    } else jobs.push({ kind: 'file', src: vfsPath, dest });
    if (jobs.length > 5000) throw new Error('More than 5000 items: copy a smaller folder.');
  };
  try {
    for (const p of paths) collect(p, joinPath(remoteDir, cleanName(baseName(p))));
    const files = jobs.filter((j) => j.kind === 'file');
    const existing = new Set((st.files.entries || []).map((n) => n.path));
    const clash = jobs.find((j) => existing.has(j.dest));
    if (clash && !confirm(`${baseName(clash.dest)} already exists on ${c.name}. Overwrite?`)) return;
    let done = 0;
    for (const j of jobs) {
      if (j.kind === 'dir') { await s.rpc('fs.mkdir', { path: j.dest }).catch(() => {}); continue; }
      setTransfer(c, { label: `Uploading to ${c.name}`, done, total: files.length });
      await writeRemote(s, j.dest, new Uint8Array(FS.readFileSync(j.src)));
      done++;
    }
    toast(`Copied ${files.length} file${files.length === 1 ? '' : 's'} to ${c.name}:${remoteDir}`, 'ok');
  } catch (e) { toast(errText(e), 'bad'); }
  setTransfer(c, null);
  loadDir(c, st.files.path);
}
async function uploadComputerFiles(c, files, remoteDir) {
  const st = stateOf(c);
  let done = 0;
  try {
    for (const file of files) {
      setTransfer(c, { label: `Uploading to ${c.name}`, done, total: files.length });
      await writeRemote(st.session, joinPath(remoteDir, cleanName(file.name)), new Uint8Array(await file.arrayBuffer()));
      done++;
    }
    toast(`Uploaded ${done} file${done === 1 ? '' : 's'}`, 'ok');
  } catch (e) { toast(errText(e), 'bad'); }
  setTransfer(c, null);
  loadDir(c, st.files.path);
}
async function uploadFromVfs(c) {
  const picked = await pickVfsEntries({ title: `Copy to ${c.name}:${stateOf(c).files.path}` });
  if (picked?.length) uploadVfsPaths(c, picked, stateOf(c).files.path);
}

// ── VFS pickers ──
function vfsEntries(path) {
  const out = [];
  try { for (const n of FS.readdirSync(path)) { try { const l = FS.lstatSync(joinPath(path, n)); if (l.isSymbolicLink()) continue; out.push({ n, d: l.isDirectory(), s: l.size }); } catch (_) {} } } catch (_) {}
  return out.sort((a, b) => (b.d - a.d) || a.n.localeCompare(b.n));
}
function vfsCrumbs(path, go) {
  const parts = path.split('/').filter(Boolean);
  return h('div', { class: 'crumbs' }, h('button', { onclick: () => go('/') }, '/'), parts.map((p, i) => [h('span', { class: 'muted' }, '›'), h('button', { onclick: () => go('/' + parts.slice(0, i + 1).join('/')) }, p)]));

// 6b. The machine as a folder of the VFS: /mnt/ssh/<name>
// ════════════════════════════════════════════════════════════════════════════
// While a machine is connected, it is mounted at /mnt/ssh/<name>, so the default file explorer (and
// every other app) uses it like any folder. VFS calls are synchronous and the bridge isn't, so the
// mount is an in-memory mirror (FS.createBackend('InMemory')) behind a wrapper this page owns:
//   * folders are listed on demand (when an app reads them) and one level ahead in the background
//     (only below folders an app opened: background listings don't expand further);
//     the explorer re-reads a folder when its listing arrives ('vfs:changed' on the top window);
//   * files start as placeholders that report the remote size and date; small ones (≤ 512 KB) are
//     fetched in the background, others on first read (over 8 MB: on a second open within a minute) —
//     that read fails with EAGAIN ("still downloading, open it again") instead of returning wrong
//     bytes, and a notification says when it's there;
//   * writes, new folders, deletes and renames apply to the mirror at once (so the calling app sees
//     them) and go to the machine in order, in the background; failures are notified and the folder
//     is listed again, so the mirror shows what the machine really has;
//   * remote changes come from the bridge's fs.watch (it re-lists the folders listed recently).
// rmdir on the mirror uses the bridge's non-recursive fs.rmdir: a folder whose remote contents were
// never listed is never deleted with them by accident.

}

      h('div', { class: 'hint' }, `Check that this matches the machine's ${key.type || 'host'} key (on the machine: `, h('code', { class: 'mono' }, 'ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub'), ').'),
      h('div', { class: 'fp' }, key.fingerprint),
      h('div', { class: 'row end' }, h('button', { class: 'btn', onclick: () => finish(false) }, 'Cancel'), h('button', { class: 'btn ' + (changed ? 'danger' : 'primary'), onclick: () => finish(true) }, changed ? 'Trust the new key' : 'Trust and connect')),
    ] });
  });
}

/** Keyboard-interactive questions from the SSH server (one-time codes, extra passwords…). */
function askPrompts(c, msg) {
  return new Promise((resolve) => {
    let done = false;
    const inputs = (msg.prompts || []).map((p) => h('input', { type: p.echo ? 'text' : 'password', autocomplete: 'one-time-code' }));
    const finish = (v) => { if (done) return; done = true; m.close(true); resolve(v); };
    const m = openModal({ title: msg.name || `${c.host} asks`, width: 440, onClose: () => { if (!done) { done = true; resolve(null); } }, render: () => [
      msg.instructions ? h('div', { class: 'hint' }, msg.instructions) : null,
      ...(msg.prompts || []).map((p, i) => h('label', { class: 'field' }, p.prompt.trim() || 'Answer', inputs[i])),
      h('div', { class: 'row end' }, h('button', { class: 'btn', onclick: () => finish(null) }, 'Cancel'), h('button', { class: 'btn primary', onclick: () => finish(inputs.map((x) => x.value)) }, 'Continue')),
    ] });
    inputs.forEach((x) => x.addEventListener('keydown', (e) => e.key === 'Enter' && finish(inputs.map((y) => y.value))));
    setTimeout(() => inputs[0]?.focus(), 0);
  });
}
function askPassword(title, hint) {
  return new Promise((resolve) => {
    let done = false;
    const input = h('input', { type: 'password', autocomplete: 'current-password' });
    const finish = (v) => { if (done) return; done = true; m.close(true); resolve(v); };
    const m = openModal({ title, width: 420, onClose: () => { if (!done) { done = true; resolve(null); } }, render: () => [hint ? h('div', { class: 'hint' }, hint) : null, input, h('div', { class: 'hint' }, 'Kept only while this window is open.'), h('div', { class: 'row end' }, h('button', { class: 'btn', onclick: () => finish(null) }, 'Cancel'), h('button', { class: 'btn primary', onclick: () => finish(input.value) }, 'OK'))] });
    input.addEventListener('keydown', (e) => e.key === 'Enter' && finish(input.value));
    setTimeout(() => input.focus(), 0);
  });
}

function openBridgeSettings() {
  const url = h('input', { type: 'url', value: settings.bridgeUrl, spellcheck: 'false', placeholder: DEFAULT_BRIDGE });
  const token = h('input', { type: 'password', placeholder: 'Only if the bridge printed one', autocomplete: 'off' });
  secretOf('bridge').then((s) => { if (s?.token) token.value = s.token; });
  const result = h('div', { class: 'hint' });
  const test = async () => {
    result.className = 'hint'; result.textContent = 'Checking…';
    try {
      const res = await fetch(new URL('health', url.value.trim().replace(/\/+$/, '') + '/'), { cache: 'no-store', signal: AbortSignal.timeout(6000) });
      const body = await res.json();
      if (body.bridge !== 'workspace-ssh') throw new Error("That isn't the SSH bridge");
      result.className = body.originAllowed === false ? 'err' : 'ok-text';
      result.textContent = body.originAllowed === false ? `Bridge ${body.version} is running but refuses this site: start it with --origin ${location.origin}` : `Bridge ${body.version} is running${body.token ? ' (it needs its token)' : ''}${body.sshAgent ? ' · its SSH agent can sign in' : ''}.`;
    } catch (e) { result.className = 'err'; result.textContent = `No bridge there (${errText(e)}).`; }
  };
  const m = openModal({ title: 'SSH bridge', width: 560, render: () => [
    h('div', { class: 'hint' }, 'A browser can\'t open SSH connections itself, so a small bridge does it: the workspace-ssh bridge (ts-playground\'s bridge/, or its download bridge.mjs). It writes nothing on your machines.'),
    h('label', { class: 'field' }, 'Bridge address', url),
    h('label', { class: 'field' }, 'Access token', token),
    result,
    h('div', { class: 'hint' }, 'On this computer: ', h('code', { class: 'mono' }, 'node bridge.mjs'), ' (localhost sites are allowed). On another machine: ', h('code', { class: 'mono' }, `node bridge.mjs --host 0.0.0.0 --origin ${location.origin}`), ' — it prints a token to paste above. From an https site, put the bridge behind https too.'),
    downloadBox(),
    h('div', { class: 'row end' }, h('button', { class: 'btn', onclick: test }, 'Test'), h('button', { class: 'btn primary', onclick: async () => {
      settings.bridgeUrl = (url.value.trim() || DEFAULT_BRIDGE).replace(/\/+$/, '');
      saveSettings();
      await keepSecret('bridge', token.value.trim() ? { token: token.value.trim() } : null, true);
      m.close(true);
      checkBridge();
    } }, 'Save')),
  ] });
}

function editConnection(c) {
  const isNew = !c;
  const conf = c ? { ...c } : { id: uid(), name: '', host: '', port: 22, username: 'root', auth: 'password', root: '/', remember: true };
  const address = h('input', { value: c ? addressOf(c).replace(/:\d+$/, '') : '', placeholder: 'user@host, e.g. root@192.168.1.200', spellcheck: 'false', autocomplete: 'off' });
  const port = h('input', { type: 'number', min: 1, max: 65535, value: String(conf.port) });
  const name = h('input', { value: conf.name, placeholder: 'Empty: the host name' });
  const auth = h('select', {}, h('option', { value: 'password' }, 'Password'), h('option', { value: 'key' }, 'Private key'), h('option', { value: 'agent', disabled: !bridge.info?.sshAgent }, 'SSH agent (of the bridge’s computer)'));
  auth.value = conf.auth;
  const password = h('input', { type: 'password', autocomplete: 'new-password' });
  const key = h('textarea', { rows: 5, class: 'mono', spellcheck: 'false' });
  const keyFile = h('input', { type: 'file', style: { display: 'none' }, onchange: async () => { const f = keyFile.files[0]; if (f) key.value = await f.text(); keyFile.value = ''; } });
  const passphrase = h('input', { type: 'password', placeholder: 'Only if the key has one', autocomplete: 'off' });
  const root = h('input', { value: conf.root || '/', placeholder: '/', spellcheck: 'false' });
  const remember = h('input', { type: 'checkbox', checked: conf.remember !== false });
  const problem = h('div', { class: 'err' });
  const hasSaved = !!c && (sessionSecrets.has(c.id) || !!sealed[c.id]);
  const pwField = h('label', { class: 'field' }, 'Password', password);
  const keyField = h('label', { class: 'field' }, 'Private key', key, h('button', { class: 'btn sm', type: 'button', style: { alignSelf: 'flex-start' }, onclick: () => keyFile.click() }, ic('upload', 13), 'Load key file…'), keyFile);
  const ppField = h('label', { class: 'field' }, 'Key passphrase', passphrase);
  const remField = h('label', { class: 'check' }, remember, 'Remember the sign-in (encrypted in this browser)');
  const sync = () => {
    const same = !isNew && auth.value === c.auth;
    pwField.hidden = auth.value !== 'password';
    keyField.hidden = ppField.hidden = auth.value !== 'key';
    remField.hidden = auth.value === 'agent';
    password.placeholder = same && hasSaved ? 'Empty: keep the saved password' : '';
    key.placeholder = same && hasSaved ? 'Empty: keep the saved key' : '-----BEGIN OPENSSH PRIVATE KEY-----';
  };
  auth.addEventListener('change', sync);
  sync();
  const save = async () => {
    const m1 = /^(?:([^@\s]+)@)?(\[[^\]]+\]|[^:\s]+)(?::(\d+))?$/.exec(address.value.trim());
    if (!m1 || !m1[1]) return (problem.textContent = 'Enter user@host, e.g. root@192.168.1.200');
    const p = Number(m1[3] || port.value || 22);
    if (!Number.isInteger(p) || p < 1 || p > 65535) return (problem.textContent = 'Invalid SSH port');
    const folder = root.value.trim() || '/';
    if (!folder.startsWith('/')) return (problem.textContent = 'The folder must be an absolute path, e.g. / or /srv/app');
    let secret = null;
    if (auth.value === 'password' && password.value) secret = { password: password.value };
    if (auth.value === 'key' && key.value.trim()) {
      if (!/-----BEGIN [A-Z ]*PRIVATE KEY-----/.test(key.value)) return (problem.textContent = 'Paste the private key (it starts with -----BEGIN … PRIVATE KEY-----)');
      secret = { privateKey: key.value.trim() + '\n', passphrase: passphrase.value || undefined };
    }
    if (!secret && auth.value !== 'agent' && (isNew || auth.value !== c.auth || !hasSaved)) return (problem.textContent = auth.value === 'password' ? 'Enter the password' : 'Paste the private key');
    const host = m1[2].replace(/^\[|\]$/g, '');
    const next = { ...conf, name: name.value.trim() || host, host, port: p, username: m1[1], auth: auth.value, root: folder.replace(/(.)\/+$/, '$1'), remember: auth.value !== 'agent' && remember.checked };
    const moved = !isNew && (c.host !== next.host || c.port !== next.port || c.username !== next.username || c.root !== next.root || c.auth !== next.auth);
    if (secret) await keepSecret(next.id, secret, next.remember);
    else if (auth.value === 'agent') await keepSecret(next.id, null, false);
    else if (!isNew && c.remember !== next.remember) await keepSecret(next.id, await secretOf(next.id), next.remember);
    if (isNew) conns.push(next); else conns[conns.findIndex((x) => x.id === next.id)] = next;
    saveConns();
    m.close(true);
    const st = stateOf(next);
    if (isNew || moved || secret) {
      // New address, folder or sign-in: start over.
      st.session.close();
      st.files = { ...st.files, path: '/', entries: null, sel: new Set(), error: '' };
      st.cts = { loading: false, error: '', list: null, cli: '', sudo: false, password: '' };
      st.session.everOnline = false;
      st.session.status = 'offline';
    }
    selectedId = next.id;
    renderSide(); renderMain();
    if (st.session.status === 'offline') st.session.connect();
  };
  const m = openModal({ title: isNew ? 'Add a machine' : `Edit ${c.name}`, width: 560, render: () => [
    h('div', { class: 'cols' }, h('label', { class: 'field' }, 'User and host', address), h('label', { class: 'field' }, 'SSH port', port)),
    h('label', { class: 'field' }, 'Name', name),
    h('label', { class: 'field' }, 'Sign in with', auth),
    pwField, keyField, ppField,
    h('label', { class: 'field' }, 'Folder the file browser shows (/ for the whole disk)', root),
    remField,
    problem,
    h('div', { class: 'row end' }, h('button', { class: 'btn', onclick: () => m.close() }, 'Cancel'), h('button', { class: 'btn primary', onclick: save }, isNew ? 'Add and connect' : 'Save')),
  ] });
  setTimeout(() => address.focus(), 0);
}

async function removeConnection(c) {
  if (!confirm(`Remove ${c.name}? Its saved sign-in is deleted from this browser.`)) return;
  const st = live.get(c.id);
  if (st) { for (const t of [...st.terms.list]) closeTerminal(c, st, t); st.session.close(); live.delete(c.id); }
  await keepSecret(c.id, null, false);
  conns = conns.filter((x) => x.id !== c.id);
  saveConns();
  if (selectedId === c.id) selectedId = conns[0]?.id || null;
  renderSide(); renderMain();
}

// ════════════════════════════════════════════════════════════════════════════
// 10. Start
// ════════════════════════════════════════════════════════════════════════════
async function init() {
  PLAT = await whenPlatform();
  try { FS = PLAT && PLAT.host.getFS(); } catch (_) { FS = null; }
  settings = { ...settings, ...readJson('settings.json', {}) };
  conns = (readJson('connections.json', []) || []).filter((c) => c && c.id && c.host);
  knownHosts = readJson('known_hosts.json', {}) || {};
  sealed = readJson('secrets.json', {}) || {};
  $('#logo').append(ic('server', 17));
  $('#add-btn').append(ic('plus', 14));
  $('#add-btn').addEventListener('click', () => editConnection(null));
  $('#bridge').addEventListener('click', () => openBridgeSettings());
  const narrow = () => document.body.classList.toggle('narrow', window.innerWidth < 640);
  window.addEventListener('resize', () => { narrow(); const c = current(); if (c) fitActive(stateOf(c)); });
  narrow();
  selectedId = conns[0]?.id || null;
  renderBridge(); renderSide(); renderMain();
  await Promise.all([checkBridge(), loadBridgeDownload()]);
  renderBridge(); renderMain();
  const c = current();
  if (c && bridge.state === 'ok') select(c.id);
  const cleanup = () => { for (const st of live.values()) { for (const t of st.terms.list) if (t.id) st.session.rpc('term.close', { id: t.id }).catch(() => {}); st.mount?.unmount(); st.mount = null; st.session.close(); } };
  window.addEventListener('pagehide', cleanup);
  window.addEventListener('beforeunload', cleanup);
  // For tests and the console.
  window.__remoteMachines = { RemoteMount, live, get conns() { return conns; }, get settings() { return settings; }, get bridge() { return bridge; }, select, openTerminal, loadDir, loadContainers, stateOf, uploadVfsPaths, saveToVfs };
}
init();
</script>
