<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Media Player</title>
<style>
  :root {
    --bg: #141416;
    --surface: #1e1e22;
    --surface2: #28282e;
    --border: #333338;
    --text: #e8e8ec;
    --muted: #88889a;
    --accent: #8b5cf6;
    --accent2: #3b82f6;
    --hover: #2e2e36;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; }
  body { display: flex; flex-direction: column; overflow: hidden; }

  .player-layout { display: flex; flex: 1; min-height: 0; }
  .playlist { width: 200px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .playlist-header { padding: .6rem .75rem; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .playlist-body { flex: 1; overflow-y: auto; }
  .playlist-body::-webkit-scrollbar { width: 4px; }
  .playlist-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .pl-item { display: flex; align-items: center; gap: .5rem; padding: .45rem .75rem; cursor: pointer; border-radius: 0; transition: background .12s; white-space: nowrap; overflow: hidden; }
  .pl-item:hover { background: var(--hover); }
  .pl-item.active { background: rgba(139,92,246,.18); color: var(--accent); }
  .pl-item-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .pl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; opacity: 0; }
  .pl-item.active .pl-dot { opacity: 1; }

  /* Right panel: video + controls stacked */
  .player-right { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Video element — hidden in audio mode, shown in video mode */
  #playerVideo { display: none; width: 100%; min-height: 0; object-fit: contain; background: #000; flex: 1; }
  .player-right.video-mode #playerVideo { display: block; }
  .player-right.video-mode .player-main { flex: 0 0 auto; padding: .6rem 1.5rem .8rem; gap: .4rem; justify-content: center; }
  .player-right.video-mode #albumArt { display: none; }
  .player-right.video-mode .track-info { display: none; }

  /* Main area */
  .player-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.25rem 1.5rem; gap: 1rem; min-width: 0; overflow-y: auto; }

  .album-art {
    width: 110px; height: 110px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    box-shadow: 0 8px 28px rgba(139,92,246,.35);
  }

  .track-info { text-align: center; max-width: 300px; }
  .track-name { font-size: 16px; font-weight: 600; margin-bottom: .3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-dir  { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Progress */
  .progress-wrap { width: 100%; max-width: 340px; }
  .time-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: .35rem; }
  .seek-bar { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
  .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  .seek-bar::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; }

  /* Controls */
  .controls { display: flex; align-items: center; gap: 1.2rem; }
  .ctrl-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: .4rem; border-radius: 50%; transition: color .15s, background .15s; display: flex; align-items: center; justify-content: center; }
  .ctrl-btn:hover { color: var(--text); background: var(--hover); }
  .ctrl-btn.play-btn { background: var(--accent); color: #fff; width: 48px; height: 48px; border-radius: 50%; }
  .ctrl-btn.play-btn:hover { background: #7c3aed; }
  .ctrl-btn.active { color: var(--accent); }

  /* Volume */
  .volume-row { display: flex; align-items: center; gap: .6rem; color: var(--muted); }
  .vol-bar { -webkit-appearance: none; appearance: none; width: 90px; height: 3px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
  .vol-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }

  svg { display: block; }

  /* Empty state */
  .empty { text-align: center; color: var(--muted); }
  .empty .empty-icon { font-size: 48px; margin-bottom: 1rem; }
  .empty p { font-size: 13px; line-height: 1.6; }

  /* Drop target highlight */
  body.drag-active .player-main { outline: 2px dashed var(--accent); outline-offset: -4px; border-radius: 8px; }
</style>
</head>
<body>

<div class="player-layout">
  <aside class="playlist">
    <div class="playlist-header">Playlist</div>
    <div class="playlist-body" id="playlist"></div>
  </aside>

  <div class="player-right" id="playerRight">
    <video id="playerVideo" preload="auto"></video>
    <main class="player-main" id="mainArea">
      <div class="empty">
        <div class="empty-icon">▶</div>
        <p>No media loaded.<br>Open a file from the file explorer,<br>or drag and drop one here.</p>
      </div>
    </main>
  </div>
</div>

<script>
  const audio = document.getElementById('playerVideo');
  const playlistEl = document.getElementById('playlist');
  const mainArea = document.getElementById('mainArea');
  const playerRight = document.getElementById('playerRight');

  const VIDEO_EXTS = new Set(['.mp4', '.mkv', '.webm', '.avi', '.mov']);

  let bridge = null;
  let playlist = [];
  let currentIndex = -1;
  let shuffle = false;
  let repeat = false;
  let blobUrl = null;

  function fmtTime(s) {
    if (!isFinite(s) || isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  }

  function getMime(path) {
    const ext = path.slice(path.lastIndexOf('.')).toLowerCase();
    return bridge ? bridge.getMime(ext) : 'video/mp4';
  }

  function buildMainUI() {
    mainArea.innerHTML = `
      <div class="album-art" id="albumArt">♪</div>
      <div class="track-info">
        <div class="track-name" id="trackName">—</div>
        <div class="track-dir"  id="trackDir">—</div>
      </div>
      <div class="progress-wrap">
        <div class="time-row">
          <span id="timeCur">0:00</span>
          <span id="timeTot">0:00</span>
        </div>
        <input type="range" class="seek-bar" id="seekBar" min="0" max="100" step="0.1" value="0">
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btnShuffle" title="Shuffle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnPrev" title="Previous">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="btnPlay" title="Play/Pause">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnNext" title="Next">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="btnRepeat" title="Repeat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>
      <div class="volume-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" class="vol-bar" id="volBar" min="0" max="1" step="0.02" value="1">
      </div>
    `;

    document.getElementById('seekBar').addEventListener('input', (e) => {
      if (audio.duration) audio.currentTime = audio.duration * e.target.value / 100;
    });
    document.getElementById('volBar').addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });
    document.getElementById('btnPlay').addEventListener('click', togglePlay);
    document.getElementById('btnPrev').addEventListener('click', playPrev);
    document.getElementById('btnNext').addEventListener('click', playNext);
    document.getElementById('btnShuffle').addEventListener('click', () => {
      shuffle = !shuffle;
      document.getElementById('btnShuffle').classList.toggle('active', shuffle);
    });
    document.getElementById('btnRepeat').addEventListener('click', () => {
      repeat = !repeat;
      document.getElementById('btnRepeat').classList.toggle('active', repeat);
    });

    audio.addEventListener('timeupdate', () => {
      const cur = document.getElementById('timeCur');
      const tot = document.getElementById('timeTot');
      const bar = document.getElementById('seekBar');
      if (cur) cur.textContent = fmtTime(audio.currentTime);
      if (tot) tot.textContent = fmtTime(audio.duration);
      if (bar && audio.duration) bar.value = (audio.currentTime / audio.duration) * 100;
    });
    audio.addEventListener('ended', () => { repeat ? audio.play() : playNext(); });
    audio.addEventListener('play', () => updatePlayIcon(true));
    audio.addEventListener('pause', () => updatePlayIcon(false));
  }

  function updatePlayIcon(playing) {
    const icon = document.getElementById('playIcon');
    if (!icon) return;
    icon.innerHTML = playing
      ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  function togglePlay() {
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  }

  function playPrev() {
    if (playlist.length === 0) return;
    let idx = currentIndex - 1;
    if (idx < 0) idx = playlist.length - 1;
    playIndex(idx);
  }

  function playNext() {
    if (playlist.length === 0) return;
    let idx;
    if (shuffle) idx = Math.floor(Math.random() * playlist.length);
    else idx = (currentIndex + 1) % playlist.length;
    playIndex(idx);
  }

  async function playIndex(idx) {
    if (idx < 0 || idx >= playlist.length) return;
    currentIndex = idx;
    const path = playlist[idx];
    updatePlaylistHighlight();
    await loadAndPlay(path);
  }

  async function loadAndPlay(path) {
    if (!bridge) return;

    const ext = path.slice(path.lastIndexOf('.')).toLowerCase();
    const isVideo = VIDEO_EXTS.has(ext);

    // Switch layout between video mode and audio mode
    playerRight.classList.toggle('video-mode', isVideo);

    const name = path.split('/').pop();
    const dir = path.split('/').slice(0, -1).join('/') || '/';

    const tn = document.getElementById('trackName');
    const td = document.getElementById('trackDir');
    if (tn) tn.textContent = name;
    if (td) td.textContent = dir;

    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }

    try {
      const data = bridge.readFile(path);
      const mime = getMime(path);
      const blob = new Blob([new Uint8Array(data)], { type: mime });
      blobUrl = URL.createObjectURL(blob);
      audio.src = blobUrl;
      audio.play().catch(() => {});
    } catch (e) {
      console.error('Failed to load media:', path, e);
    }
  }

  function updatePlaylistHighlight() {
    document.querySelectorAll('.pl-item').forEach((el, i) => {
      el.classList.toggle('active', i === currentIndex);
    });
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    playlist.forEach((path, i) => {
      const name = path.split('/').pop();
      const li = document.createElement('div');
      li.className = 'pl-item' + (i === currentIndex ? ' active' : '');
      li.innerHTML = `<span class="pl-dot"></span><span class="pl-item-name" title="${name}">${name}</span>`;
      li.addEventListener('click', () => playIndex(i));
      playlistEl.appendChild(li);
    });
  }

  const MEDIA_EXTS = new Set(['.mp3','.wav','.ogg','.flac','.m4a','.aac','.opus','.mp4','.mkv','.webm']);

  function setupDropZone() {
    document.body.addEventListener('dragover', (e) => {
      if (e.dataTransfer.types.includes('application/x-vfs-path') || window.top?.__vfsDragPath) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        document.body.classList.add('drag-active');
      }
    });
    document.body.addEventListener('dragleave', (e) => {
      if (!e.relatedTarget || !document.body.contains(e.relatedTarget)) {
        document.body.classList.remove('drag-active');
      }
    });
    document.body.addEventListener('drop', async (e) => {
      document.body.classList.remove('drag-active');
      const path = e.dataTransfer.getData('application/x-vfs-path') || window.top?.__vfsDragPath;
      if (window.top?.__vfsDragPath) window.top.__vfsDragPath = null;
      if (!path || !bridge) return;
      e.preventDefault();
      const ext = path.slice(path.lastIndexOf('.')).toLowerCase();
      if (!MEDIA_EXTS.has(ext)) return;
      if (!playlist.includes(path)) {
        playlist.push(path);
        renderPlaylist();
      }
      currentIndex = playlist.indexOf(path);
      updatePlaylistHighlight();
      await loadAndPlay(path);
    });
  }

  window.__playerAddTrack = async function(path) {
    if (!bridge) return;
    if (!playlist.includes(path)) {
      playlist.push(path);
      renderPlaylist();
    }
    currentIndex = playlist.indexOf(path);
    updatePlaylistHighlight();
    await loadAndPlay(path);
  };

  window.__playerInit = async function(br) {
    bridge = br;
    buildMainUI();
    setupDropZone();

    const initialPath = bridge.initialPath;
    if (!initialPath) return;

    const dir = initialPath.split('/').slice(0, -1).join('/') || '/';
    const allEntries = bridge.listDir(dir);
    playlist = allEntries
      .filter(name => {
        const ext = name.slice(name.lastIndexOf('.')).toLowerCase();
        return MEDIA_EXTS.has(ext);
      })
      .map(name => `${dir}/${name}`);

    if (playlist.length === 0) playlist = [initialPath];

    currentIndex = playlist.indexOf(initialPath);
    if (currentIndex < 0) { playlist.unshift(initialPath); currentIndex = 0; }

    renderPlaylist();
    await loadAndPlay(initialPath);
  };
</script>
</body>
</html>
