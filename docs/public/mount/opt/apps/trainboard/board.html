<!doctype html><html><head><meta charset="utf-8"><title>TrainBoard</title>
<style>
:root{--bg:#0d0d14;--surface:#13131f;--border:#1e1e2e;--text:#e2e8f0;--muted:#6b7280;--accent:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── toolbar ─────────────────────────────────────────────────────────────── */
#toolbar{
  flex-shrink:0;height:42px;display:flex;align-items:center;gap:6px;
  padding:0 12px;background:var(--surface);border-bottom:1px solid var(--border);
}
.app-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;margin-right:4px}
.tb-sep{width:1px;height:18px;background:var(--border);margin:0 3px;flex-shrink:0}
.tb-btn{
  display:flex;align-items:center;gap:3px;padding:4px 10px;
  border:1px solid var(--border);border-radius:5px;font-size:12px;font-weight:500;
  background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;
  transition:background .1s;
}
.tb-btn:hover{background:var(--border)}
.tb-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.smooth-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-shrink:0}
.smooth-row input[type=range]{width:72px;accent-color:var(--accent)}
#smooth-val{min-width:30px;color:var(--text);font-size:12px}
#dir-label{
  margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:220px;cursor:pointer;
}
#dir-label:hover{color:var(--text)}

/* ── main layout ─────────────────────────────────────────────────────────── */
#main{flex:1;display:flex;overflow:hidden}

/* ── sidebar ─────────────────────────────────────────────────────────────── */
#sidebar{
  width:158px;flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  overflow-y:auto;padding:8px 0;
}
.sidebar-hd{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:4px 12px 8px;text-transform:uppercase}
.run-item{
  display:flex;align-items:center;gap:6px;padding:5px 12px;
  cursor:pointer;font-size:12.5px;color:var(--muted);transition:background .1s,color .1s;
}
.run-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
.run-item.sel{color:var(--text)}
.run-item input[type=checkbox]{accent-color:var(--accent);width:12px;height:12px;cursor:pointer;flex-shrink:0}
.run-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.run-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.run-count{font-size:10px;color:var(--muted);flex-shrink:0}
.no-runs{padding:12px;font-size:12px;color:var(--muted);line-height:1.6}

/* ── charts area ─────────────────────────────────────────────────────────── */
#charts-area{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.chart-card{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px 14px;flex-shrink:0;
}
.chart-title{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;margin-bottom:10px;
}
.chart-wrap{height:190px;position:relative}

/* ── getting started ─────────────────────────────────────────────────────── */
.gs-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;padding:28px;text-align:center;
}
.gs-icon{font-size:36px;margin-bottom:10px}
.gs-wrap h2{font-size:15px;margin-bottom:8px}
.gs-wrap p{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6;max-width:520px}
.gs-code{
  background:var(--bg);border:1px solid var(--border);border-radius:7px;
  padding:14px 16px;text-align:left;
  font-family:'JetBrains Mono',Consolas,monospace;font-size:12px;
  color:#a5b4fc;line-height:1.75;white-space:pre;max-width:540px;
  overflow-x:auto;margin-bottom:10px;
}
.gs-hint{font-size:12px;color:var(--muted)}
.gs-hint code{color:var(--text);background:var(--surface);padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<div id="toolbar">
  <span class="app-name">📈 TrainBoard</span>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-refresh">⟳ Refresh</button>
  <button class="tb-btn" id="btn-auto">Auto</button>
  <div class="tb-sep"></div>
  <div class="smooth-row">
    Smooth
    <input type="range" id="smooth-range" min="0" max="98" value="60">
    <span id="smooth-val">0.60</span>
  </div>
  <span id="dir-label" title="Click to change log directory">/home/user1/trainboard</span>
</div>
<div id="main">
  <div id="sidebar">
    <div class="sidebar-hd">Runs</div>
    <div id="run-list"><div class="no-runs">No runs yet</div></div>
  </div>
  <div id="charts-area"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
let bridge     = null;
let logDir     = '/home/user1/trainboard';
let autoTimer  = null;
let alpha      = 0.60;
let runs       = [];
let selectedRuns = new Set();
let charts     = {};

const COLORS = ['#8b5cf6','#22d3ee','#f59e0b','#10b981','#f43f5e','#3b82f6','#e879f9','#fb923c'];
const DASHES = [[],[6,3],[2,2],[8,3,2,3]];

// ── bridge ────────────────────────────────────────────────────────────────────
window.__bdInit = (b) => {
  bridge = b;
  if (!bridge.existsDir(logDir)) bridge.mkDir(logDir);
  refresh();
};
setTimeout(() => { if (!bridge) showEmpty(); }, 400);

// ── data ──────────────────────────────────────────────────────────────────────
function parseLog(txt) {
  return (txt || '').trim().split('\n').filter(Boolean).map(l => {
    try { return JSON.parse(l); } catch { return null; }
  }).filter(Boolean);
}

function loadRuns() {
  return bridge.listDir(logDir)
    .filter(f => f.endsWith('.jsonl'))
    .sort()
    .map(f => ({ name: f.slice(0, -6), rows: parseLog(bridge.readFile(`${logDir}/${f}`)) }));
}

function metricKeys(sel) {
  const s = new Set();
  sel.forEach(r => r.rows.forEach(row => Object.keys(row).filter(k => k !== 'step').forEach(k => s.add(k))));
  return [...s].sort();
}

function ema(vals, a) {
  if (!a || !vals.length) return vals;
  const out = [vals[0]];
  for (let i = 1; i < vals.length; i++) out.push(a * out[i-1] + (1-a) * vals[i]);
  return out;
}

// ── refresh ───────────────────────────────────────────────────────────────────
function refresh() {
  if (!bridge) return;
  runs = loadRuns();
  runs.forEach(r => { if (!selectedRuns.has(r.name)) selectedRuns.add(r.name); });
  renderSidebar();
  renderCharts();
}

// ── sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('run-list');
  if (!runs.length) {
    list.innerHTML = '<div class="no-runs">No runs yet.<br>Log metrics from a Notebook cell to see charts here.</div>';
    return;
  }
  list.innerHTML = runs.map((r, i) => `
    <label class="run-item${selectedRuns.has(r.name) ? ' sel' : ''}">
      <input type="checkbox" ${selectedRuns.has(r.name) ? 'checked' : ''}
        onchange="toggleRun('${r.name.replace(/'/g,"\\'")}',this.checked)">
      <span class="run-dot" style="background:${COLORS[i % COLORS.length]}"></span>
      <span class="run-name" title="${r.name}">${r.name}</span>
      <span class="run-count">${r.rows.length}</span>
    </label>`).join('');
}

function toggleRun(name, checked) {
  if (checked) selectedRuns.add(name); else selectedRuns.delete(name);
  renderCharts();
}

// ── charts ────────────────────────────────────────────────────────────────────
const CHART_OPTS = {
  responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
  interaction: { mode: 'index', intersect: false },
  scales: {
    x: { type: 'linear', grid: { color: '#1a1a2a' }, ticks: { color: '#6b7280', maxTicksLimit: 8 } },
    y: { grid: { color: '#1a1a2a' }, ticks: { color: '#6b7280' } },
  },
  plugins: {
    legend: { labels: { color: '#9ca3af', boxWidth: 10, padding: 10, font: { size: 11 } } },
    tooltip: {
      backgroundColor: '#1e1e2e', borderColor: '#2a2a3a', borderWidth: 1,
      titleColor: '#e2e8f0', bodyColor: '#9ca3af', padding: 8,
    },
  },
};

function renderCharts() {
  const area = document.getElementById('charts-area');
  const sel  = runs.filter(r => selectedRuns.has(r.name));

  if (!runs.length) { showEmpty(); return; }
  if (!sel.length) {
    area.innerHTML = '<div style="padding:32px;color:var(--muted);font-size:13px;text-align:center">No runs selected</div>';
    return;
  }

  const metrics = metricKeys(sel);

  // Destroy charts for removed metrics
  Object.keys(charts).forEach(k => {
    if (!metrics.includes(k)) { charts[k].destroy(); delete charts[k]; }
  });

  const fragments = metrics.map((metric) => {
    let card = document.getElementById('card-' + metric);
    if (!card) {
      card = document.createElement('div');
      card.id = 'card-' + metric;
      card.className = 'chart-card';
      card.innerHTML = `<div class="chart-title">${metric}</div><div class="chart-wrap"><canvas id="cvs-${metric}"></canvas></div>`;
    }

    const datasets = sel.map((run) => {
      const ri = runs.indexOf(run);
      const pts = run.rows
        .filter(r => r[metric] != null)
        .map(r => ({ x: r.step ?? 0, y: r[metric] }));
      const smoothed = ema(pts.map(p => p.y), alpha).map((y, i) => ({ x: pts[i].x, y }));
      return {
        label: run.name,
        data: smoothed,
        borderColor: COLORS[ri % COLORS.length],
        backgroundColor: 'transparent',
        borderWidth: 2,
        borderDash: DASHES[sel.indexOf(run) % DASHES.length],
        pointRadius: pts.length <= 50 ? 3 : 0,
        tension: 0.3,
      };
    });

    if (charts[metric]) {
      charts[metric].data.datasets = datasets;
      charts[metric].update('none');
    } else {
      const ctx = card.querySelector('#cvs-' + metric).getContext('2d');
      charts[metric] = new Chart(ctx, { type: 'line', data: { datasets }, options: CHART_OPTS });
    }
    return card;
  });

  area.innerHTML = '';
  fragments.forEach(c => area.appendChild(c));
}

// ── empty state ───────────────────────────────────────────────────────────────
function showEmpty() {
  const area = document.getElementById('charts-area');
  area.innerHTML = `<div class="gs-wrap">
  <div class="gs-icon">📈</div>
  <h2>No training runs yet</h2>
  <p>Log scalars from any Notebook cell using this helper class — copy, paste, run:</p>
  <pre class="gs-code">import json
from js import window

class TrainLogger:
    def __init__(self, run="run1", log_dir="/home/user1/trainboard"):
        self._path = f"{log_dir}/{run}.jsonl"
        self._bridge = getattr(window, '__nbBridge')
        self._bridge.writeFile(self._path, "")  # clear / create

    def log(self, step, **metrics):
        row = json.dumps({"step": step, **{k: float(v) for k, v in metrics.items()}})
        buf = self._bridge.readFile(self._path) or ""
        self._bridge.writeFile(self._path, buf + row + "\\n")

# Example — simulated training loop
logger = TrainLogger("demo")
import math
for epoch in range(30):
    loss     = math.exp(-epoch * 0.15) + 0.05 * (epoch % 3 == 0)
    val_loss = loss + 0.08
    acc      = 1 - loss / 2
    logger.log(epoch, loss=loss, val_loss=val_loss, accuracy=acc)

print("Done — click Refresh in TrainBoard")</pre>
  <p class="gs-hint">Logs go to <code>${logDir}/</code> — hit <strong>Refresh</strong> or enable <strong>Auto</strong> to reload every 3 s.</p>
</div>`;
}

// ── controls ──────────────────────────────────────────────────────────────────
document.getElementById('btn-refresh').addEventListener('click', refresh);

document.getElementById('btn-auto').addEventListener('click', function () {
  this.classList.toggle('active');
  if (this.classList.contains('active')) {
    this.textContent = '⏸ Auto';
    autoTimer = setInterval(refresh, 3000);
  } else {
    this.textContent = 'Auto';
    clearInterval(autoTimer);
  }
});

document.getElementById('smooth-range').addEventListener('input', function () {
  alpha = this.value / 100;
  document.getElementById('smooth-val').textContent = alpha.toFixed(2);
  renderCharts();
});

document.getElementById('dir-label').addEventListener('click', () => {
  const nd = prompt('Log directory:', logDir);
  if (nd && nd.trim() !== logDir) {
    logDir = nd.trim();
    const lbl = document.getElementById('dir-label');
    lbl.textContent = logDir;
    lbl.title = logDir;
    if (bridge && !bridge.existsDir(logDir)) bridge.mkDir(logDir);
    selectedRuns.clear();
    for (const k of Object.keys(charts)) { charts[k].destroy(); }
    charts = {};
    refresh();
  }
});
</script>
</body></html>
