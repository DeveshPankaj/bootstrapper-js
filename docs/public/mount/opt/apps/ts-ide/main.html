<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeScript / WebGL IDE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;color:#e2e8f0;font-family:'JetBrains Mono',ui-monospace,monospace}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{height:38px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.app-title{color:#3b82f6;font-weight:700;font-size:12px;white-space:nowrap}
.file-badge{color:#8b949e;font-size:11px;margin-left:2px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-tag{font-size:9px;color:#60a5fa;background:#0c1e3d;border:1px solid #1f6feb;border-radius:4px;padding:1px 5px;margin-left:6px;text-transform:uppercase;letter-spacing:.3px}
.spacer{flex:1}
.btn{padding:3px 10px;border-radius:5px;border:1px solid #30363d;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:background .15s}
.btn-run{background:#1d4ed8;color:#fff;border-color:#2563eb}
.btn-run:hover{background:#2563eb}
.btn-run.running{background:#6e7681;border-color:#6e7681;cursor:default}
.btn-secondary{background:#21262d;color:#c9d1d9}
.btn-secondary:hover{background:#30363d}
.btn-danger{background:#21262d;color:#8b949e}
.btn-danger:hover{color:#f85149}
#main-content{display:flex;flex:1;overflow:hidden}
.resizer{width:5px;flex-shrink:0;cursor:col-resize;background:#21262d;position:relative;z-index:2}
.resizer:hover,.resizer.dragging{background:#3b82f6}
.resizing,.resizing *{user-select:none!important;cursor:col-resize!important}
#sidebar{width:195px;background:#0d1117;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sb-head{padding:6px 10px;font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #21262d;display:flex;align-items:center;justify-content:space-between}
.sb-action{cursor:pointer;color:#3b82f6;font-size:13px;line-height:1;font-weight:400;flex-shrink:0}
.sb-section{flex:1;overflow-y:auto;padding:4px 0}
.sb-group{font-size:10px;color:#3b82f6;font-weight:600;padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between}
.sb-project-head{padding:9px 10px 8px;font-size:12.5px;font-weight:700;color:#e2e8f0;display:flex;align-items:center;gap:6px;border-bottom:1px solid #21262d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-project-head .ic{font-size:13px;opacity:.9;flex-shrink:0}
.sb-item{padding:5px 10px 5px 16px;font-size:11.5px;color:#c9d1d9;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.sb-item:hover{background:#161b22}
.sb-item:hover .sb-del{opacity:1}
.sb-item.active{background:#1f2937;color:#e2e8f0;border-left:2px solid #3b82f6;padding-left:14px}
.sb-item .ic{font-size:12px;flex-shrink:0;opacity:.8}
.sb-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.sb-item .sb-mod-dot{width:6px;height:6px;border-radius:50%;background:transparent;flex-shrink:0;margin:0 1px}
.sb-item .sb-mod-dot.show{background:#e3b341}
.sb-item .sb-del{opacity:0;color:#6e7681;font-size:11px;flex-shrink:0;padding:0 2px}
.sb-item .sb-del:hover{color:#f85149}
#center-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#right-panel{width:340px;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.editor-wrap{flex:1;overflow:hidden;position:relative}
.CodeMirror{height:100%!important;font-size:12.5px;font-family:'JetBrains Mono',ui-monospace,monospace;line-height:1.6;background:#0d1117}
.CodeMirror-scroll{height:100%!important}
.CodeMirror-gutters{background:#0d1117;border-right:1px solid #21262d}
.CodeMirror-linenumber{color:#484f58;padding-right:10px}
#preview-header{height:32px;background:#161b22;border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.pv-tab{padding:3px 10px;font-size:11px;color:#8b949e;cursor:pointer;border-bottom:2px solid transparent}
.pv-tab.active{color:#e2e8f0;border-color:#3b82f6}
.pv-tab:hover{color:#c9d1d9}
#preview-body{flex:1;overflow:hidden;position:relative;background:#0a0d13}
#canvas-preview{position:absolute;inset:0}
#iframe-preview{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:#fff}
#console-right{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
#console-right.show{display:flex}
#console-lines{flex:1;overflow-y:auto;padding:6px 10px;font-size:11.5px;line-height:1.5}
.log{padding:1px 0}.log.out{color:#c9d1d9}.log.err{color:#f85149}.log.info{color:#3b82f6}.log.ok{color:#3fb950}.log.dim{color:#6e7681;font-style:italic}.log.warn{color:#e3b341}
#status-bar{height:22px;background:#0f172a;border-top:1px solid #21262d;display:flex;align-items:center;padding:0 10px;gap:8px;font-size:10px;color:#6e7681;flex-shrink:0}
.st-ok{color:#3fb950}.st-err{color:#f85149}.st-run{color:#3b82f6}
.diff-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
.diff-overlay.show{display:flex}
.diff-panel{width:680px;max-width:92vw;max-height:82vh;background:#0d1117;border:1px solid #30363d;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.diff-panel-head{height:36px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0}
.diff-title{font-size:12px;font-weight:700;color:#e2e8f0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff-close{cursor:pointer;color:#8b949e;font-size:14px;line-height:1;padding:3px 7px;border-radius:4px;border:1px solid #30363d}
.diff-close:hover{color:#f85149;background:#21262d}
.diff-body{flex:1;overflow:auto;padding:6px 0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;line-height:1.6}
.diff-empty{padding:24px;color:#8b949e;font-size:12px;text-align:center}
.diff-line{padding:0 12px;white-space:pre-wrap;word-break:break-all}
.diff-line.add{background:rgba(63,185,80,.15);color:#7ee787}
.diff-line.del{background:rgba(248,81,73,.15);color:#ff7b72}
.diff-line.ctx{color:#8b949e}
.diff-line .dp{display:inline-block;width:14px;opacity:.8}
.newproj-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
.newproj-overlay.show{display:flex}
.newproj-panel{width:420px;max-width:92vw;max-height:80vh;background:#0d1117;border:1px solid #30363d;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.newproj-body{flex:1;overflow-y:auto;padding:6px}
.newproj-group-label{padding:8px 10px 4px;font-size:10.5px;font-weight:700;color:#6e7681;text-transform:uppercase;letter-spacing:.04em}
.newproj-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:#c9d1d9}
.newproj-item:hover{background:#1f2937}
.newproj-item .ic{font-size:15px;flex-shrink:0}
.newproj-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="app-title">TS / WebGL IDE</span>
    <span class="file-badge" id="file-badge">untitled.ts</span>
    <span class="lang-tag" id="lang-tag">TS</span>
    <span class="spacer"></span>
    <button class="btn btn-secondary" onclick="openNewProjectModal()">New</button>
    <button class="btn btn-secondary" onclick="openProject()">Open</button>
    <button class="btn btn-secondary" onclick="openFolder()">Open Folder</button>
    <button class="btn btn-secondary" onclick="saveProject()">Save</button>
    <button class="btn btn-secondary" onclick="showDiff()" title="Compare current buffer to last-saved snapshot">Diff</button>
    <button class="btn btn-run" id="run-btn" onclick="runCode()">▶ Run</button>
    <button class="btn btn-danger" onclick="clearAll()">Clear</button>
  </div>
  <div id="main-content">
    <div id="sidebar">
      <div class="sb-head">TS IDE</div>
      <div class="sb-section" id="sb-content"></div>
    </div>
    <div class="resizer" id="resizer-left" title="Drag to resize"></div>
    <div id="center-panel">
      <div class="editor-wrap"><textarea id="editor"></textarea></div>
      <div id="status-bar">
        <span id="status-msg">Ready</span>
        <span class="spacer"></span>
        <span id="status-lang">TypeScript</span>
      </div>
    </div>
    <div class="resizer" id="resizer-right" title="Drag to resize"></div>
    <div id="right-panel">
      <div id="preview-header">
        <span class="pv-tab active" onclick="setPvTab('canvas')" id="ptab-canvas">Preview</span>
        <span class="pv-tab" onclick="setPvTab('console')" id="ptab-console">Console</span>
        <span class="spacer"></span>
        <span style="font-size:10px;color:#6e7681" id="pv-info">canvas preview</span>
      </div>
      <div id="preview-body">
        <canvas id="canvas-preview"></canvas>
        <iframe id="iframe-preview" sandbox="allow-scripts allow-same-origin"></iframe>
        <div id="console-right">
          <div id="console-lines"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="diff-overlay" id="diff-overlay" onclick="if(event.target===this)closeDiff()">
    <div class="diff-panel">
      <div class="diff-panel-head">
        <span class="diff-title" id="diff-title">Diff</span>
        <span class="diff-close" onclick="closeDiff()" title="Close">✕</span>
      </div>
      <div class="diff-body" id="diff-body"></div>
    </div>
  </div>
  <div class="newproj-overlay" id="newproj-overlay" onclick="if(event.target===this)closeNewProjectModal()">
    <div class="newproj-panel">
      <div class="diff-panel-head">
        <span class="diff-title">New Project</span>
        <span class="diff-close" onclick="closeNewProjectModal()" title="Close">✕</span>
      </div>
      <div class="newproj-body" id="newproj-body"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.3.3/typescript.min.js"></script>
<script>
// AppSDK bridge
function sdk(){ return window.AppSDK||{readText:()=>Promise.reject(new Error('SDK not ready')),writeText:()=>Promise.reject(new Error('SDK not ready')),mkdir:()=>Promise.resolve(),list:()=>Promise.resolve([]),exists:()=>Promise.resolve(false),remove:()=>Promise.resolve(),rename:()=>Promise.resolve()}; }

// --- Language detection by file extension (not a project-wide toggle —
// each file in a project is edited/run according to its own extension,
// so a single project can freely mix app.ts + shader.glsl + style.css) ---
var EXT_LANG = { ts:'ts', tsx:'ts', js:'js', jsx:'js', mjs:'js', glsl:'glsl', vert:'glsl', frag:'glsl', fs:'glsl', vs:'glsl', html:'html', htm:'html', css:'css', json:'json' };
var LANG_LABEL = { ts:'TypeScript', js:'JavaScript', glsl:'GLSL Shader', html:'HTML', css:'CSS', json:'JSON' };
var EXT_ICON = { ts:'🔷', tsx:'🔷', js:'📜', jsx:'📜', mjs:'📜', glsl:'✨', vert:'✨', frag:'✨', html:'📄', htm:'📄', css:'🎨', json:'🧾' };

function extOf(filename){ var m = /\.([a-zA-Z0-9]+)$/.exec(filename||''); return m ? m[1].toLowerCase() : ''; }
function langFor(filename){ return EXT_LANG[extOf(filename)] || 'js'; }
function iconFor(filename){ return EXT_ICON[extOf(filename)] || '📄'; }

function cmModeFor(lang){
  if (lang === 'glsl') return 'text/x-csrc'; // GLSL is C-like; no dedicated CodeMirror mode, this gets close
  if (lang === 'css') return 'css';
  if (lang === 'html') return 'htmlmixed';
  if (lang === 'json') return {name:'javascript', json:true};
  return {name:'javascript', typescript: lang === 'ts'};
}

// --- CodeMirror ---
var editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
  mode: {name:'javascript', typescript:true}, theme:'dracula', lineNumbers:true,
  indentUnit:2, tabSize:2, indentWithTabs:false,
  matchBrackets:true, autoCloseBrackets:true, lineWrapping:false,
  extraKeys:{'Ctrl-Enter':runCode,'Cmd-Enter':runCode,'Ctrl-S':saveProject,'Cmd-S':saveProject}
});

// --- Resizable panels (sidebar | editor | preview) ---
function makeResizer(resizerEl, panelEl, opts){
  var dragging = false, startX = 0, startWidth = 0;
  resizerEl.addEventListener('mousedown', function(e){
    dragging = true; startX = e.clientX; startWidth = panelEl.getBoundingClientRect().width;
    resizerEl.classList.add('dragging');
    document.body.classList.add('resizing');
    e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if (!dragging) return;
    var delta = (e.clientX - startX) * (opts.grow === 'left' ? -1 : 1);
    var w = Math.max(opts.min, Math.min(opts.max, startWidth + delta));
    panelEl.style.width = w + 'px';
    editor.refresh();
  });
  window.addEventListener('mouseup', function(){
    if (!dragging) return;
    dragging = false;
    resizerEl.classList.remove('dragging');
    document.body.classList.remove('resizing');
  });
}
makeResizer(document.getElementById('resizer-left'), document.getElementById('sidebar'), { min: 120, max: 420, grow: 'right' });
makeResizer(document.getElementById('resizer-right'), document.getElementById('right-panel'), { min: 200, max: 640, grow: 'left' });

// --- Canvas preview: always fills the available preview area ---
// canvas.width/height (the drawing buffer) is separate from its CSS
// box size — #canvas-preview's CSS already fills #preview-body via
// position:absolute;inset:0, but without this the buffer stays
// whatever it was last set to (a stale 340×300 default, or whatever
// size it had at Run time), so resizing the window or dragging the
// panel dividers left it blurry/cropped instead of actually resizing.
var previewBodyEl = document.getElementById('preview-body');
function fitCanvasPreview(){
  var cv = document.getElementById('canvas-preview');
  var w = previewBodyEl.clientWidth, h = previewBodyEl.clientHeight;
  if (w > 0 && h > 0 && (cv.width !== w || cv.height !== h)) { cv.width = w; cv.height = h; }
}
new ResizeObserver(fitCanvasPreview).observe(previewBodyEl);
fitCanvasPreview();

// --- Project / file state ---
// A "project" is just a VFS directory (`projectDir`, or null for an
// unsaved scratch buffer) holding any number of files (`files`, name ->
// content). `activeFile` is whichever one is currently in the editor.
// Opening an arbitrary folder (not just ones under VFS_BASE) works the
// same way — `projectDir` can point anywhere the sandboxed app is
// allowed to read/write.
// The sandboxed app namespace only grants write access to its own
// /opt/apps/<id> dir and /home/user1/.local/share/<id> (see
// src/platform/namespace.ts) — /home/user1/projects/ts is read-only to
// this app and every write there fails with an ACL error. "Open Folder"
// can still freely READ any path (the default ACL allows read
// everywhere), so opening projects saved elsewhere keeps working; only
// *saving* requires the project to live under VFS_BASE, or under a
// folder whose ACL was separately granted.
var VFS_BASE = '/home/user1/.local/share/ui.ts-ide/projects';
var projectDir = null;
var files = {};
var activeFile = null;
var isDirty = false;
var curPvTab = 'canvas';
var tsReady = typeof ts !== 'undefined';

// --- Git-lite: a lightweight last-saved-snapshot diff, NOT real git ---
// `gitLiteSnapshots[name]` holds the file's content as of the last time it
// was written to disk (mirrored under `<projectDir>/.git-lite/<name>` by
// saveProject(), and restored from there by loadProjectFromDir()). A file
// with no entry here has no baseline to compare against (a brand-new file
// added via "+"/New, or a file in an opened project that predates this
// feature / was never saved) and always reads as modified. Loading an
// example or template seeds the baseline to the content just loaded, so
// browsing examples doesn't show as "modified" until you actually edit.
var GIT_LITE_DIR = '.git-lite';
var gitLiteSnapshots = {};

function isFileModified(name){
  if (name == null || files[name] == null) return false;
  var snap = gitLiteSnapshots[name];
  if (snap === undefined) return true;
  return files[name] !== snap;
}

// Live-updates just one file's sidebar dot without rebuilding the whole
// (async, listProjects()-dependent) sidebar — cheap enough to call on
// every keystroke, unlike refreshSidebar().
function updateModifiedIndicator(name){
  if (!name) return;
  var items = document.querySelectorAll('#sb-content .sb-item[data-file]');
  for (var i=0;i<items.length;i++){
    if (items[i].getAttribute('data-file') === name){
      var dot = items[i].querySelector('.sb-mod-dot');
      if (dot) dot.classList.toggle('show', isFileModified(name));
      break;
    }
  }
}

editor.on('change', function(){
  isDirty = true;
  if (activeFile) files[activeFile] = editor.getValue();
  updateBadge();
  updateModifiedIndicator(activeFile);
});

function readPackageJson(){
  var raw = files['package.json'];
  if (raw == null) return null;
  try { return JSON.parse(raw); } catch(e){ return null; }
}

// Prefers a real external project's own package.json "name" (so opening
// someone else's JS/TS project shows their name, not just the folder's)
// over the vfs directory basename.
function projectName(){
  if (!projectDir) return null;
  var pkg = readPackageJson();
  if (pkg && pkg.name) return pkg.name;
  return projectDir.split('/').filter(Boolean).pop();
}

function updateBadge(){
  var name = activeFile ? (projectName() ? projectName()+'/'+activeFile : activeFile) : 'untitled';
  document.getElementById('file-badge').textContent = (isDirty?'● ':'')+name;
  var lang = langFor(activeFile || 'untitled.ts');
  document.getElementById('lang-tag').textContent = (activeFile ? extOf(activeFile) : 'ts').toUpperCase();
  document.getElementById('status-lang').textContent = LANG_LABEL[lang] || lang;
}

// Switches the editor to a different file within the current in-memory
// project, flushing the outgoing file's buffer first.
function switchFile(name){
  if (activeFile) files[activeFile] = editor.getValue();
  activeFile = name;
  editor.setValue(files[name] || '');
  editor.setOption('mode', cmModeFor(langFor(name)));
  updateBadge();
  refreshSidebar();
}

// --- Preview tabs ---
function setPvTab(t){
  curPvTab = t;
  document.getElementById('ptab-canvas').classList.toggle('active', t==='canvas');
  document.getElementById('ptab-console').classList.toggle('active', t==='console');
  document.getElementById('canvas-preview').style.display = t==='canvas'?'block':'none';
  document.getElementById('console-right').classList.toggle('show', t==='console');
  document.getElementById('pv-info').textContent = t==='canvas'?'canvas preview':'console';
}

// --- Console ---
var conLines = document.getElementById('console-lines');

function log(msg, cls){
  var d = document.createElement('div');
  d.className = 'log '+(cls||'out');
  d.textContent = msg;
  conLines.appendChild(d);
  conLines.scrollTop = conLines.scrollHeight;
}

function setStatus(msg, cls){
  var s = document.getElementById('status-msg');
  s.textContent = msg;
  s.className = cls||'';
}

function clearAll(){
  conLines.innerHTML = '';
  var cv = document.getElementById('canvas-preview');
  cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
  var ifr = document.getElementById('iframe-preview');
  ifr.srcdoc = '';
  setStatus('Ready');
}

// Console-forwarding + error-catching shim injected into every preview
// document (both single-file script mode and webapp mode) so the IDE's
// own console panel shows what ran inside the sandboxed iframe.
var CONSOLE_SHIM =
'<script>' +
'var _origLog=console.log,_origErr=console.error,_origWarn=console.warn;' +
"console.log=function(){var a=Array.prototype.slice.call(arguments);_origLog.apply(console,a);window.parent.postMessage({t:'log',d:a.map(String).join(' ')},'*');};" +
"console.error=function(){var a=Array.prototype.slice.call(arguments);_origErr.apply(console,a);window.parent.postMessage({t:'err',d:a.map(String).join(' ')},'*');};" +
"console.warn=function(){var a=Array.prototype.slice.call(arguments);_origWarn.apply(console,a);window.parent.postMessage({t:'warn',d:a.map(String).join(' ')},'*');};" +
"window.onerror=function(msg,_,l,c){window.parent.postMessage({t:'err',d:'Error at '+l+':'+c+': '+msg},'*');return true;};" +
"window.parent.postMessage({t:'ready'},'*');" +
'<\/script>';

var msgHandlerInstalled = false;
function ensureMsgHandler(btn){
  if (msgHandlerInstalled) return;
  msgHandlerInstalled = true;
  window.addEventListener('message', function(ev){
    if(!ev.data||typeof ev.data!=='object') return;
    if(ev.data.t==='log'){ log(ev.data.d,'out'); }
    else if(ev.data.t==='err'){ log(ev.data.d,'err'); setStatus('Runtime error','st-err'); }
    else if(ev.data.t==='warn'){ log(ev.data.d,'warn'); }
    else if(ev.data.t==='ready'){
      var b = document.getElementById('run-btn');
      b.classList.remove('running'); b.textContent='▶ Run';
      if (document.getElementById('status-msg').className !== 'st-err') setStatus('Running','st-ok');
    }
  });
}

// --- tsconfig.json: a real, visible, per-project file the compiler
// actually reads (target/jsx/strict) — see readTsConfigCompilerOptions().
// `module` is decided per call-site below instead (ts.ModuleKind.None for
// the standalone single-file runScript() path with no exports/require in
// scope, ts.ModuleKind.CommonJS for the webapp bundler, which relies on
// require()/exports being emitted so project files can genuinely import
// each other — see buildModuleBundle/__require) rather than trusting
// whatever "module" a project's own tsconfig.json declares; that field is
// still meaningful there for a real editor/type-checker, this app's own
// in-browser build step just doesn't have one to hand it to.
var TS_TARGET_MAP = { es3:'ES3', es5:'ES5', es6:'ES2015', es2015:'ES2015', es2016:'ES2016', es2017:'ES2017', es2018:'ES2018', es2019:'ES2019', es2020:'ES2020', es2021:'ES2021', esnext:'ESNext' };
var TS_JSX_MAP = { none:'None', preserve:'Preserve', react:'React', 'react-jsx':'ReactJSX', 'react-native':'ReactNative' };

function readTsConfigCompilerOptions(){
  var raw = files['tsconfig.json'];
  var opts = {};
  if (raw != null) {
    try { opts = (JSON.parse(raw).compilerOptions) || {}; }
    catch(e){ log('tsconfig.json is invalid JSON, using default compiler options: '+e.message, 'warn'); }
  }
  var targetKey = TS_TARGET_MAP[String(opts.target||'es2017').toLowerCase()] || 'ES2017';
  var jsxKey = TS_JSX_MAP[String(opts.jsx||'none').toLowerCase()] || 'None';
  return {
    target: ts.ScriptTarget[targetKey],
    jsx: ts.JsxEmit[jsxKey],
    strict: !!opts.strict,
    noEmitOnError: false,
  };
}

// Standalone single-file transpile (no exports/require in scope) — used by
// runScript()/runGLSL()'s fallback path for a project with no index.html.
function transpileTs(code, label){
  if(!tsReady){ throw new Error('TypeScript compiler not loaded yet, try again...'); }
  var options = Object.assign({module: ts.ModuleKind.None}, readTsConfigCompilerOptions());
  var result = ts.transpileModule(code, { compilerOptions: options, fileName: label });
  return result.outputText;
}

// CommonJS transpile for the webapp module bundler (see buildModuleBundle).
function transpileToCommonJS(code, filename){
  if(!tsReady){ throw new Error('TypeScript compiler not loaded yet, try again...'); }
  var options = Object.assign({}, readTsConfigCompilerOptions(), {module: ts.ModuleKind.CommonJS});
  var result = ts.transpileModule(code, { compilerOptions: options, fileName: filename });
  return result.outputText;
}

// --- In-browser CommonJS-style module bundler ---
// Lets project files genuinely `import`/`require` each other with no real
// build step: each local file is transpiled to CommonJS (require()/
// exports.x = ...), wrapped in its own factory function, and resolved at
// run time by a tiny __require() shim mirroring Node's own module.exports
// convention (and this same app's platform's own Host.execString
// require/module/exports pattern) — just enough for a flat (no
// subdirectories yet) project to wire files together.
function resolveModuleId(spec){
  var clean = spec.replace(/^\.\//, '');
  var candidates = [clean, clean+'.ts', clean+'.tsx', clean+'.js', clean+'.jsx'];
  for (var i=0;i<candidates.length;i++){
    if (files[candidates[i]] != null) return candidates[i];
  }
  return null;
}

// Regex-based import/require scanning — deliberately simple (this is a
// teaching-scale IDE feature, not a real parser): matches `import ... from
// '...'`, bare `import '...'`, and `require('...')`, multi-line named
// imports included. Doesn't understand `export ... from '...'` re-exports
// or specifiers inside strings/comments — a real edge case, not hit by
// any bundled example.
function findLocalImportSpecs(src){
  var specs = [];
  var re = /(?:^|[^.\w])import\s+(?:[\s\S]*?\sfrom\s*)?['"]([^'"]+)['"]|require\(\s*['"]([^'"]+)['"]\s*\)/g;
  var m;
  while ((m = re.exec(src))) { specs.push(m[1] || m[2]); }
  return specs.filter(function(s){ return /^\.\//.test(s); });
}

function buildModuleBundle(entryFile){
  var visited = {};
  var order = [];
  function visit(name){
    if (visited[name]) return;
    visited[name] = true;
    var src = files[name];
    if (src == null) throw new Error('Module not found: '+name);
    findLocalImportSpecs(src).forEach(function(spec){
      var resolved = resolveModuleId(spec);
      if (!resolved) throw new Error('Cannot resolve import "'+spec+'" in '+name);
      visit(resolved);
    });
    order.push(name);
  }
  visit(entryFile);
  return order;
}

// Rewrites `require('./utils')` (as emitted by ts.ModuleKind.CommonJS for
// an `import ... from './utils'`) to the fully-resolved filename
// (`require('utils.ts')`) so the __modules registry below — keyed by full
// filename, resolved once at build time — doesn't need its own runtime
// extension-resolution logic.
function rewriteRequirePaths(code){
  return code.replace(/require\((["'])([^"']+)\1\)/g, function(m, q, spec){
    if (!/^\.\//.test(spec)) return m;
    var resolved = resolveModuleId(spec);
    return resolved ? 'require('+JSON.stringify(resolved)+')' : m;
  });
}

// Injected once per built document, before any bundled module — a minimal
// require()/module.exports runtime, same shape as Node's own.
var MODULE_RUNTIME_SHIM = [
  'var __modules = {};',
  'var __cache = {};',
  'function __require(id){',
  '  if (__cache[id]) return __cache[id].exports;',
  '  if (typeof __modules[id] !== "function") throw new Error("Cannot find module: " + id);',
  '  var module = { exports: {} };',
  '  __cache[id] = module;',
  '  __modules[id](module, module.exports, __require);',
  '  return module.exports;',
  '}'
].join('\n');

// --- Webapp mode: build one real HTML document out of every file the
// project's index.html references. External http(s) URLs (CDN
// <script>/<link> tags) are left untouched so @script-style dependencies
// still work; local .ts/.tsx/.js/.jsx <script src> entries are bundled
// (see buildModuleBundle) so they can import each other; local
// <script type="x-shader/..." src="..."> tags (the classic "shader source
// lives in its own script tag" convention) get their raw file text
// inlined as inert (non-executed) script content instead. ---
function buildWebappDoc(){
  var html = files['index.html'];
  var bundleInjected = false;

  html = html.replace(/<link([^>]+)href=["']([^"']+)["']([^>]*)>/gi, function(m, pre, href, post){
    if (!/rel=["']stylesheet["']/i.test(pre+post)) return m;
    if (/^https?:\/\//i.test(href)) return m;
    var fn = href.replace(/^\.\//,'');
    if (files[fn] == null) return m;
    return '<style>\n'+files[fn]+'\n</style>';
  });

  // Shader/data <script type="..." src="...">: inline raw text, preserving
  // the type attribute, so runtime code can read it via .textContent
  // rather than having it executed as JS.
  html = html.replace(/<script([^>]*\stype=["'](?:x-shader[^"']*|glsl|x-[^"']*)["'][^>]*)\ssrc=["']([^"']+)["']([^>]*)><\/script>/gi,
    function(m, attrs, src, post){
      if (/^https?:\/\//i.test(src)) return m;
      var fn = src.replace(/^\.\//,'');
      if (files[fn] == null) return m;
      return '<script'+attrs+post+'>\n'+files[fn]+'\n<\/script>';
    });

  html = html.replace(/<script([^>]*)\ssrc=["']([^"']+)["']([^>]*)><\/script>/gi, function(m, pre, src, post){
    if (/^https?:\/\//i.test(src)) return m;
    if (/\stype=["']/.test(pre+post)) return m; // non-JS script tags (shaders etc.) already handled above
    var fn = src.replace(/^\.\//,'');
    if (files[fn] == null) return m;

    if (!/\.tsx?$|\.jsx?$/.test(fn)) {
      return '<script>\n'+files[fn]+'\n<\/script>';
    }

    var order;
    try { order = buildModuleBundle(fn); }
    catch(e){ return '<script>console.error('+JSON.stringify('Bundle error: '+e.message)+');<\/script>'; }

    var parts = [];
    if (!bundleInjected) { parts.push(MODULE_RUNTIME_SHIM); bundleInjected = true; }
    order.forEach(function(name){
      var js;
      try { js = rewriteRequirePaths(transpileToCommonJS(files[name], name)); }
      catch(e){ js = 'throw new Error('+JSON.stringify('Compile error in '+name+': '+e.message)+');'; }
      parts.push('__modules['+JSON.stringify(name)+'] = function(module, exports, require){\n'+js+'\n};');
    });
    parts.push('__require('+JSON.stringify(fn)+');');
    return '<script>\n'+parts.join('\n')+'\n<\/script>';
  });

  if (/<head[^>]*>/i.test(html)) html = html.replace(/<head([^>]*)>/i, '<head$1>'+CONSOLE_SHIM);
  else html = CONSOLE_SHIM + html;

  return html;
}

function runWebapp(btn){
  var ifr = document.getElementById('iframe-preview');
  var cv = document.getElementById('canvas-preview');
  var doc;
  try { doc = buildWebappDoc(); }
  catch(e){ log('Webapp build failed: '+e.message,'err'); setStatus('Build error','st-err'); btn.classList.remove('running'); btn.textContent='▶ Run'; return; }

  ensureMsgHandler();
  cv.style.display = 'none';
  ifr.style.display = 'block';
  ifr.srcdoc = doc;
  log('--- Webapp build & run ('+Object.keys(files).length+' files) ---','dim');
  setPvTab('canvas');
  setStatus('Building...', 'st-run');
  btn.classList.remove('running'); btn.textContent='▶ Run'; // 'ready' postMessage also resets this once the page actually loads
}

// --- Run (single-file script mode: canvas/DOM demos, no index.html) ---
function runScript(btn){
  var lang = langFor(activeFile);
  var code = editor.getValue();

  if (lang === 'glsl'){ runGLSL(code); btn.classList.remove('running'); btn.textContent='▶ Run'; return; }
  if (lang !== 'ts' && lang !== 'js'){
    log('Nothing to run for .'+extOf(activeFile)+' — open a script file, or a project with index.html for webapp mode.', 'warn');
    btn.classList.remove('running'); btn.textContent='▶ Run';
    return;
  }

  setStatus('Transpiling...', 'st-run');

  var scripts = [];
  code.replace(/\/\/\s*@script\s+(\S+)/g, function(_,u){ scripts.push(u); });

  var jsCode;
  if (lang === 'ts'){
    try { jsCode = transpileTs(code, activeFile); setStatus('Compiled OK', 'st-ok'); }
    catch(e){ log('Compile error: '+e.message,'err'); setStatus('Compile error','st-err'); btn.classList.remove('running'); btn.textContent='▶ Run'; return; }
  } else {
    jsCode = code;
  }

  var cv = document.getElementById('canvas-preview');
  fitCanvasPreview(); // ensure the mirror canvas already fills the current preview area before we size the inner one to match
  var scriptTags = scripts.map(function(u){ return '<script src="'+u+'"><\/script>'; }).join('\n');

  // The inner canvas sizes itself to the iframe's OWN window, which is
  // already CSS-responsive (position:absolute;inset:0;width/height:100%)
  // — so it tracks the real preview area continuously, including later
  // resizes (dragging the panel dividers, resizing the whole window).
  // BUT: for canvas-only scripts (see usesCanvas below) this iframe is
  // immediately set to display:none — it's only used as an offscreen
  // render source that copyFrame() mirrors onto the visible cv canvas —
  // and a display:none iframe's own window.innerWidth/innerHeight collapse
  // to 0, which made every canvas-based script draw onto a 0x0 canvas
  // ("Canvas rendered! W=0 H=0", nothing visible). Fall back to the mirror
  // canvas's current size (already correct — fitCanvasPreview() just ran
  // above) whenever the iframe's own window size reads as 0.
  var srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0d13;overflow:hidden;font-family:system-ui,sans-serif;color:#e2e8f0}
#preview{position:absolute;inset:0;width:100%;height:100%}
canvas#preview{display:block}
</style></head><body>
<canvas id="preview"></canvas>
${scriptTags}
${CONSOLE_SHIM}
<script>
(function(){
  var c = document.getElementById('preview');
  function fit(){
    c.width = window.innerWidth || ${cv.width || 800};
    c.height = window.innerHeight || ${cv.height || 600};
  }
  fit();
  window.addEventListener('resize', fit);
})();
try {
${jsCode}
} catch(e){ console.error(e.message||String(e)); }
<\/script>
</body></html>`;

  ensureMsgHandler();
  log('--- Run ---','dim');
  setPvTab('canvas');

  var ifr = document.getElementById('iframe-preview');
  ifr.srcdoc = srcdoc;

  var usesCanvas = /getContext\s*\(|WebGLRenderingContext|CanvasRenderingContext/.test(code);
  var usesDOM = /innerHTML|createElement|getElementById|querySelector/.test(code) && !usesCanvas;

  if (usesDOM){
    cv.style.display='none';
    ifr.style.display='block';
  } else {
    cv.style.display='block';
    ifr.style.display='none';
    // The mirror canvas's own width/height are kept current by the
    // ResizeObserver in fitCanvasPreview() — drawImage here just scales
    // whatever the inner canvas currently holds onto it, so both stay
    // full-size even if the preview panel is resized mid-run.
    var copyFrame = function(){
      try {
        var ifrCv = ifr.contentDocument && ifr.contentDocument.getElementById('preview');
        if (ifrCv && ifrCv.tagName === 'CANVAS') cv.getContext('2d').drawImage(ifrCv, 0, 0, cv.width, cv.height);
      } catch(e){}
    };
    setTimeout(copyFrame, 300);
    var frames = 0;
    var anim = function(){
      copyFrame();
      if (frames++ < 300) requestAnimationFrame(anim);
    };
    requestAnimationFrame(anim);
  }

  // The 'ready' postMessage from the iframe also resets the button
  // (see ensureMsgHandler) once the sandboxed code actually starts
  // running; this sync reset just covers the synchronous build step.
  btn.classList.remove('running'); btn.textContent='▶ Run';
}

function runCode(){
  var btn = document.getElementById('run-btn');
  if(btn.classList.contains('running')) return;
  if (activeFile) files[activeFile] = editor.getValue();

  btn.classList.add('running'); btn.textContent='● Running';

  // A project with an index.html is a webapp — build and run the whole
  // thing regardless of which individual file happens to be focused.
  // Both run* functions reset the button themselves once their
  // synchronous build step finishes.
  if (files['index.html'] != null) runWebapp(btn);
  else runScript(btn);
}

// --- GLSL runner ---
function runGLSL(fragSrc){
  clearAll();
  log('Compiling GLSL shader...','dim');
  setPvTab('canvas');

  var cv = document.getElementById('canvas-preview');
  cv.style.display = 'block';
  document.getElementById('iframe-preview').style.display = 'none';
  fitCanvasPreview(); // full current preview-area size; the WebGL frame loop below re-reads cv.width/height every frame, so later resizes (ResizeObserver keeps it in sync) are picked up automatically
  var gl;
  try { gl = cv.getContext('webgl') || cv.getContext('experimental-webgl'); } catch(e){}
  if(!gl){ log('WebGL not available','err'); return; }

  var vertSrc = `
    attribute vec2 a_pos;
    void main(){ gl_Position = vec4(a_pos,0.0,1.0); }
  `;

  function mkShader(src, type){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
  }

  try {
    var prog = gl.createProgram();
    gl.attachShader(prog, mkShader(vertSrc, gl.VERTEX_SHADER));
    gl.attachShader(prog, mkShader(fragSrc, gl.FRAGMENT_SHADER));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);

    var quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

    var posLoc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

    var uTime = gl.getUniformLocation(prog, 'u_time');
    var uRes = gl.getUniformLocation(prog, 'u_resolution');

    var t0 = Date.now();
    var animId;
    function frame(){
      var t = (Date.now()-t0)/1000;
      gl.viewport(0, 0, cv.width, cv.height);
      if(uTime) gl.uniform1f(uTime, t);
      if(uRes) gl.uniform2f(uRes, cv.width, cv.height);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      animId = requestAnimationFrame(frame);
    }
    frame();
    setStatus('GLSL running','st-ok');
    log('Shader compiled and running. Animating.','ok');
  } catch(e){
    log('GLSL error: '+e.message,'err');
    setStatus('GLSL error','st-err');
  }
}

// --- Project management ---
// The sandboxed AppSDK bridge (window.AppSDK, injected into this page by
// the service worker on load — see src/sw.ts's APPSDK_BOOTSTRAP) depends
// on a postMessage handshake completing before any call can ever resolve;
// if that handshake is missed (a class of SW-timing flakiness this
// project's own testing docs already call out), every AppSDK call queues
// forever and never settles — not a rejection try/catch can see, an
// actual hang. Race it against a timeout so a stuck bridge degrades to
// "no saved projects shown" instead of leaving refreshSidebar() (which
// awaits this before ever touching sb.innerHTML — see below) hung
// forever, blocking the Files/Starters sections too.
function withTimeout(promise, ms, fallback){
  return Promise.race([
    promise,
    new Promise(function(resolve){ setTimeout(function(){ resolve(fallback); }, ms); })
  ]);
}

// Like withTimeout, but rejects instead of resolving with a fallback — for
// write/list operations that already have a try/catch around them and should
// surface a clear "timed out" error rather than silently pretending to
// succeed. Guards against the same AppSDK postMessage-handshake hang that
// listProjects() works around above (see withTimeout call in listProjects).
function withDeadline(promise, ms, message){
  return Promise.race([
    promise,
    new Promise(function(_, reject){ setTimeout(function(){ reject(new Error(message)); }, ms); })
  ]);
}
var SDK_TIMEOUT_MS = 5000;

async function listProjects(){
  try {
    var items = await withTimeout(sdk().list(VFS_BASE), 3000, []);
    return (items||[]).map(function(x){ return typeof x==='string'?x:(x.name||x); }).filter(function(n){ return n && !n.startsWith('.'); });
  } catch(e){ return []; }
}

// Loads every file in a VFS directory as the active project. Works for
// projects saved under VFS_BASE and for any arbitrary folder opened via
// "Open Folder" — both just end up as a directory full of files.
async function loadProjectFromDir(dir){
  var items;
  try { items = await withDeadline(sdk().list(dir), SDK_TIMEOUT_MS, 'Timed out listing: '+dir); }
  catch(e){ log('Could not open folder: '+e.message,'err'); return; }
  var names = (items||[]).map(function(x){ return typeof x==='string'?x:(x.name||x); }).filter(function(n){ return n && !n.startsWith('.'); });
  if (!names.length){ log('Folder is empty: '+dir,'warn'); return; }

  var newFiles = {};
  var skipped = [];
  for (var i=0;i<names.length;i++){
    var n = names[i];
    try { newFiles[n] = await withDeadline(sdk().readText(dir+'/'+n), SDK_TIMEOUT_MS, 'Timed out reading: '+n); }
    catch(e){ skipped.push(n); /* subdirectory (e.g. node_modules/.git) or unreadable entry */ }
  }
  if (!Object.keys(newFiles).length){ log('No readable files in: '+dir,'warn'); return; }
  if (skipped.length){
    log('Skipped '+skipped.length+' subdirector'+(skipped.length===1?'y':'ies')+'/unreadable entr'+(skipped.length===1?'y':'ies')+' (nested folders like node_modules aren\'t opened — this IDE reads one flat directory of files): '+skipped.join(', '),'warn');
  }

  files = newFiles;
  projectDir = dir;

  // Git-lite: restore each file's last-saved snapshot from .git-lite/ (if
  // any) so the modified indicator/diff reflect real history instead of
  // treating every file as freshly modified just because it was opened.
  gitLiteSnapshots = {};
  var snapNames = Object.keys(files);
  for (var gi=0; gi<snapNames.length; gi++){
    var gn = snapNames[gi];
    try { gitLiteSnapshots[gn] = await withDeadline(sdk().readText(dir+'/'+GIT_LITE_DIR+'/'+gn), SDK_TIMEOUT_MS, 'timeout'); }
    catch(e){ /* no snapshot yet for this file — it reads as modified */ }
  }

  // Generic folder support: a real external JS/TS project has no index.html,
  // so fall back to package.json's "main"/"module" entrypoint (if that file
  // is actually among what was read), then a bare main.*, then alphabetical.
  var pkg = readPackageJson();
  var pkgEntry = pkg && (pkg.main || pkg.module);
  var pick = names.indexOf('index.html')!==-1 ? 'index.html'
    : (pkgEntry && files[pkgEntry] != null ? pkgEntry : null)
    || (names.filter(function(n){ return /^main\./.test(n); })[0])
    || Object.keys(files).sort()[0];
  activeFile = null; // force switchFile to treat this as a real switch
  switchFile(pick);
  isDirty = false;
  updateBadge();
  log('Opened: '+(projectName()||dir)+' ('+Object.keys(files).length+' files)','info');
}

async function saveProject(){
  if (activeFile) files[activeFile] = editor.getValue();
  var dir = projectDir;
  if (!dir){
    var name = prompt('Project name:','my-project');
    if (!name) return;
    name = name.trim().replace(/[^a-zA-Z0-9_-]/g,'_');
    dir = VFS_BASE+'/'+name;
  }
  try {
    await withDeadline(sdk().mkdir(dir), SDK_TIMEOUT_MS, 'Timed out creating: '+dir);
    var names = Object.keys(files);
    for (var i=0;i<names.length;i++){
      await withDeadline(sdk().writeText(dir+'/'+names[i], files[names[i]]), SDK_TIMEOUT_MS, 'Timed out writing: '+names[i]);
    }

    // Git-lite: snapshot each just-saved file into <projectDir>/.git-lite/
    // — "what the file looked like at last save" — so future edits can be
    // diffed against it. Best-effort: a snapshot failure shouldn't fail
    // the actual save.
    try {
      await withDeadline(sdk().mkdir(dir+'/'+GIT_LITE_DIR), SDK_TIMEOUT_MS, 'timeout');
      for (var k=0;k<names.length;k++){
        await withDeadline(sdk().writeText(dir+'/'+GIT_LITE_DIR+'/'+names[k], files[names[k]]), SDK_TIMEOUT_MS, 'timeout');
        gitLiteSnapshots[names[k]] = files[names[k]];
      }
    } catch(e){ log('Git-lite snapshot failed: '+e.message,'warn'); }

    projectDir = dir;
    isDirty = false;
    updateBadge();
    log('Saved: '+dir+' ('+names.length+' files)','ok');
    refreshSidebar();
  } catch(e){
    log('Save failed: '+e.message,'err');
  }
}

// Toolbar "New" starts a brand-new project (clears the file list);
// the sidebar's "+" next to Files instead adds one file to whatever
// project is currently open.
function newProject(){
  if (isDirty && !confirm('Discard unsaved changes?')) return;
  var name = prompt('New file name (with extension):','app.ts');
  if (!name) return;
  files = {};
  files[name] = '';
  // Brand-new, never-saved file: intentionally no gitLiteSnapshots entry,
  // so it reads as modified until the first Save.
  gitLiteSnapshots = {};
  projectDir = null;
  activeFile = null;
  switchFile(name);
  isDirty = false;
  updateBadge();
  clearAll();
  log('New project: '+name,'dim');
  if (typeof closeNewProjectModal === 'function') closeNewProjectModal();
}

async function addFileToProject(){
  var name = prompt('New file name (with extension):', 'utils.ts');
  if (!name) return;
  if (files[name] != null){ log('A file named "'+name+'" already exists','warn'); switchFile(name); return; }
  files[name] = '';
  // No gitLiteSnapshots entry for this name yet -> shows modified until saved.
  if (projectDir){
    try { await withDeadline(sdk().writeText(projectDir+'/'+name, ''), SDK_TIMEOUT_MS, 'timeout'); } catch(e){}
  }
  switchFile(name);
  log('Added file: '+name,'ok');
}

async function deleteFile(name){
  if (!confirm('Delete "'+name+'"? This cannot be undone.')) return;
  delete files[name];
  delete gitLiteSnapshots[name];
  if (projectDir){
    try { await withDeadline(sdk().remove(projectDir+'/'+name), SDK_TIMEOUT_MS, 'timeout'); } catch(e){}

async function renameFile(oldName){
  var newName = prompt('Rename file:', oldName);
  if (!newName || newName === oldName) return;
  if (files[newName] != null){ log('A file named "'+newName+'" already exists','warn'); return; }
  files[newName] = files[oldName];
  delete files[oldName];
  if (Object.prototype.hasOwnProperty.call(gitLiteSnapshots, oldName)){
    gitLiteSnapshots[newName] = gitLiteSnapshots[oldName];
  }
  delete gitLiteSnapshots[oldName];
  if (projectDir){
    try { await withDeadline(sdk().rename(projectDir+'/'+oldName, projectDir+'/'+newName), SDK_TIMEOUT_MS, 'timeout'); }
    catch(e){
      try {
        await withDeadline(sdk().writeText(projectDir+'/'+newName, files[newName]), SDK_TIMEOUT_MS, 'timeout');
        await withDeadline(sdk().remove(projectDir+'/'+oldName), SDK_TIMEOUT_MS, 'timeout');
      } catch(_){}

    try { await withDeadline(sdk().rename(projectDir+'/'+GIT_LITE_DIR+'/'+oldName, projectDir+'/'+GIT_LITE_DIR+'/'+newName), SDK_TIMEOUT_MS, 'timeout'); } catch(e){}
  }
  if (activeFile === oldName) activeFile = newName;
  refreshSidebar();
  updateBadge();
  log('Renamed to: '+newName,'ok');
}

// --- Git-lite diff view ---
// Small self-contained LCS line-diff (no external lib, no build step
// available to this file). O(n*m) DP table — fine for the file sizes this
// toy IDE deals with. Returns an array of {type:'ctx'|'add'|'del', line}.
function computeLineDiff(oldStr, newStr){
  var a = (oldStr==null?'':oldStr).split('\n');
  var b = (newStr==null?'':newStr).split('\n');
  var n = a.length, m = b.length;
  var dp = new Array(n+1);
  for (var i=0;i<=n;i++){ dp[i] = new Array(m+1).fill(0); }
  for (i=n-1;i>=0;i--){
    for (var j=m-1;j>=0;j--){
      dp[i][j] = (a[i]===b[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  var result = [];
  i = 0; var jj = 0;
  while (i<n && jj<m){
    if (a[i]===b[jj]){ result.push({type:'ctx', line:a[i]}); i++; jj++; }
    else if (dp[i+1][jj] >= dp[i][jj+1]){ result.push({type:'del', line:a[i]}); i++; }
    else { result.push({type:'add', line:b[jj]}); jj++; }
  }
  while (i<n){ result.push({type:'del', line:a[i]}); i++; }
  while (jj<m){ result.push({type:'add', line:b[jj]}); jj++; }
  return result;
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showDiff(){
  if (activeFile) files[activeFile] = editor.getValue();
  var name = activeFile;
  document.getElementById('diff-title').textContent = 'Diff' + (name ? ' — '+name : '');
  var body = document.getElementById('diff-body');

  if (!name){
    body.innerHTML = '<div class="diff-empty">No file open.</div>';
  } else {
    var snap = gitLiteSnapshots[name];
    if (snap === undefined){
      body.innerHTML = '<div class="diff-empty">No saved snapshot yet — save the file first.</div>';
    } else {
      var current = files[name] || '';
      var diff = computeLineDiff(snap, current);
      var changed = diff.some(function(d){ return d.type !== 'ctx'; });
      if (!changed){
        body.innerHTML = '<div class="diff-empty">No differences since last save.</div>';
      } else {
        body.innerHTML = diff.map(function(d){
          var prefix = d.type==='add' ? '+' : (d.type==='del' ? '-' : ' ');
          return '<div class="diff-line '+d.type+'"><span class="dp">'+prefix+'</span>'+escapeHtml(d.line)+'</div>';
        }).join('');
      }
    }
  }
  document.getElementById('diff-overlay').classList.add('show');
}

function closeDiff(){
  document.getElementById('diff-overlay').classList.remove('show');
}

  varying vec3 v_col;

  varying vec3 v_col;

precision mediump float;
uniform float u_time;

  const expected = [0,1,1,0];

{name:'TF.js — Autograd Regression', lang:'ts', icon:'📈', code:
`// TensorFlow.js — Linear regression via RAW autograd (no model.fit)
// Demonstrates tf.variableGrads(): automatic differentiation of a loss
// function with respect to trainable tf.variable()s — the same idea as
// PyTorch's loss.backward() + optimizer.step(), just through TF.js's
// functional API instead of an imperative tape object. No tf.sequential
// model here — just tensors, variables, and gradients.
// @script https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js

declare var tf: any;

async function main() {
  console.log('TensorFlow.js version: ' + tf.version.tfjs);

  // Synthetic data: y = 2x + 1 + noise
  const trueW = 2, trueB = 1;
  const n = 50;
  const xsData: number[] = [];
  const ysData: number[] = [];
  for (let i = 0; i < n; i++) {
    const x = Math.random() * 10;
    const noise = (Math.random() - 0.5) * 3;
    xsData.push(x);
    ysData.push(trueW * x + trueB + noise);
  }
  const xs = tf.tensor1d(xsData);
  const ys = tf.tensor1d(ysData);

  // Trainable parameters — plain tf.variable()s, not a tf.sequential model.
  const w = tf.variable(tf.scalar(Math.random() - 0.5), true, 'w');
  const b = tf.variable(tf.scalar(Math.random() - 0.5), true, 'b');

  const predict = (x: any) => x.mul(w).add(b);
  const loss = (predY: any, trueY: any) => predY.sub(trueY).square().mean();

  const canvas = document.getElementById('preview') as HTMLCanvasElement;
  const ctx = canvas.getContext('2d')!;

  function draw(wVal: number, bVal: number, epoch: number) {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, W, H);

    const pad = 32, xMax = 10, yMax = 26;
    const toPx = (x: number, y: number): [number, number] =>
      [pad + (x / xMax) * (W - 2 * pad), H - pad - (y / yMax) * (H - 2 * pad)];

    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad, H - pad); ctx.lineTo(W - pad, H - pad);
    ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad);
    ctx.stroke();

    ctx.fillStyle = '#38bdf8';
    for (let i = 0; i < xsData.length; i++) {
      const [px, py] = toPx(xsData[i], ysData[i]);
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fill();
    }

    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const [x1, y1] = toPx(0, bVal);
    const [x2, y2] = toPx(xMax, wVal * xMax + bVal);
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.fillStyle = '#e2e8f0';
    ctx.font = '13px monospace';
    ctx.fillText(\`epoch \${epoch}  w=\${wVal.toFixed(3)}  b=\${bVal.toFixed(3)}\`, pad, 18);
  }

  const lr = 0.01;
  const epochs = 150;

  console.log(\`True parameters: w=\${trueW}, b=\${trueB}\`);
  console.log(\`Start: w=\${(await w.data())[0].toFixed(4)}, b=\${(await b.data())[0].toFixed(4)}\`);
  console.log('\\nTraining via tf.variableGrads() — raw autograd, no optimizer.minimize()...');

  for (let epoch = 0; epoch < epochs; epoch++) {
    // tf.variableGrads() differentiates the loss with respect to every
    // tf.variable() it touches — this call IS the "auto gradient" step,
    // computed without anyone writing a derivative by hand.
    const { value, grads } = tf.variableGrads(() => loss(predict(xs), ys));

    // Manual SGD update — same "apply the gradient yourself" step as
    // PyTorch's \`param -= lr * param.grad\`.
    w.assign(w.sub(grads['w'].mul(lr)));
    b.assign(b.sub(grads['b'].mul(lr)));
    tf.dispose(grads);

    if (epoch % 5 === 0 || epoch === epochs - 1) {
      const [wVal, bVal] = await Promise.all([w.data(), b.data()]);
      draw(wVal[0], bVal[0], epoch);
      if ((epoch + 1) % 30 === 0 || epoch === epochs - 1) {
        const lossVal = (await value.data())[0];
        console.log(\`Epoch \${epoch + 1}/\${epochs} — loss: \${lossVal.toFixed(5)}\`);
      }
      await new Promise(r => setTimeout(r, 20));
    }
    value.dispose();
  }

  const finalW = (await w.data())[0];
  const finalB = (await b.data())[0];
  console.log(\`\\n✓ Training complete!\`);
  console.log(\`Learned: w=\${finalW.toFixed(4)} (true \${trueW}), b=\${finalB.toFixed(4)} (true \${trueB})\`);

  xs.dispose(); ys.dispose();
}

main().catch((e: Error) => console.error('Error:', e.message));
`},

  font-size: 20px;
  margin: 0 0 8px;
}
p { color: #94a3b8; font-size: 13px; line-height: 1.6; }
code {
  background: #1e293b;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 12px;
}
button {
  background: #2563eb;
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  margin-top: 8px;
}
button:hover { background: #3b82f6; }
`,
'app.ts':
`// Entry point — index.html loads this file as a <script src="app.ts">.
// Run rebuilds index.html + style.css + app.ts into one real page and
// shows it live in the preview pane (open the Console tab for logs).
const app = document.getElementById('app') as HTMLElement;

let count = 0;
function render() {
  app.innerHTML = \`
    <h1>Hello, Webapp!</h1>
    <p>This project has three files: <code>index.html</code>, <code>style.css</code>, <code>app.ts</code> — edit any of them in the sidebar.</p>
    <p>Count: \${count}</p>
    <button id="inc">Click me</button>
  \`;
  (document.getElementById('inc') as HTMLButtonElement).onclick = () => { count++; render(); };
}
render();
console.log('Webapp started');
`
}}
];

// --- Starters: unified list combining Examples + Templates into real,
// multi-file mini-projects — every one gets a visible, editable
// index.html (no more hidden auto-generated HTML scaffold) plus a
// tsconfig.json. exampleToProject() adapts each single-file EXAMPLES
// entry into that shape without rewriting its actual code — it still just
// references document.getElementById('preview') exactly as before; that
// canvas now comes from a real index.html instead of an invisible
// runScript()-generated one, so nothing about the example code changes. ---
var SHARED_TSCONFIG = `{
  "compilerOptions": {
    "target": "ES2017",
    "module": "ESNext",
    "jsx": "none",
    "strict": false
  }
}
`;

function mkCanvasIndexHtml(title){
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
    + '<title>'+title+'</title>\n<style>\n'
    + '  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0d13; }\n'
    + '  #preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }\n'
    + '</style>\n</head>\n<body>\n<canvas id="preview"></canvas>\n'
    + '<script>\n(function(){\n  var c = document.getElementById("preview");\n'
    + '  function fit(){ c.width = window.innerWidth; c.height = window.innerHeight; }\n'
    + '  fit();\n  window.addEventListener("resize", fit);\n})();\n<\/script>\n'
    + '<script src="app.ts"><\/script>\n</body>\n</html>\n';
}

var GLSL_INDEX_HTML = mkCanvasIndexHtml('GLSL Shader')
  .replace('<script src="app.ts">', '<script id="fragShader" type="x-shader/x-fragment" src="shader.frag"><\/script>\n<script src="app.ts">');

var GLSL_APP_TS =
`// app.ts — compiles shader.frag (inlined into index.html as a
// <script type="x-shader/x-fragment">, the classic "shader source lives in
// its own script tag" convention) and animates it on the canvas.
const canvas = document.getElementById('preview') as HTMLCanvasElement;
const gl = canvas.getContext('webgl') as WebGLRenderingContext;
if (!gl) throw new Error('WebGL not supported');

const fragSrc = (document.getElementById('fragShader') as HTMLScriptElement).textContent || '';

const vertSrc = \`
  attribute vec2 a_pos;
  void main(){ gl_Position = vec4(a_pos,0.0,1.0); }
\`;

function mkShader(src: string, type: number): WebGLShader {
  const s = gl.createShader(type)!;
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader error');
  return s;
}

const prog = gl.createProgram()!;
gl.attachShader(prog, mkShader(vertSrc, gl.VERTEX_SHADER));
gl.attachShader(prog, mkShader(fragSrc, gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || 'link error');
gl.useProgram(prog);

const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

const posLoc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes = gl.getUniformLocation(prog, 'u_resolution');

const t0 = Date.now();
function frame() {
  const t = (Date.now() - t0) / 1000;
  gl.viewport(0, 0, canvas.width, canvas.height);
  if (uTime) gl.uniform1f(uTime, t);
  if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
frame();

console.log('Shader compiled and running. Edit shader.frag and press ▶ Run to see changes.');
`;

function exampleToProject(ex){
  if (ex.lang === 'glsl') {
    return { 'index.html': GLSL_INDEX_HTML, 'shader.frag': ex.code, 'app.ts': GLSL_APP_TS, 'tsconfig.json': SHARED_TSCONFIG };
  }
  var ext = ex.lang === 'js' ? 'js' : 'ts';
  var proj = { 'index.html': mkCanvasIndexHtml(ex.name), 'tsconfig.json': SHARED_TSCONFIG };
  proj['app.'+ext] = ex.code;
  return proj;
}

// "Cross-File Imports" — written directly as a project (no single-file
// EXAMPLES entry to wrap) to demonstrate that project files can genuinely
// import from each other: utils.ts is pulled in only because app.ts's
// import statement references it (see buildModuleBundle/__require in
// buildWebappDoc()).
var CROSS_FILE_IMPORTS_FILES = {
  'index.html': mkCanvasIndexHtml('Cross-File Imports'),
  'tsconfig.json': SHARED_TSCONFIG,
  'utils.ts':
`// utils.ts — a small module with no side effects, imported by app.ts.
// Proves project files can genuinely import from each other: each file is
// transpiled to CommonJS and wired up by a tiny require()/module.exports
// runtime (see this app's own buildModuleBundle/__require), so relative
// imports resolve at run time, in-browser, with no real bundler/build step.

export function add(a: number, b: number): number {
  return a + b;
}

export function greet(name: string): string {
  return \`Hello, \${name}! 👋\`;
}

export const PI_APPROX = 3.14159;
`,
  'app.ts':
`// app.ts — imports from ./utils to prove cross-file imports work.
// index.html loads only this file (<script src="app.ts">); utils.ts is
// pulled in transitively because this import statement references it —
// open utils.ts in the sidebar to see what it exports.
import { add, greet, PI_APPROX } from './utils';

const canvas = document.getElementById('preview') as HTMLCanvasElement;
const ctx = canvas.getContext('2d')!;
const W = canvas.width, H = canvas.height;

ctx.fillStyle = '#0f172a';
ctx.fillRect(0, 0, W, H);

ctx.fillStyle = '#e2e8f0';
ctx.font = 'bold 20px monospace';
ctx.textAlign = 'center';
ctx.fillText('Cross-File Imports', W / 2, H / 2 - 40);

ctx.font = '14px monospace';
ctx.fillStyle = '#94a3b8';
ctx.fillText(greet('project'), W / 2, H / 2 - 10);
ctx.fillText(\`add(2, 3) = \${add(2, 3)}\`, W / 2, H / 2 + 14);
ctx.fillText(\`PI_APPROX = \${PI_APPROX}\`, W / 2, H / 2 + 38);

console.log(greet('console'));
console.log('add(2, 3) =', add(2, 3));
console.log('PI_APPROX =', PI_APPROX);
console.log('');
console.log('utils.ts exported add/greet/PI_APPROX; app.ts imported them with a normal ES import statement.');
`
};

// Webapp Starter didn't have a tsconfig.json before — add one so every
// starter consistently has a real, visible, respected compiler config.
TEMPLATES[0].files['tsconfig.json'] = SHARED_TSCONFIG;

// The single unified list New Project / the sidebar show — every entry is
// {name, icon, files}, no more separate Examples/Templates shape.
var STARTERS = EXAMPLES.map(function(ex){ return { name: ex.name, icon: ex.icon, files: exampleToProject(ex) }; })
  .concat([{ name: 'Cross-File Imports', icon: '🔗', files: CROSS_FILE_IMPORTS_FILES }])
  .concat(TEMPLATES.map(function(t){ return { name: t.name, icon: t.icon, files: t.files }; }));

// "New" toolbar button opens this dropdown-style modal instead of going
// straight to a filename prompt, so starters are browsable/picked visually
// (requirement: examples live in the New Project flow, not a bare prompt()).
function openNewProjectModal(){
  // No isDirty/confirm check here — just browsing the list isn't destructive.
  // newProject()/loadStarter() (fired by an actual selection) each already
  // guard the real discard.
  var body = document.getElementById('newproj-body');
  var html = '<div class="newproj-group-label">Blank</div>'
    + '<div class="newproj-item" onclick="newProject()"><span class="ic">📄</span><span class="nm">Blank File…</span></div>'
    + '<div class="newproj-group-label">Starters</div>';
  STARTERS.forEach(function(st,i){
    html += '<div class="newproj-item" onclick="loadStarter('+i+')"><span class="ic">'+st.icon+'</span><span class="nm">'+st.name+'</span></div>';
  });
  body.innerHTML = html;
  document.getElementById('newproj-overlay').classList.add('show');
}
function closeNewProjectModal(){
  document.getElementById('newproj-overlay').classList.remove('show');
}

function loadStarter(i){
  if(isDirty && !confirm('Discard unsaved changes?')) return;
  var st = STARTERS[i];
  files = Object.assign({}, st.files);
  // Git-lite: baseline = the content just loaded, so browsing a starter
  // doesn't itself show as "modified" — only actual edits after this do.
  gitLiteSnapshots = Object.assign({}, st.files);
  projectDir = null;
  var pick = files['index.html'] != null ? 'index.html' : Object.keys(files)[0];
  activeFile = null;
  switchFile(pick);
  isDirty = false;
  updateBadge();
  clearAll();
  log('Loaded: '+st.name+' ('+Object.keys(files).length+' files)','dim');
  refreshSidebar();
  if (typeof closeNewProjectModal === 'function') closeNewProjectModal();
  if (files['index.html'] != null) runCode();
}

// --- Boot ---
// Defined AFTER EXAMPLES/TEMPLATES so the initial load below can
// actually see them — loading the very first example synchronously at
// CodeMirror-setup time (before this data existed) used to throw and
// silently abort the rest of the boot script.
loadStarter(0);
log('TypeScript / WebGL IDE ready', 'info');
log('Files are per-extension: .ts/.js/.glsl/.html/.css all edit and run correctly in the same project.', 'dim');
log('Click "New" for the full list of starters — including multi-file webapp, cross-file import, and GLSL shader examples — or "Open Folder" to open any real JS/TS project.', 'dim');
setPvTab('canvas');
</script>
</body>
