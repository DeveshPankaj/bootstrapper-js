<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC Chat</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d26; --panel2: #212533; --panel3: #2a2f40; --line: #2e3346;
    --text: #e6e9f2; --muted: #8d95ab; --accent: #5b8def; --accent-d: #3f74d9;
    --ok: #3ecf8e; --warn: #f5b84b; --danger: #ef5b6b; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; outline: none; min-width: 0; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  input[type=checkbox] { width: 16px; height: 16px; padding: 0; flex-shrink: 0; accent-color: var(--accent); margin-top: 2px; }
  input[type=color] { width: 34px; height: 30px; padding: 2px; flex-shrink: 0; }
  input[type=range] { accent-color: var(--accent); }
  input[readonly] { color: var(--muted); }
  .muted { color: var(--muted); } .small { font-size: 11.5px; }
  .ic { display: inline-flex; vertical-align: middle; }
  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel3); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
  .btn:hover { background: #343a50; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--accent-d); }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: var(--panel3); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  #app { display: flex; height: 100%; }
  #side { width: 250px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .side-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #8a63ff); display: grid; place-items: center; color: #fff; }
  .title { font-weight: 700; font-size: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; flex-shrink: 0; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
  .me-info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .me-info input { padding: 4px 8px; font-weight: 600; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex-shrink: 0; font-size: 13px; }
  .connect-row { display: flex; gap: 6px; padding: 4px 14px 10px; }
  .connect-row .btn { flex: 1; justify-content: center; }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .sec { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 4px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: var(--panel2); }
  .item.active { background: var(--panel3); }
  .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .avatar { width: 24px; height: 24px; font-size: 11px; }
  .badge { background: var(--accent); color: #fff; border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 700; min-width: 18px; text-align: center; }
  .item .more { opacity: 0; } .item:hover .more { opacity: 1; }
  .side-foot { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .side-foot .btn { flex: 1; justify-content: center; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  #head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-height: 52px; }
  #now-playing { display: flex; align-items: center; gap: 10px; padding: 6px 16px; border-bottom: 1px solid var(--line); background: var(--panel2); font-size: 12.5px; }
  #now-playing:empty { display: none; }
  .np-bar { flex: 1; min-width: 60px; height: 5px; border-radius: 3px; background: var(--panel3); cursor: pointer; overflow: hidden; }
  .np-bar > i { display: block; height: 100%; background: var(--accent); pointer-events: none; }
  .wb-toolbar { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .wb-toolbar input { flex: none; }   /* override .row > input{flex:1} — a color swatch/slider must not stretch to fill the row */
  .wb-toolbar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wb-canvas-wrap { position: relative; padding: 14px; background: var(--panel); overflow: auto; }
  .wb-canvas-wrap canvas { background: #fff; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.25); touch-action: none; cursor: crosshair; display: block; }
  .wb-cursor { position: absolute; top: 14px; left: 14px; width: 20px; height: 20px; border-radius: 50% 50% 50% 3px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 700; pointer-events: none; transform: translate(-2px, -18px); transition: left .08s linear, top .08s linear; box-shadow: 0 1px 3px rgba(0,0,0,.5); border: 2px solid #fff; z-index: 2; }
  .wb-cursor .wb-name { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: inherit; color: #fff; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 5px; white-space: nowrap; }
  #head .h-title { font-weight: 700; font-size: 15px; }
  #head .h-sub { color: var(--muted); font-size: 12px; }
  #head .grow { flex: 1; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { display: flex; gap: 8px; max-width: 78%; align-self: flex-start; }
  .msg.mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar { width: 26px; height: 26px; font-size: 11px; margin-top: 2px; }
  .bubble { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; min-width: 60px; overflow-wrap: anywhere; }
  .msg.mine .bubble { background: #26407a; border-color: #34549c; }
  .bubble .who { font-size: 11.5px; font-weight: 700; margin-bottom: 1px; }
  .bubble .time { font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 2px; }
  .bubble .text { white-space: pre-wrap; }
  .bubble a { color: #8db4ff; }
  .sys { align-self: center; color: var(--muted); font-size: 11.5px; padding: 2px 10px; background: var(--panel); border-radius: 10px; }
  .file-card { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .file-card .f-ic { width: 34px; height: 34px; border-radius: 8px; background: var(--panel3); display: grid; place-items: center; flex-shrink: 0; }
  .file-card .f-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
  .bubble img.preview { display: block; max-width: 300px; max-height: 260px; border-radius: 8px; cursor: zoom-in; background: #0004; }
  .bar { height: 4px; background: var(--panel3); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  #composer { display: flex; align-items: flex-end; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  #composer textarea { flex: 1; resize: none; max-height: 140px; min-height: 36px; }
  #drop { position: absolute; inset: 0; background: rgba(91,141,239,.18); border: 2px dashed var(--accent); display: none; place-items: center; font-size: 16px; font-weight: 700; pointer-events: none; }
  #drop.on { display: grid; }
  .empty { margin: auto; max-width: 440px; text-align: center; padding: 20px; }
  .empty h2 { margin: 0 0 6px; font-size: 20px; }
  .empty ol { text-align: left; color: var(--muted); padding-left: 20px; margin: 12px 0 16px; }
  .empty .btns { display: flex; gap: 8px; justify-content: center; }

  .overlay { position: fixed; inset: 0; background: rgba(5,7,12,.62); display: grid; place-items: center; z-index: 50; padding: 14px; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  .modal-head .grow { flex: 1; }
  .modal-body { padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
  .tab { background: none; border: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .card-head { display: flex; align-items: center; gap: 8px; }
  .card-head .grow { flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > label { font-size: 11.5px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; }
  .warnbox { border: 1px solid #6b5320; background: #2b2410; color: #f0d9a0; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t td, table.t th { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); }
  table.t th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; background: var(--panel3); }
  .chip.rw { background: #4a2a2f; color: #ffb3bc; } .chip.ro { background: #1f3a30; color: #9be6c3; }
  .list { display: flex; flex-direction: column; }
  .list .li { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .list .li.click { cursor: pointer; } .list .li.click:hover { background: var(--panel2); }
  .list .li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
  .crumbs button { background: none; border: none; color: #8db4ff; padding: 2px 4px; border-radius: 5px; }
  .crumbs button:hover { background: var(--panel3); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.86); display: grid; place-items: center; z-index: 80; cursor: zoom-out; }
  .lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 6px; }
  #toasts { position: fixed; right: 14px; bottom: 76px; display: flex; flex-direction: column; gap: 8px; z-index: 90; pointer-events: none; }
  .toast { background: var(--panel3); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 12px; max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .toast.ok { border-left-color: var(--ok); } .toast.bad { border-left-color: var(--danger); } .toast.warn { border-left-color: var(--warn); }
  @media (max-width: 640px) { #side { width: 190px; } .msg { max-width: 92%; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="side-head">
      <div class="logo" id="logo"></div>
      <div><div class="title">WebRTC Chat</div><div class="pill" id="status-pill"></div></div>
    </div>
    <div class="me">
      <div class="avatar" id="me-avatar"></div>
      <div class="me-info"><input id="me-name" maxlength="40" placeholder="Your name" title="Your display name"><div class="muted small" id="me-id"></div></div>
    </div>
    <div class="connect-row" id="connect-row"></div>
    <div class="chat-list" id="chat-list"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main id="main">
    <header id="head"></header>
    <div id="now-playing"></div>
    <div id="messages"></div>
    <div id="composer"></div>
    <div id="drop">Drop files to send</div>
  </main>
</div>
<div id="modals"></div>
<div id="toasts"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════════
// 0. helpers
// ════════════════════════════════════════════════════════════════════════════
const $ = (sel, root = document) => root.querySelector(sel);
const enc = new TextEncoder(), dec = new TextDecoder();
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const randHex = (bytes) => Array.from(crypto.getRandomValues(new Uint8Array(bytes)), b => b.toString(16).padStart(2, '0')).join('');
const ID_RE = /^[0-9a-f]{20}$/;
// Strips control + bidi-override characters (display-name / filename spoofing) and clamps length.
const cleanText = (s, max) => String(s == null ? '' : s).replace(/[\u0000-\u001f\u007f‎‏‪-‮⁦-⁩]/g, '').trim().slice(0, max);
const fmtBytes = (n) => { if (n < 1024) return n + ' B'; const u = ['KB', 'MB', 'GB']; let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < 2); return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i]; };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtAgo = (ts) => { const s = Math.floor((Date.now() - ts) / 1000); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'h'; };
const hueOf = (id) => { let x = 0; for (const ch of id) x = (x * 31 + ch.charCodeAt(0)) % 360; return x; };
const shortId = (id) => id.slice(0, 4);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}

const ICONS = {
  plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  clip: '<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  userplus: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>',
  folder: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  file: '<path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  sliders: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  hash: '<line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  play: '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>',
  pause: '<rect x="6" y="4" width="4" height="16" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" fill="currentColor" stroke="none"/>',
  volume: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
  mute: '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  eraser: '<path d="m7 21-4.3-4.3a2 2 0 0 1 0-2.8l9.6-9.6a2 2 0 0 1 2.8 0l5.7 5.7a2 2 0 0 1 0 2.8L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/>',
  undo2: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3L3 13"/>',
  board: '<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 20h18"/><path d="M8 20v-2"/><path d="M16 20v-2"/>',
  drive: '<line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  up: '<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
};
function ic(name, size = 16) {
  const s = h('span', { class: 'ic' });
  s.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ''}</svg>`;
  return s;
}
function avatar(id, name, size) {
  const a = h('div', { class: 'avatar', style: { background: `hsl(${hueOf(id)} 50% 42%)` } }, (name || '?').trim().charAt(0).toUpperCase() || '?');
  if (size) { a.style.width = a.style.height = size + 'px'; }
  return a;
}
function toast(text, kind) {
  const el = h('div', { class: 'toast ' + (kind || '') }, text);
  $('#toasts').append(el);
  setTimeout(() => el.remove(), kind === 'bad' ? 7000 : 4000);
}
async function copyText(text, label) {

const PROTO = 1;

const myId = randHex(10);

const invites = new Map();   // invite id -> pending outgoing invite
const joins = new Map();     // invite id -> received offer / our answer
const relayNeg = new Map();  // target id -> in-flight mesh negotiation

// ════════════════════════════════════════════════════════════════════════════
// 5. conversations, messages, groups
// ════════════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════════════════
// 6. file transfer (chunked, backpressured; one ordered channel per pair)

// ════════════════════════════════════════════════════════════════════════════
// 6b. Listen Together — one shared, synced audio track per group.

const modalStack = [];
