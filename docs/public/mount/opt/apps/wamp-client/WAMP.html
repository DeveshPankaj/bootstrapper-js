<!-- WAMP.html — opens Webamp through the `webamp` command (main.js), which loads the vendored,
     version-pinned, SRI-checked library (audit NET-12) instead of an unpinned CDN script. -->
<script>
  const cmd = platform.host.getCommand('webamp');
  if (cmd) cmd.exec();
  else console.warn('[webamp] the webamp command is not registered (is the WAMP Client package installed?)');
  try { platform.getService('props').close(); } catch (_) {}
</script>
