<title>VSCode</title>
<style>
    body {
      margin: 0;
      padding: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
</style>
  
<!-- Third-party embed (audit NET-2): code-server keeps its own origin (it needs its storage,
     service worker and sign-in form), its dialogs, downloads and link/preview popups — but no
     top navigation and no popups that escape the sandbox, and no referrer. -->
<iframe src="https://code-public.pankajdevesh.com/?folder=/config/workspace/react-app"
  sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-popups"
  allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
<script>

  const props = platform.getService('props')
  props.setHeaderStyles({
    backgroundColor: 'rgb(32, 115, 70)'
  })
</script>
