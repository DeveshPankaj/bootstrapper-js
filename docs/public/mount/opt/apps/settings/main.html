<style>
  body {
    margin: 0;
  }

  #dragger {
    width: 10rem;
    height: 10rem;
    background: #c2c2c2;
    cursor: pointer;
    display: none;
  }
</style>
<script type="module" defer>
  onload = () => {
    const React = platform.getService('React');
    const ReactDOM = platform.getService('ReactDOM');
    const props = platform.getService('props');

    // console.log(props, React, ReactDOM);

    props.toggleHeader(false);
    // Spatial glass look (visionOS-like): the window paints the frosted material,
    // this page draws on top of it with white "vibrant" text (see the styles below).
    if (typeof props.setWindowMaterial === 'function') props.setWindowMaterial('glass');
    // Light or dark, following Settings › Window Manager › Themes › Mode.
    const appearanceSub = platform.host.appearance$?.subscribe(a => document.documentElement.setAttribute('data-appearance', a));
    window.addEventListener('pagehide', () => appearanceSub?.unsubscribe());

    const dom = document.getElementById('react-root');
    const root = ReactDOM.createRoot(dom);
    const appModuleSource = document.querySelector('script[type="text/React-Jsx"]').innerText;

    const {App} = platform.host.execString(appModuleSource);
    root.render(React.createElement(App, props, []));



    // document.getElementById('render-btn').addEventListener('click', () => {
    //   props.close();
    // });

    // const dragger = document.getElementById('dragger');
    const dragger = dom

    let isDragging = false;
    let startX, startY, startRect;

    const onDragStart = (event) => {
      // Move the window from empty areas only: dragging a slider, selecting text
      // in a field or clicking a control must not move the window.
      const t = event.target;
      if (event.button !== 0 || (t && t.closest && t.closest('input, textarea, select, button, a, label, [contenteditable], .settings-nav-item, .no-drag'))) return;
      isDragging = true;
      startRect = props.getBoundingClientRect();
      startX = event.clientX;
      startY = event.clientY;
      if(event.target.localName === 'section') event.preventDefault(); // Prevent default dragging behavior
    };

    const onDrag = (event) => {
      if (!isDragging) return;

      const deltaX = event.clientX - startX;
      const deltaY = event.clientY - startY;

      const newRect = {
        left: startRect.left + deltaX,
        top: startRect.top + deltaY,
        right: startRect.right + deltaX,
        bottom: startRect.bottom + deltaY
      };

      props.setBoundingClientRect(newRect);
    };

    const onDragEnd = () => {
      isDragging = false;
    };

    dragger.addEventListener('mousedown', onDragStart);
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', onDragEnd);

    // Function to center the iframe
    const centerIframe = () => {
      const currentRect = props.getBoundingClientRect();
      const iframeWidth = currentRect.right - currentRect.left;
      const iframeHeight = currentRect.bottom - currentRect.top;

      // Parent dimensions based on iframe size and offsets, using props.host dimensions
      const parentWidth = iframeWidth + currentRect.left + (props.host.innerWidth - currentRect.right);
      const parentHeight = iframeHeight + currentRect.top + (props.host.innerHeight - currentRect.bottom);

      // Calculate new centered position
      const newRect = {
        left: (parentWidth - iframeWidth) / 2,
        top: (parentHeight - iframeHeight) / 2,
        right: (parentWidth + iframeWidth) / 2,
        bottom: (parentHeight + iframeHeight) / 2
      };

      props.setBoundingClientRect(newRect);
    };

    const centerAndResize = () => {
      const host = props.host || platform.window.top || platform.window;
      const vw = host.innerWidth  || 1280;
      const vh = host.innerHeight || 800;
      const w = Math.min(920, vw - 80);
      const h = Math.min(620, vh - 60);
      const sx = (host.document && host.document.querySelector('.windows'))
                   ? (host.document.querySelector('.windows').parentElement?.scrollLeft || 0) : 0;
      const sy = (host.document && host.document.querySelector('.windows'))
                   ? (host.document.querySelector('.windows').parentElement?.scrollTop  || 0) : 0;
      props.setBoundingClientRect({
        left:         sx + Math.round((vw - w) / 2),
        top:          sy + Math.round((vh - h) / 2),
        width:        w,
        height:       h,
        borderRadius: '2.25rem'
      });
    };

    centerAndResize()
  };

</script>
<script type="text/React-Jsx">
  const React = require('React');
  const ReactDOM = platform.getService('ReactDOM');

  const fs = platform.host.getFS()
  const origin = platform.window.location.origin || platform.window.location.ancestorOrigins[0] || '';

  const metaFileRawContent = fs.readFileSync('/user-preferences.json')
  const userPreferences = JSON.parse(metaFileRawContent)
  const configWallpapers = userPreferences.wallpapers ?? []
  const contactInfo = userPreferences.contact ?? {}

  const imageExtensions = new Set([
    '.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.bmp', '.ico', '.avif',
  ])

  const imageMimeTypes = {
    '.png': 'image/png',
    '.jpg': 'image/jpeg',
    '.jpeg': 'image/jpeg',
    '.gif': 'image/gif',
    '.webp': 'image/webp',
    '.svg': 'image/svg+xml',
    '.bmp': 'image/bmp',
    '.ico': 'image/x-icon',
    '.avif': 'image/avif',
  }

  const getExt = (name) => {
    const parts = name.split('.')
    return parts.length > 1 ? `.${parts.at(-1).toLowerCase()}` : ''
  }

  // Generic image-thumbnail hook: reads each image-extension file in `entries`
  // from the virtual fs and exposes path -> blob URL. Mirrors the approach in
  // the file explorer (`/(sw)/...` subresource fetches aren't intercepted from
  // uncontrolled `about:blank` iframes, so thumbnails are built from blob URLs
  // read directly via `platform.host.getFS()`).
  const useThumbnails = (entries, getPath, getExtOf) => {
    const [thumbnails, setThumbnails] = React.useState({})
    const key = entries.map(getPath).join(' ')
    React.useEffect(() => {
      const urls = []
      const next = {}
      entries.forEach(entry => {
        const ext = getExtOf(entry)
        if (!imageExtensions.has(ext)) return
        try {
          const data = fs.readFileSync(getPath(entry))
          const blob = new Blob([data], {type: imageMimeTypes[ext] || 'application/octet-stream'})
          const url = URL.createObjectURL(blob)
          next[getPath(entry)] = url
          urls.push(url)
        } catch (err) {}
      })
      setThumbnails(next)
      return () => urls.forEach(url => URL.revokeObjectURL(url))
    }, [key])
    return thumbnails
  }

  // Generic file picker modal: browses the virtual fs starting at `initialDir`,
  // optionally restricting selectable files to `accept` (a Set of lowercase
  // extensions, e.g. imageExtensions). Calls `onSelect(path)` then `onClose()`.
  // When `mode === 'folder'`, only directories are listed and the footer's
  // "Choose" button selects the currently open directory (`dir`) rather than
  // requiring a clicked file.
  const FilePicker = ({ initialDir, accept, title, mode, onSelect, onClose }) => {
    const [dir, setDir] = React.useState(initialDir || '/home/user1')
    const [selected, setSelected] = React.useState(null)

    const readDir = (d) => {
      try {
        return fs.readdirSync(d)
          .map(name => {
            const path = d === '/' ? `/${name}` : `${d}/${name}`
            let isDir = false
            try { isDir = fs.statSync(path).isDirectory() } catch (err) {}
            return { name, path, isDir, ext: getExt(name) }
          })
          .sort((a, b) => (a.isDir === b.isDir) ? a.name.localeCompare(b.name) : (a.isDir ? -1 : 1))
      } catch (err) {
        return []
      }
    }

    const [entries, setEntries] = React.useState(() => readDir(dir))

    React.useEffect(() => {
      setEntries(readDir(dir))
      setSelected(null)
    }, [dir])

    const thumbnails = useThumbnails(entries.filter(e => !e.isDir), e => e.path, e => e.ext)

    const breadcrumbs = React.useMemo(() => {
      const parts = dir.split('/').filter(Boolean)
      const crumbs = [{ name: 'Root', path: '/' }]
      let acc = ''
      parts.forEach(p => { acc += `/${p}`; crumbs.push({ name: p, path: acc }) })
      return crumbs
    }, [dir])

    const visibleEntries = mode === 'folder'
      ? entries.filter(e => e.isDir)
      : entries.filter(e => e.isDir || !accept || accept.has(e.ext))

    const choose = (path) => {
      onSelect(path)
      onClose()
    }

    return (
      <div className="filepicker-overlay" onClick={onClose}>
        <div className="filepicker-dialog" onClick={e => e.stopPropagation()}>
          <div className="filepicker-header">
            <span>{title || 'Choose a file'}</span>
            <span className="filepicker-close material-symbols-outlined" onClick={onClose}>close</span>
          </div>
          <div className="filepicker-breadcrumbs">
            {breadcrumbs.map((c, i) => (
              <React.Fragment key={c.path}>
                {i > 0 && <span className="material-symbols-outlined sep">chevron_right</span>}
                <span className="crumb" onClick={() => setDir(c.path)}>{c.name}</span>
              </React.Fragment>
            ))}
          </div>
          <div className="filepicker-grid">
            {visibleEntries.length === 0 && (
              <div className="filepicker-empty">This folder is empty.</div>
            )}
            {visibleEntries.map(entry => (
              <div
                key={entry.path}
                className={`filepicker-item ${selected === entry.path ? 'selected' : ''}`}
                onClick={() => !entry.isDir && setSelected(entry.path)}
                onDoubleClick={() => entry.isDir ? setDir(entry.path) : choose(entry.path)}
                title={entry.name}
              >
                <div
                  className="filepicker-icon"
                  style={thumbnails[entry.path] ? { backgroundImage: `url('${thumbnails[entry.path]}')` } : undefined}
                >
                  {!thumbnails[entry.path] && (
                    <span className="material-symbols-outlined">{entry.isDir ? 'folder' : 'draft'}</span>
                  )}
                </div>
                <span className="filepicker-name">{entry.name}</span>
              </div>
            ))}
          </div>
          <div className="filepicker-footer">
            <button className="settings-btn" onClick={onClose}>Cancel</button>
            {mode === 'folder' ? (
              <button className="settings-btn primary" onClick={() => choose(dir)}>Choose This Folder</button>
            ) : (
              <button className="settings-btn primary" disabled={!selected} onClick={() => choose(selected)}>Choose</button>
            )}
          </div>
        </div>
      </div>
    )
  }

  // Parses '#rrggbb[aa]' or 'rgb(a)(...)' CSS colors into {r, g, b, a}.
  const parseCssColor = (str) => {
    str = (str || '').trim()
    if (str.startsWith('#')) {
      let hex = str.slice(1)
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('')
      const r = parseInt(hex.slice(0, 2), 16) || 0
      const g = parseInt(hex.slice(2, 4), 16) || 0
      const b = parseInt(hex.slice(4, 6), 16) || 0
      const a = hex.length >= 8 ? parseInt(hex.slice(6, 8), 16) / 255 : 1
      return { r, g, b, a }
    }
    const m = str.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)/)
    if (m) return { r: +m[1], g: +m[2], b: +m[3], a: m[4] !== undefined ? +m[4] : 1 }
    return { r: 0, g: 0, b: 0, a: 1 }
  }

  const rgbToHex = (r, g, b) => '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('')

  // Color + opacity picker that reads/writes an 'rgba(r, g, b, a)' CSS color string.
  const ColorAlphaInput = ({ value, onChange }) => {
    const { r, g, b, a } = parseCssColor(value)
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
        <input type="color" value={rgbToHex(r, g, b)} onChange={e => {
          const next = parseCssColor(e.target.value)
          onChange(`rgba(${next.r}, ${next.g}, ${next.b}, ${a})`)
        }} />
        <input type="range" min="0" max="1" step="0.01" value={a} title="Opacity"
          onChange={e => onChange(`rgba(${r}, ${g}, ${b}, ${e.target.value})`)}
          style={{ width: '5rem' }} />
        <span style={{ fontSize: '0.75rem', color: '#666', width: '2.5rem', textAlign: 'right' }}>{Math.round(a * 100)}%</span>
      </div>
    )
  }

  const WM_SETTINGS_PATH = '/etc/wm/current.json'
  const WM_THEMES_DIR = '/etc/wm/themes'

  const DEFAULT_WM_SETTINGS = {
    appearance: {
      headerBackground: '#000000',
      headerColor: '#ffffff',
      windowBackground: 'rgba(255, 255, 255, 0.15)',
      taskbarBackground: 'rgba(0, 0, 0, 0.5)',
      taskbarSize: 56,
      accentColor: '#0a84ff',
      borderRadius: 6,
      blur: 10,
      shadow: true,
    },
    behavior: {
      dblClickHeaderFullscreen: true,
      bringToFrontOnClick: true,
    },
  }

  // Keep in sync with FS_BACKEND_STORAGE_KEY / FS_BACKEND_QUERY_PARAM in src/index.ts.
  const FS_BACKEND_STORAGE_KEY = '__app_fs_backend__'
  const FS_BACKEND_QUERY_PARAM = 'fsBackend'

  const FS_BACKEND_OPTIONS = [
    { id: 'indexeddb', label: 'IndexedDB', desc: 'Default. Large storage quota (GB-scale) — used for the full filesystem and mounted local folders.' },
    { id: 'localstorage', label: 'LocalStorage', desc: 'Small quota (~5-10MB). Switch to this to access files saved by older versions of this app that stored data in localStorage.' },
  ]

  const WIDGETS_DIR = '/etc/widgets'
  const WIDGETS_CONFIG_PATH = '/etc/widgets/config.json'

  // Widgets hidden by default until the user enables them here, even though
  // their script is loaded/registered at boot.
  const DEFAULT_HIDDEN_WIDGETS = ['toolbar']

  const readAvailableWidgets = () => {
    try {
      return fs.readdirSync(WIDGETS_DIR)
        .filter(f => f.endsWith('.js'))
        .map(f => f.replace(/\.js$/, ''))
    } catch (err) {
      return []
    }
  }

  const readEnabledWidgetNames = (available) => {
    try {
      const cfg = JSON.parse(fs.readFileSync(WIDGETS_CONFIG_PATH, 'utf-8'))
      if (Array.isArray(cfg.enabled)) return cfg.enabled
    } catch (err) { /* default: all enabled except DEFAULT_HIDDEN_WIDGETS */ }
    return available.filter(name => !DEFAULT_HIDDEN_WIDGETS.includes(name))
  }

  // Renders a live, inert preview of a widget by calling its own `render`.
  const WidgetPreview = ({ widget }) => {
    const ref = React.useRef(null)

    React.useEffect(() => {
      if (!ref.current || !widget) return
      const el = ref.current
      const cleanup = widget.render(el, { platform, onDestroy: () => {} })
      return () => { if (typeof cleanup === 'function') cleanup() }
    }, [widget])

    return <div className="widget-preview" ref={ref} style={{
      marginTop: '0.5rem',
      padding: '0.6rem 0.8rem',
      background: 'rgba(0, 0, 0, 0.06)',
      borderRadius: '8px',
      display: 'inline-block',
      pointerEvents: 'none',
    }}></div>
  }

  // Settings service: lets other vfs scripts dynamically register/unregister
  // their own Settings page (nav item + content), without editing this file.
  // `registerSection(name, render, meta)` mirrors `registerWidget` - `render`
  // is called with a container element + `{platform, onDestroy}` when the
  // section's nav item is selected. `meta.title`/`meta.icon`/`meta.color`
  // control the nav item's label/icon/badge color, `meta.marginTop` (e.g.
  // 'auto') can push a section (and those after it) to the bottom of the
  // sidebar. `utils` exposes the helpers/constants above so individual
  // section scripts (e.g. /etc/settings/*.js) don't need to duplicate them.
  const settingsSectionRemovers = new Map()
  const settingsUtils = {
    fs, origin, userPreferences, configWallpapers, contactInfo,
    imageExtensions, imageMimeTypes, getExt,
    useThumbnails, FilePicker, WidgetPreview,
    parseCssColor, rgbToHex, ColorAlphaInput,
    DEFAULT_WM_SETTINGS, WM_SETTINGS_PATH, WM_THEMES_DIR,
    FS_BACKEND_STORAGE_KEY, FS_BACKEND_QUERY_PARAM, FS_BACKEND_OPTIONS,
    WIDGETS_DIR, WIDGETS_CONFIG_PATH, DEFAULT_HIDDEN_WIDGETS,
    readAvailableWidgets, readEnabledWidgetNames,
  }
  // Registered on the root platform (not this settings-window platform) so
  // other vfs scripts/modules can reach it via `platform.getService('settings')`
  // regardless of which window/module they're running in.
  const rootPlatform = platform.host.getModulePlatform('root') ?? platform
  rootPlatform.register('settings', {
    utils: settingsUtils,
    registerSection: (name, render, meta) => {
      const { remove } = platform.host.registerSettingsSection(name, render, meta)
      settingsSectionRemovers.set(name, remove)
      return {
        remove: () => {
          remove()
          settingsSectionRemovers.delete(name)
        },
      }
    },
    unregisterSection: (name) => {
      const remove = settingsSectionRemovers.get(name)
      if (remove) {
        remove()
        settingsSectionRemovers.delete(name)
      }
    },
  })

  // All Settings sections - including the built-in pages (About, Projects,
  // Contact, Wallpaper, Layout, Window Manager, Widgets, Storage) - live as
  // individual scripts in /etc/settings/ (mirrors the /etc/widgets/
  // convention - force_reload: false, user-editable), numbered so their
  // filename order determines sidebar order. Each script calls
  // `platform.getService('settings').registerSection(name, render, meta)`
  // (or `platform.host.registerSettingsSection` directly) to add itself.
  // On every Settings open, scan the folder (sorted) and load any script
  // whose section isn't registered yet, so reopening Settings doesn't
  // re-run scripts loaded on a previous open. A script registers under its
  // file name without `.js` (e.g. '05-layout'); that is how this check knows
  // it's loaded. (Registering a name again replaces the section, so a
  // mismatched name costs a re-run, never a duplicate entry.)
  const SETTINGS_SECTIONS_DIR = '/etc/settings'
  // Sections that were removed or merged into others. Their files are no longer
  // shipped, but a vfs from an older version may still hold them, so skip them:
  // 04b-desktop-env / 12-workspaces (empty stubs), 14-theme-builder (merged into
  // 06-window-manager), 99-example (developer sample).
  const RETIRED_SECTIONS = new Set(['04b-desktop-env', '12-workspaces', '14-theme-builder', '99-example'])

  const getRegisteredSectionNames = () => {
    let names = []
    const sub = platform.host.settingsSections$.subscribe(sections => { names = sections.map(s => s.name) })
    sub.unsubscribe()
    return names
  }

  const loadDynamicSettingsScripts = () => {
    let files = []
    try {
      files = fs.readdirSync(SETTINGS_SECTIONS_DIR).filter(f => f.endsWith('.js')).sort()
    } catch (err) { return }

    const registered = getRegisteredSectionNames()

    files.forEach(file => {
      const name = file.replace(/\.js$/, '')
      if (registered.includes(name) || RETIRED_SECTIONS.has(name)) return
      try {
        const source = fs.readFileSync(`${SETTINGS_SECTIONS_DIR}/${file}`, 'utf-8')
        platform.host.execString(source, `${SETTINGS_SECTIONS_DIR}/${file}`)
      } catch (err) {
        console.error(`Failed to load settings section ${file}`, err)
      }
    })
  }

  loadDynamicSettingsScripts()

  // Renders a registered settings section's content into a container,
  // mirroring `WidgetPreview` (collects `onDestroy` callbacks registered by
  // `section.render` and runs them on unmount).
  const DynamicSettingsPage = ({ section }) => {
    const ref = React.useRef(null)

    React.useEffect(() => {
      if (!ref.current) return
      const el = ref.current
      const destroyCallbacks = []
      const cleanup = section.render(el, { platform, onDestroy: cb => destroyCallbacks.push(cb) })
      return () => {
        if (typeof cleanup === 'function') cleanup()
        destroyCallbacks.forEach(cb => cb())
      }
    }, [section])

    return <div ref={ref}></div>
  }

  exports.App = (props) => {
    const onCloseHandler = () => {
      props.close();
    };

    // Every Settings page - built-in and dynamically-registered - is a
    // registered settings section (see /etc/settings/*.js), reflected here
    // via settingsSections$.
    const [sections, setSections] = React.useState([])
    React.useEffect(() => {
      const sub = platform.host.settingsSections$.subscribe(setSections)
      return () => sub.unsubscribe()
    }, [])

    const allPages = sections.map(section => ({
      id: `dynamic-${section.name}`,
      name: section.name,
      label: section.meta?.title ?? section.name,
      icon: section.meta?.icon ?? 'extension',
      color: section.meta?.color ?? '#8e8e93',
      marginTop: section.meta?.marginTop,
      component: () => <DynamicSettingsPage section={section} />,
    }))

    const [currentPage, setCurrentPage] = React.useState(null)
    const [query, setQuery] = React.useState('')
    const q = query.trim().toLowerCase()
    const visiblePages = q ? allPages.filter(p => String(p.label).toLowerCase().includes(q)) : allPages

    // props.$args[0], when given (e.g. by the desktop's "Change Wallpaper"
    // context menu item), names a section to land on instead of the
    // default first page — matches the `name` a section registered with,
    // e.g. '04-wallpapers'. Sections register progressively as each
    // /etc/settings/*.js file loads, so allPages can be non-empty before
    // the wanted one has registered — grabbing allPages[0] as soon as
    // *anything* was available would lock in the wrong page for good
    // (this effect bails out once currentPage is set), so wait for the
    // specific wanted section instead of falling back early.
    React.useEffect(() => {
      if (currentPage) return
      const wanted = props.$args && props.$args[0]
      if (wanted) {
        const target = allPages.find(p => p.name === wanted)
        if (target) setCurrentPage(target)
        return
      }
      if (allPages.length) setCurrentPage(allPages[0])
    }, [allPages, currentPage])

    return (
      <>
        <span
          className="close-button"
          title="Close window"
          onClick={onCloseHandler}
        ></span>
        <div className="settings-root">
          <nav className="settings-sidebar">
            <div className="settings-sidebar-title">Settings</div>
            <label className="settings-search">
              <span className="material-symbols-outlined">search</span>
              <input
                type="search"
                placeholder="Search"
                aria-label="Search settings"
                value={query}
                onChange={e => setQuery(e.target.value)}
              />
            </label>
            <div className="settings-nav-list">
              {visiblePages.map(page => (
                <div
                  key={page.id}
                  className={`settings-nav-item ${page.id === currentPage?.id ? 'active' : ''}`}
                  style={{marginTop: q ? undefined : page.marginTop}}
                  onClick={() => setCurrentPage(page)}
                >
                  <span className="settings-nav-icon material-symbols-outlined">{page.icon}</span>
                  <span>{page.label}</span>
                </div>
              ))}
              {!visiblePages.length && <div className="settings-nav-empty">No matches</div>}
            </div>
          </nav>
          <section className="settings-content">
            {currentPage && <currentPage.component/>}
          </section>
        </div>
      </>
    );
  };

</script>
<style>
@font-face {
  font-family: 'Material Symbols Outlined';
  font-style: normal;
  font-weight: 100 700;
  src: url(https://fonts.gstatic.com/s/materialsymbolsoutlined/v138/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsLjBuVY.woff2) format('woff2');
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 20px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  -webkit-font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
}

/* ── Spatial glass design (visionOS-like) ─────────────────────────────────────
   The window itself paints the frosted material (props.setWindowMaterial('glass'),
   src/core/layout/styles/window.ts); this page stays transparent and draws white
   "vibrant" text, translucent platters and capsule controls on top of it.
   Everything reads the --vs-* tokens below, so a theme can restyle the whole page
   by overriding them. (No `color-scheme: dark`: a color scheme different from the
   desktop's makes Chrome paint the iframe opaque.) */
:root {
  --vs-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
  --vs-text: rgba(255, 255, 255, 0.96);
  --vs-text-2: rgba(255, 255, 255, 0.66);
  --vs-text-3: rgba(255, 255, 255, 0.44);
  --vs-fill: rgba(255, 255, 255, 0.075);      /* platters: groups, cards */
  --vs-fill-2: rgba(255, 255, 255, 0.13);     /* controls, hover */
  --vs-fill-3: rgba(255, 255, 255, 0.21);     /* selected, pressed */
  --vs-recessed: rgba(0, 0, 0, 0.20);         /* text fields, search */
  --vs-stroke: rgba(255, 255, 255, 0.13);     /* rims */
  --vs-separator: rgba(255, 255, 255, 0.09);
  --vs-sidebar: rgba(255, 255, 255, 0.045);
  --vs-on: #34c759;                           /* switches */
  --vs-link: #7cc7ff;
  --vs-danger: #ff7a70;
  --vs-warning: #ffcc66;
  --vs-accent: #0a84ff;
  --vs-radius-lg: 22px;
  --vs-radius-md: 16px;
  --vs-radius-sm: 12px;
  --vs-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --vs-selected-rim: rgba(255, 255, 255, 0.6);   /* chosen card / option */
  --vs-track: rgba(255, 255, 255, 0.21);         /* switch off, slider rail */
  --vs-strong: rgba(255, 255, 255, 0.94);        /* primary button, checked radio */
  --vs-on-strong: #1c1c1e;                       /* text on --vs-strong */
  --vs-scroll: rgba(255, 255, 255, 0.22);
  --vs-menu-bg: rgba(58, 58, 64, 0.82);
  --vs-dialog-bg: rgba(54, 54, 60, 0.86);
}

/* Light appearance: frosted white glass, dark text. data-appearance is set from
   platform.host.appearance$ (Settings › Window Manager › Themes › Mode). */
:root[data-appearance="light"] {
  --vs-text: rgba(0, 0, 0, 0.86);
  --vs-text-2: rgba(0, 0, 0, 0.56);
  --vs-text-3: rgba(0, 0, 0, 0.38);
  --vs-fill: rgba(255, 255, 255, 0.50);
  --vs-fill-2: rgba(0, 0, 0, 0.06);
  --vs-fill-3: rgba(255, 255, 255, 0.88);
  --vs-recessed: rgba(0, 0, 0, 0.06);
  --vs-stroke: rgba(0, 0, 0, 0.07);
  --vs-separator: rgba(0, 0, 0, 0.08);
  --vs-sidebar: rgba(255, 255, 255, 0.28);
  --vs-link: #0a64d6;
  --vs-danger: #d70015;
  --vs-warning: #a35200;
  --vs-selected-rim: rgba(0, 0, 0, 0.22);
  --vs-track: rgba(0, 0, 0, 0.14);
  --vs-strong: #1c1c1e;
  --vs-on-strong: #ffffff;
  --vs-scroll: rgba(0, 0, 0, 0.22);
  --vs-menu-bg: rgba(250, 250, 252, 0.88);
  --vs-dialog-bg: rgba(246, 246, 249, 0.90);
}

html, body {
  background: transparent;
  font-family: var(--vs-font);
  color: var(--vs-text);
  -webkit-font-smoothing: antialiased;
}

* { scrollbar-width: thin; scrollbar-color: var(--vs-scroll) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--vs-scroll); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

::selection { background: var(--vs-fill-3); }
a { color: var(--vs-link); }
code {
  background: var(--vs-recessed);
  border-radius: 6px;
  padding: 0.05rem 0.35rem;
  font-size: 0.85em;
}

.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300; }

/* Close: a round glass button in the corner */
.close-button {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  background: var(--vs-fill-2);
  box-shadow: inset 0 0 0 1px var(--vs-stroke);
  transition: background 0.2s var(--vs-ease), transform 0.2s var(--vs-ease);
  z-index: 1000;
}
.close-button::before,
.close-button::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 1.75px;
  border-radius: 2px;
  background: var(--vs-text);
}
.close-button::before { transform: translate(-50%, -50%) rotate(45deg); }
.close-button::after { transform: translate(-50%, -50%) rotate(-45deg); }
.close-button:hover { background: var(--vs-fill-3); transform: scale(1.06); }

/* Shell */
.settings-root {
  display: flex;
  height: 100%;
  width: 100%;
  color: var(--vs-text);
  text-align: left;
}

.settings-sidebar {
  flex: 0 0 15rem;
  display: flex;
  flex-direction: column;
  background: var(--vs-sidebar);
  border-right: 1px solid var(--vs-separator);
  padding: 1.4rem 0.8rem 1rem;
  box-sizing: border-box;
  overflow: auto;
}

.settings-sidebar-title {
  font-size: 1.85rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  padding: 0 0.6rem 0.9rem;
}

.settings-search {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin: 0 0.2rem 0.9rem;
  padding: 0 0.8rem;
  height: 2.3rem;
  border-radius: 999px;
  background: var(--vs-recessed);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18);
  color: var(--vs-text-2);
}
.settings-search .material-symbols-outlined { font-size: 1.15rem; }
.settings-search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--vs-text);
  font: inherit;
  font-size: 0.92rem;
}
.settings-search input::placeholder { color: var(--vs-text-3); }
.settings-search input::-webkit-search-cancel-button { filter: invert(1); opacity: 0.6; }
:root[data-appearance="light"] .settings-search input::-webkit-search-cancel-button { filter: none; }

.settings-nav-list {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}

.settings-nav-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 0.75rem;
  border-radius: 14px;
  cursor: pointer;
  font-size: 0.95rem;
  color: var(--vs-text);
  transition: background 0.18s var(--vs-ease);
}
.settings-nav-item:hover { background: var(--vs-fill); }
.settings-nav-item.active {
  background: var(--vs-fill-3);
  box-shadow: inset 0 0 0 1px var(--vs-stroke), 0 1px 3px rgba(0, 0, 0, 0.06);
  font-weight: 600;
}

.settings-nav-icon {
  width: 1.6rem;
  height: 1.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  color: var(--vs-text);
  flex-shrink: 0;
}

.settings-nav-empty {
  padding: 0.6rem 0.75rem;
  color: var(--vs-text-3);
  font-size: 0.88rem;
}

.settings-content {
  flex-grow: 1;
  overflow: auto;
  padding: 2.1rem 2.4rem 2.5rem;
  box-sizing: border-box;
}

/* Page */
.settings-page {
  max-width: 42rem;
  margin: 0 auto;
}

.settings-page-title {
  font-size: 2.1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 0.35rem;
}

.settings-page-subtitle {
  color: var(--vs-text-2);
  margin: 0 0 1.4rem;
  font-size: 0.95rem;
  line-height: 1.45;
}

.settings-section-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--vs-text);
  margin: 1.9rem 0 0.65rem;
  letter-spacing: 0;
  text-transform: none;
}

.muted-small {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--vs-text-2);
}
.hint {
  font-size: 0.85rem;
  line-height: 1.45;
  color: var(--vs-text-3);
}

/* Platters */
.settings-group {
  background: var(--vs-fill);
  border-radius: var(--vs-radius-lg);
  box-shadow: inset 0 0 0 1px var(--vs-stroke);
  overflow: hidden;
}

.settings-group-title {
  padding: 0.95rem 1.15rem 0.2rem;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--vs-text-2);
}

.settings-group-body {
  display: flex;
  flex-direction: column;
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 2.6rem;
  padding: 0.75rem 1.15rem;
  border-bottom: 1px solid var(--vs-separator);
}
.settings-row:last-child { border-bottom: none; }

.settings-row-label {
  flex: 1;
  font-size: 0.95rem;
}

.settings-row-icon {
  width: 2.1rem;
  height: 2.1rem;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
}

.settings-row-text {
  flex-grow: 1;
  min-width: 0;
}

.settings-row-title {
  font-size: 0.95rem;
  font-weight: 500;
}

.settings-row-subtitle {
  font-size: 0.82rem;
  color: var(--vs-text-2);
  text-decoration: none;
  word-break: break-all;
}
.settings-row-subtitle:hover { text-decoration: underline; }

.settings-hint {
  color: var(--vs-text-3);
  font-size: 0.84rem;
  margin-top: 1.25rem;
  line-height: 1.55;
}
.settings-hint code { color: var(--vs-text-2); }

/* Segmented control with a sliding thumb (e.g. Window Manager › Themes › Mode).
   Markup: .vs-segmented[style=--count:N;--index:i] > .vs-segmented-thumb + button.vs-segment×N */
.vs-segmented {
  position: relative;
  display: grid;
  grid-template-columns: repeat(var(--count, 2), 1fr);
  padding: 3px;
  border-radius: 999px;
  background: var(--vs-recessed);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.14);
}
.vs-segmented-thumb {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc((100% - 6px) / var(--count, 2));
  border-radius: 999px;
  background: var(--vs-fill-3);
  box-shadow: inset 0 0 0 1px var(--vs-stroke), 0 2px 8px rgba(0, 0, 0, 0.16);
  transform: translateX(calc(100% * var(--index, 0)));
  transition: transform 0.28s var(--vs-ease);
}
.settings-content .vs-segment {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.5rem 0.6rem;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--vs-text-2);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.2s var(--vs-ease);
}
.settings-content .vs-segment .material-symbols-outlined { font-size: 1.15rem; }
.settings-content .vs-segment:hover { color: var(--vs-text); }
.settings-content .vs-segment.active { color: var(--vs-text); font-weight: 600; }

/* Buttons a section styles itself (option lists, cards) still take the text color. */
.settings-content button:not(.settings-btn) { font-family: inherit; color: inherit; }

/* Capsule buttons */
.settings-btn {
  padding: 0.5rem 1.1rem;
  border-radius: 999px;
  border: 0;
  background: var(--vs-fill-2);
  box-shadow: inset 0 0 0 1px var(--vs-stroke);
  color: var(--vs-text);
  cursor: pointer;
  font: inherit;
  font-size: 0.88rem;
  font-weight: 500;
  white-space: nowrap;
  transition: background 0.18s var(--vs-ease), transform 0.18s var(--vs-ease);
}
.settings-btn:hover { background: var(--vs-fill-3); }
.settings-btn:active { transform: scale(0.97); }
.settings-btn.primary {
  background: var(--vs-strong);
  box-shadow: none;
  color: var(--vs-on-strong);
}
.settings-btn.primary:hover { filter: brightness(1.08); }
.settings-btn:disabled { opacity: 0.45; cursor: default; transform: none; }

/* Fields */
.settings-input,
.settings-content input[type="text"],
.settings-content input[type="search"],
.settings-content input[type="number"],
.settings-content input[type="url"],
.settings-content input:not([type]),
.settings-content select,
.settings-content textarea {
  padding: 0.55rem 0.9rem;
  border: 0;
  border-radius: var(--vs-radius-sm);
  background: var(--vs-recessed);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18);
  color: var(--vs-text);
  font: inherit;
  font-size: 0.9rem;
  outline: none;
}
.settings-input { flex-grow: 1; }
.settings-content input::placeholder,
.settings-content textarea::placeholder { color: var(--vs-text-3); }
.settings-content input:focus,
.settings-content select:focus,
.settings-content textarea:focus { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.18), 0 0 0 2px var(--vs-selected-rim); }
.settings-content select option { color: #1c1c1e; }

/* Switches (every checkbox in a section) */
.settings-content input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  flex-shrink: 0;
  width: 2.6rem !important;
  height: 1.55rem !important;
  margin: 0;
  border-radius: 999px;
  background: var(--vs-track);
  box-shadow: inset 0 0 0 1px var(--vs-stroke);
  cursor: pointer;
  transition: background 0.2s var(--vs-ease);
}
.settings-content input[type="checkbox"]::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: calc(1.55rem - 4px);
  height: calc(1.55rem - 4px);
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
  transition: transform 0.2s var(--vs-ease);
}
.settings-content input[type="checkbox"]:checked { background: var(--vs-on); }
.settings-content input[type="checkbox"]:checked::after { transform: translateX(1.05rem); }

.settings-content input[type="radio"] {
  appearance: none;
  -webkit-appearance: none;
  width: 1.15rem;
  height: 1.15rem;
  margin: 0;
  flex-shrink: 0;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--vs-text-3);
  cursor: pointer;
}
.settings-content input[type="radio"]:checked { background: var(--vs-strong); box-shadow: inset 0 0 0 4px var(--vs-strong), inset 0 0 0 10px var(--vs-on-strong); }
.settings-content input[type="radio"]:disabled { opacity: 0.4; cursor: default; }

.settings-content input[type="range"] { accent-color: var(--vs-strong); cursor: pointer; }

.settings-content input[type="color"] {
  -webkit-appearance: none;
  appearance: none;
  width: 2.4rem;
  height: 1.7rem;
  padding: 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  cursor: pointer;
}
.settings-content input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.settings-content input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 9px; box-shadow: inset 0 0 0 1px var(--vs-selected-rim); }

/* About */
.about-card {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  background: var(--vs-fill);
  box-shadow: inset 0 0 0 1px var(--vs-stroke);
  border-radius: var(--vs-radius-lg);
  padding: 1.3rem;
  margin-bottom: 1rem;
}
.about-avatar {
  width: 5rem;
  height: 5rem;
  border-radius: 50%;
  object-fit: cover;
  background: var(--vs-fill-2);
  box-shadow: 0 0 0 1px var(--vs-stroke);
}
.about-name { margin: 0; font-size: 1.35rem; font-weight: 600; }
.about-role { margin: 0.2rem 0 0; color: var(--vs-text-2); font-size: 0.92rem; }

/* Projects */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
  gap: 0.8rem;
}
.project-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.55rem;
  background: var(--vs-fill);
  box-shadow: inset 0 0 0 1px var(--vs-stroke);
  border-radius: var(--vs-radius-md);
  padding: 1.1rem 0.5rem;
  cursor: pointer;
  text-align: center;
  transition: background 0.18s var(--vs-ease), transform 0.18s var(--vs-ease);
}
.project-card:hover { background: var(--vs-fill-2); transform: translateY(-2px); }
.project-icon { width: 2.6rem; height: 2.6rem; object-fit: contain; }
.project-name { font-size: 0.8rem; word-break: break-word; color: var(--vs-text); }

/* Wallpapers */
.wallpaper-toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
.wallpaper-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1rem;
}
.wallpaper-card {
  position: relative;
  border-radius: var(--vs-radius-md);
  overflow: hidden;
  cursor: pointer;
  aspect-ratio: 16 / 10;
  box-shadow: 0 0 0 1px var(--vs-stroke), 0 6px 18px rgba(0, 0, 0, 0.18);
  transition: transform 0.18s var(--vs-ease);
}
.wallpaper-card:hover { transform: translateY(-2px); }
.wallpaper-card.active { box-shadow: 0 0 0 3px var(--vs-strong), 0 6px 18px rgba(0, 0, 0, 0.22); }
.wallpaper-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
.wallpaper-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0);
  transition: background 0.15s;
  color: #fff;
  font-size: 0.8rem;
  font-weight: 600;
  text-align: center;
}
.wallpaper-card:not(.active):hover .wallpaper-overlay { background: rgba(0, 0, 0, 0.35); }
.wallpaper-card:not(.active) .wallpaper-overlay-label { opacity: 0; transition: opacity 0.15s; }
.wallpaper-card:not(.active):hover .wallpaper-overlay-label { opacity: 1; }
.wallpaper-card.active .wallpaper-overlay { background: rgba(0, 0, 0, 0.18); }
.wallpaper-check { font-size: 2rem; color: #fff; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5)); }

/* Menus and dialogs: denser glass over the page */
.wallpaper-context-menu {
  position: fixed;
  z-index: 1000;
  min-width: 9rem;
  padding: 5px;
  border-radius: 14px;
  background: var(--vs-menu-bg);
  backdrop-filter: blur(30px) saturate(170%);
  -webkit-backdrop-filter: blur(30px) saturate(170%);
  box-shadow: inset 0 0 0 1px var(--vs-stroke), 0 12px 32px rgba(0, 0, 0, 0.35);
  overflow: hidden;
}
.wallpaper-context-menu button {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0.55rem 0.8rem;
  border-radius: 10px;
  font: inherit;
  font-size: 0.88rem;
  color: var(--vs-danger);
}
.wallpaper-context-menu button:hover { background: var(--vs-fill-2); }

.filepicker-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.filepicker-dialog {
  width: min(34rem, 90vw);
  height: min(28rem, 80vh);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: var(--vs-radius-lg);
  background: var(--vs-dialog-bg);
  backdrop-filter: blur(36px) saturate(170%);
  -webkit-backdrop-filter: blur(36px) saturate(170%);
  box-shadow: inset 0 0 0 1px var(--vs-stroke), 0 24px 60px rgba(0, 0, 0, 0.4);
  color: var(--vs-text);
}
.filepicker-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.9rem 1.1rem;
  border-bottom: 1px solid var(--vs-separator);
  font-weight: 600;
}
.filepicker-close { cursor: pointer; color: var(--vs-text-2); }
.filepicker-breadcrumbs {
  display: flex;
  align-items: center;
  gap: 0.2rem;
  padding: 0.45rem 1.1rem;
  font-size: 0.82rem;
  color: var(--vs-text-2);
  border-bottom: 1px solid var(--vs-separator);
  overflow-x: auto;
  white-space: nowrap;
}
.filepicker-breadcrumbs .crumb { cursor: pointer; padding: 0.15rem 0.45rem; border-radius: 999px; }
.filepicker-breadcrumbs .crumb:hover { background: var(--vs-fill-2); }
.filepicker-breadcrumbs .sep { font-size: 0.9rem; }
.filepicker-grid {
  flex-grow: 1;
  overflow: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr));
  gap: 0.5rem;
  padding: 0.8rem;
  align-content: flex-start;
}
.filepicker-empty {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--vs-text-3);
  padding: 2rem 0;
  font-size: 0.88rem;
}
.filepicker-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  padding: 0.45rem;
  border-radius: var(--vs-radius-sm);
  cursor: pointer;
}
.filepicker-item:hover { background: var(--vs-fill); }
.filepicker-item.selected { background: var(--vs-fill-3); box-shadow: inset 0 0 0 1px var(--vs-stroke); }
.filepicker-icon {
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 10px;
  background-color: var(--vs-fill-2);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--vs-text-2);
}
.filepicker-name {
  font-size: 0.74rem;
  text-align: center;
  word-break: break-word;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
